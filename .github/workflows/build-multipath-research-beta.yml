            'protocol/multipath/stream/records.go':'b4f90337ff63bf6af531dada54aa5b508c6ba883334de290e73e96ed472f1903',
            'protocol/multipath/stream/records_test.go':'f66daaacfc75eb676100cd1aaa94e21208ece1301c4b6e5efe09e7d1286a5f5f',
            'protocol/multipath/audit/analyzer.go':'dcda89bfc030f9c135e1851b24e54853b8aa88006b57e1ec56712f6d9e86e4c4',
            'protocol/multipath/audit/audit_test.go':'64cfd5d182028abef1669221906486ac1c0607d32c01cacc25cf1eb95628906b',
            'protocol/multipath/audit/coverage.go':'d3385555fc774701cd0adecca0b8a5738a0d3487c172dc187053adf97ef2d1bf',
            'protocol/multipath/audit/event.go':'7953044aa94246846fce722e8a3b03e97897fbdc1e106d1b46dfeae4f21be4d5',
            'protocol/multipath/audit/event_type.go':'44c81e47484ebe7fc39e3b5a74b3de745554b41c6e57645e06e41f0aaa26dc35',
            'protocol/multipath/audit/parser.go':'85a55ea31c5b9902150a2d9bffc0c688669da3ca1870b34248f79ba75bc34037',
            'protocol/multipath/audit/schema.go':'70d88d2cbad80ab00a2c353f5bf36509baa508999bbe6a2c3397b1fbf0c387ff',
            'protocol/multipath/audit/aggregation.go':'dad28f0a87619c54c19e9e9a976f724b6758445fe344f388961c0cfa6dfca462',
            'protocol/multipath/audit/aggregation_v3_test.go':'286e9699d92ae0be3683d53e3090eda6300ac0b07ce60bd49ce697b9ce369df1',
            'protocol/multipath/audit/diagnosis.go':'55d697fd311dacd4340f304e6756d9748fe429ceaacc06902bd1e4e0c31c40e3',
