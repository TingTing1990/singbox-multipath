name: Build Multipath Research Beta

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Repaired source branch/tag/commit to audit and build
        required: true
        default: feature/multipath-research-beta
        type: string

permissions:
  contents: read

concurrency:
  group: multipath-server-audit-v3-${{ inputs.source_ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.5'
  VERSION: '1.14.0-multipath-beta6'
  FROZEN_GOLDEN_SHA: 'e4245b3e7c79b1b90f2b36ddec36e8af2e63c2a6'
  FROZEN_GOLDEN_TREE: '9dc79da54ffa4604c4649050915c7c5edc9d04f0'
  B9_UPSTREAM_COMMIT: '9721ae7e3dd4da02a2baf9bb4461316e0aeeaf7d'

jobs:
  audit_test:
    name: Frozen delta + A provenance + B9 guard + impacted regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      parent_sha: ${{ steps.resolve.outputs.parent_sha }}

    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup exact Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve exact candidate against immutable Golden
        id: resolve
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REF"
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          grep -Fx "go ${GO_VERSION}" go.mod
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse "${FROZEN_GOLDEN_SHA}^{tree}")" = "$FROZEN_GOLDEN_TREE"
          test "$(git merge-base "$CANDIDATE_SHA" "$FROZEN_GOLDEN_SHA")" = "$FROZEN_GOLDEN_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "parent_sha=$FROZEN_GOLDEN_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$CANDIDATE_SHA"
          echo "golden_sha=$FROZEN_GOLDEN_SHA"
          echo "golden_tree=$FROZEN_GOLDEN_TREE"
          echo "b9_upstream_commit=$B9_UPSTREAM_COMMIT"
          echo "go=$(go version)"

      - name: Verify exact repaired source identities
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          expected={
            'protocol/multipath/budget_stream.go':'129209b2029e94b4af8fa8f8860b4673310b33371c6d89523fbdceb02a3888be',
