            ('v3-offline-instance-cross-contamination','protocol/multipath/audit/field_replay.go',
             '\t\tif strings.Contains(line, marker) || strings.Contains(line, capacityMarker) {',
             '\t\tif strings.Contains(line, marker) || strings.Contains(line, capacityMarker) || strings.Contains(line, "other-instance") {',
             '^TestOfflineClosureExplicitInstanceBindingPreservesExactCAPState$'),
            ('v3-offline-cap-state-loss','protocol/multipath/audit/timeline.go',
             '\t\t\twindow.ServerTargetMbps = latestEvent.TargetMbps',
             '\t\t\twindow.ServerTargetMbps = 0',
             '^TestOfflineClosureExplicitInstanceBindingPreservesExactCAPState$'),
            ('v3-offline-cap-endpoint-full-window','protocol/multipath/audit/timeline.go',
             '\t\t\tcoveredDuration += overlap',
             '\t\t\tcoveredDuration = window.Duration',
             '^TestCAPStatisticalIntervalDoesNotFillUncoveredClientTail$'),
            ('v3-offline-cap-sequence-gap-bridged','protocol/multipath/audit/field_replay.go',
             '\t\tconsecutive := current.ControllerWindowSeq == previous.value.ControllerWindowSeq+1',
             '\t\tconsecutive := true',
             '^TestOfflineClosureCAPIntervalRequiresConsecutiveSequence$'),
            ('v3-offline-cap-time-rollback-bridged','protocol/multipath/audit/field_replay.go',
             '\t\tstrictlyForward := current.At.After(previous.maxObserved)',
             '\t\tstrictlyForward := true',
             '^TestOfflineClosureCAPIntervalDoesNotBridgeTimeRollback$'),
            ('v3-offline-cap-rebind-retains-old','protocol/multipath/audit/timeline.go',
             '\t\tresetServerCapacityCorrelation(&timeline.Windows[windowIndex])',
             '\t\tif false { resetServerCapacityCorrelation(&timeline.Windows[windowIndex]) }',
             '^TestOfflineClosureRebindingClearsPreviousInstanceEvidence$'),
            ('v3-offline-status-sample-dup','protocol/multipath/audit/field_acquisition.go',
             '\tif s.haveLast && identity == s.lastIdentity {',
             '\tif false && s.haveLast && identity == s.lastIdentity {',
             '^TestOfflineClosureStatusCaptureDeduplicatesAndRejectsIdentityMutation$'),
            ('v3-offline-cross-end-time-fail-open','protocol/multipath/audit/field_replay.go',
             '\tif correlatedCapacityWindows == 0 {',
             '\tif false && correlatedCapacityWindows == 0 {',
             '^TestOfflineClosureReplayRejectsNonOverlappingCAPEvidence$'),
            ('v3-offline-required-status-field-drop','protocol/multipath/audit/status.go',
             '\t\t"activation_window_ms", "chunk_size", "queue_frames", "queue_bytes", "max_reorder_frames", "max_reorder_bytes",',
             '\t\t"chunk_size", "queue_frames", "queue_bytes", "max_reorder_frames", "max_reorder_bytes",',
             '^TestOfflineClosureParseStatusRejectsMissingFrozenRequiredField$'),
            ('v3-offline-latest-cap-state-loss','protocol/multipath/audit/timeline.go',
             '\t\t\twindow.ServerProtectedMbps = latestEvent.ProtectedMbps',
             '\t\t\twindow.ServerProtectedMbps = latestWindow.ProtectedMbps',
             '^TestOfflineClosureLatestCAPEventPreservesInWindowStateChange$'),
          ]
          for name,rel,old,new,test in mutations:
              work=temp/name
              subprocess.check_call(['git','worktree','add','--detach',str(work),candidate],cwd=root,stdout=subprocess.DEVNULL)
              try:
                  p=work/rel; text=p.read_text()
                  if text.count(old)!=1: raise RuntimeError(f'{name} anchor count={text.count(old)}')
                  p.write_text(text.replace(old,new,1))
                  compile=subprocess.run(['go','test','-count=1','-timeout=10m','-tags',tags,'-run','^$','./protocol/multipath/audit'],cwd=work,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  if compile.returncode!=0: raise RuntimeError(f'{name}: invalid mutant compile failed\n{compile.stdout}')
                  run=subprocess.run(['go','test','-json','-count=1','-timeout=10m','-tags',tags,'-run',test,'./protocol/multipath/audit'],cwd=work,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  print(run.stdout)
                  expected=test[1:-1]
                  ran=failed=False
                  for line in run.stdout.splitlines():
                      try: event=json.loads(line)
                      except json.JSONDecodeError: continue
                      if event.get('Test') != expected: continue
                      if event.get('Action') == 'run': ran=True
                      elif event.get('Action') == 'fail': failed=True
                  if run.returncode==0: raise RuntimeError(f'{name}: mutant survived {test}')
                  if not ran or not failed: raise RuntimeError(f'{name}: target test did not fail correctly {test}')
                  print('KILLED',name,'BY',test)
              finally:
                  subprocess.run(['git','worktree','remove','--force',str(work)],cwd=root,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          print('ALL 15 V3 REPAIR/OFFLINE-CLOSURE MUTANTS KILLED')
          PY

      - name: Existing repeated-booster-disconnect regression x20
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go test -count=20 -timeout=10m -tags "$BUILD_TAGS" \
            -run '^TestFlowRegressionRepeatedBoosterDisconnect$' ./protocol/multipath \
            2>&1 | tee "${EVIDENCE_DIR}/repeated-booster-disconnect-x20.log"

      - name: Mutation controls for rejected B and upstream guard
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import os, shutil, subprocess
          root=Path(os.environ['GITHUB_WORKSPACE'])
          candidate=subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()
          temp=Path(os.environ['MUTANT_ROOT'])
          tags=os.environ['BUILD_TAGS']
          mutations=[
            ('06-observer-memory-side-effect','protocol/multipath/download_audit.go',
             'm, _ := downloadMemory(a.memory)',
             'a.memory.snapshot(); m, _ := downloadMemory(a.memory)',
             '^TestDownloadObserverCannotAdvanceMemoryControl$','native'),
            ('05-staged-tail-retention','protocol/multipath/stream/records.go',
             'if *charged > 0 && live+spare <= len(fixed) {',
             'if false && *charged > 0 && live+spare <= len(fixed) {',
             '^TestIndependentRetentionContractStagedACK$','native'),
            ('01-accumulate-released-credit','protocol/multipath/memory.go',
             '\t\tb.used -= int64(size)\n\t\tif b.used < 0 {',
             '\t\t// MUTANT: released backing remains charged.\n\t\tif b.used < 0 {',
             '^TestRepairIndependentRepeatedRoundCredit$','independent'),
            ('02-runtime-guard-no-restore','protocol/multipath/memory_runtime.go',
             '\t\tdebug.SetMemoryLimit(g.previous)\n',
             '\t\t// MUTANT: leak process runtime memory limit.\n',
             '^TestRuntimeMemoryGuardOwnership$','native'),
            ('03-ignore-gomemlimit','protocol/multipath/memory_runtime.go',
             '\t\tif explicit || current != math.MaxInt64 {\n',
             '\t\tif (explicit && false) || current != math.MaxInt64 {\n',
             '^TestRuntimeMemoryGuardOwnership$','native'),
            ('04-break-cgroup-parent-walk','protocol/multipath/memory_available_linux.go',
             '\t\t\t\tif dir == mount {\n',
             '\t\t\t\tif true {\n',
             '^TestCgroupAvailableMemory$','native'),
          ]
          for name,rel,old,new,test,kind in mutations:
              work=temp/name
              subprocess.check_call(['git','worktree','add','--detach',str(work),candidate],cwd=root,stdout=subprocess.DEVNULL)
              try:
                  p=work/rel; s=p.read_text()
                  if s.count(old)!=1: raise RuntimeError(f'{name} anchor count={s.count(old)}')
                  p.write_text(s.replace(old,new,1))
                  if kind=='independent':
                      src=Path(os.environ['INDEPENDENT_DIR'])/'protocol/multipath/zz_memory_repair_independent_test.go'
                      shutil.copyfile(src,work/'protocol/multipath/zz_memory_repair_independent_test.go')
                  compile=subprocess.run(['go','test','-count=1','-timeout=10m','-tags',tags,'-run','^$','./protocol/multipath'],cwd=work,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  if compile.returncode!=0: raise RuntimeError(f'{name}: invalid mutant compile failed\n{compile.stdout}')
                  run=subprocess.run(['go','test','-json','-count=1','-timeout=10m','-tags',tags,'-run',test,'./protocol/multipath'],cwd=work,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  print(run.stdout)
                  expected_test=test[1:-1]
                  ran=failed=False
                  import json
                  for line in run.stdout.splitlines():
                      try: event=json.loads(line)
                      except json.JSONDecodeError: continue
                      if event.get('Test') != expected_test: continue
                      if event.get('Action') == 'run': ran=True
                      elif event.get('Action') == 'fail': failed=True
                  if run.returncode==0: raise RuntimeError(f'{name}: mutant survived {test}')
                  if not ran: raise RuntimeError(f'{name}: invalid result; target test did not run {test}')
                  if not failed: raise RuntimeError(f'{name}: invalid result; nonzero exit without target test failure {test}')
                  print('KILLED',name,'BY',test)
              finally:
                  subprocess.run(['git','worktree','remove','--force',str(work)],cwd=root,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          print('ALL 6 REPAIR MUTANTS KILLED')
          PY

      - name: Server download producer and independent rejection contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/verify-download-boundary.py | tee "${EVIDENCE_DIR}/download-boundary.log"
          CGO_ENABLED=1 go test -race -count=10 -timeout=5m -tags "$BUILD_TAGS" \
            -run '^(TestDownload|TestServerDownload)' ./protocol/multipath/... \
            2>&1 | tee "${EVIDENCE_DIR}/download-contracts.log"
          export DOWNLOAD_AUDIT_EVIDENCE_DIR="${EVIDENCE_DIR}/download-collector"
          export DOWNLOAD_AUDIT_OFFLINE_BIN="${RUNNER_TEMP}/multipath-download-audit"
          go test -count=1 -timeout=60s -tags "$BUILD_TAGS" -run '^TestDownloadProducerToOffline$' ./protocol/multipath
          go build -trimpath -o "$DOWNLOAD_AUDIT_OFFLINE_BIN" ./cmd/multipath-download-audit
          python3 -B tools/test-download-collector.py 2>&1 | tee "${EVIDENCE_DIR}/download-collector-local.log"
          # Real runtime producer + mocked systemd pipe is LOCAL integration.
          # It MUST NOT be labelled target-VPS FIELD acceptance.

      - name: Check formatting of exact repair write-set
        shell: bash
        run: |
          set -euo pipefail
          files=(
            cmd/multipath-download-audit/main.go
            option/multipath.go
            protocol/multipath/audit/server_download.go
            protocol/multipath/audit/server_download_bundle.go
            protocol/multipath/audit/server_download_test.go
            protocol/multipath/core.go
            protocol/multipath/download_audit.go
            protocol/multipath/download_audit_test.go
            protocol/multipath/downloadevidence/schema.go
            protocol/multipath/f01_staged_ack_test.go
            protocol/multipath/inbound.go
            protocol/multipath/scheduler.go
            protocol/multipath/transport.go
            protocol/multipath/types.go

            protocol/multipath/budget_stream.go protocol/multipath/capacity.go protocol/multipath/core.go
            protocol/multipath/inbound.go protocol/multipath/memory.go protocol/multipath/memory_available_linux.go
            protocol/multipath/outbound.go protocol/multipath/scheduler.go protocol/multipath/stream/path.go
            protocol/multipath/stream/send.go protocol/multipath/transport.go protocol/multipath/types.go
            protocol/multipath/f01_memory_test.go protocol/multipath/f01_retention_contract_test.go
            protocol/multipath/f01_staged_ack_test.go protocol/multipath/memory_available_linux_test.go
            protocol/multipath/memory_runtime.go protocol/multipath/memory_runtime_test.go
            protocol/multipath/stream/records.go protocol/multipath/stream/records_test.go
            protocol/multipath/audit/analyzer.go protocol/multipath/audit/audit_test.go
            protocol/multipath/audit/coverage.go protocol/multipath/audit/event.go
            protocol/multipath/audit/event_type.go protocol/multipath/audit/parser.go protocol/multipath/audit/schema.go
            protocol/multipath/audit/aggregation.go protocol/multipath/audit/aggregation_v3_test.go
            protocol/multipath/audit/diagnosis.go protocol/multipath/audit/field_replay.go protocol/multipath/audit/field_replay_test.go
            protocol/multipath/audit/status.go protocol/multipath/audit/status_v3_test.go
            protocol/multipath/audit/timeline.go protocol/multipath/audit/timeline_v3_test.go protocol/multipath/audit/v3_test_helpers_test.go
          )
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then printf '%s\n' "$unformatted"; exit 1; fi

      - name: Go vet impacted packages
        shell: bash
        run: |
          set -euo pipefail
          go vet -tags "$BUILD_TAGS" ./protocol/multipath/...

      - name: Compile all repository packages without running tests
        shell: bash
        run: |
          set -euo pipefail
          go test -run '^$' -count=1 -timeout=20m -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" ./...

      - name: Full impacted multipath regression with race detector once
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go test -race -count=1 -timeout=20m -skip '^TestPerformanceHealthyLinks$' \
            -tags "$BUILD_TAGS" ./protocol/multipath/... 2>&1 | tee "${EVIDENCE_DIR}/multipath-full-race.log"

      - name: Golden vs repaired zero-field performance differential
        shell: bash
        run: |
          set -euo pipefail
          LOG_DIR="${RUNNER_TEMP}/capacity-v2-perf"
          mkdir -p "$LOG_DIR"
          run_perf() {
            local tree="$1"
            local label="$2"
            local run_id="$3"
            local log="$LOG_DIR/${label}-${run_id}.log"
            set +e
            (
              cd "$tree"
              CGO_ENABLED=1 go test \
                -race \
                -count=1 \
                -timeout=5m \
                -v \
                -tags "$BUILD_TAGS" \
                -run '^TestPerformanceHealthyLinks$' \
                ./protocol/multipath
            ) 2>&1 | tee "$log"
            local rc=${PIPESTATUS[0]}
            set -e
            echo "${label}_run_${run_id}_go_test_rc=${rc}"
          }
          run_perf "$PARENT_DIR" golden 1
          run_perf "$GITHUB_WORKSPACE" repaired 1
          run_perf "$PARENT_DIR" golden 2
          run_perf "$GITHUB_WORKSPACE" repaired 2
          python3 - "$LOG_DIR" <<'PY'
          from pathlib import Path
          import re, statistics, sys
          d=Path(sys.argv[1])
          expected=['1_160+600Mbps_65+110ms','8_160+600Mbps_65+110ms','32_160+600Mbps_65+110ms',
                    '1_40+50Mbps_65+110ms','8_40+50Mbps_65+110ms','1_160+600Mbps_65+400ms',
                    '8_160+600Mbps_65+400ms','1_160+600Mbps_110+65ms','1_160+600Mbps_5+10ms',
                    '8_160+600Mbps_5+10ms','1_1000+1000Mbps_65+110ms']
          run_re=re.compile(r'^=== RUN\s+TestPerformanceHealthyLinks/(.+)$')
          rate_re=re.compile(r'performance_test\.go:\d+: flows=\d+ .*?Mbps=([0-9]+(?:\.[0-9]+)?)')
          forbidden=(
              'healthy reliable legs triggered replay','unused window credit caused memory pressure',
              'memory budget exceeded','short stream:','panic:','fatal error:','test timed out','DATA RACE',
          )
          diagnostic_re=re.compile(r'performance_test\.go:\d+: (.*)$')
          def parse(p):
              text=p.read_text(encoding='utf-8',errors='replace')
              for x in forbidden:
                  if x in text: raise SystemExit(f'FAIL {p.name}: unsafe fixture result: {x}')
              cur=None; values={}
              for line in text.splitlines():
                  d=diagnostic_re.search(line)
                  if d:
                      msg=d.group(1)
                      if not (msg.startswith('throughput regression:') or msg.startswith('flows=')):
                          raise SystemExit(f'FAIL {p.name}: unexpected performance diagnostic: {msg}')
                  m=run_re.search(line)
                  if m: cur=m.group(1); continue
                  m=rate_re.search(line)
                  if m and cur: values[cur]=float(m.group(1))
              missing=sorted(set(expected)-set(values)); extra=sorted(set(values)-set(expected))
              if missing or extra: raise SystemExit(f'FAIL {p.name}: missing={missing} extra={extra}')
              return values
          samples={k:[parse(d/f'{k}-1.log'),parse(d/f'{k}-2.log')] for k in ('golden','repaired')}
          failed=False
          for case in expected:
              gv=[x[case] for x in samples['golden']]; rv=[x[case] for x in samples['repaired']]
              ratio=statistics.median(rv)/statistics.median(gv)
              print(f'{case}: golden={gv} repaired={rv} ratio={ratio:.4f}')
              failed |= ratio < 0.98
          if failed: raise SystemExit('FAIL repaired zero-field performance below 98% Golden')
          print('PASS repaired retains >=98% Golden performance for all fixtures')
          PY

      - name: Remove runner-only V3 FIELD replay fixtures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf protocol/multipath/audit/testdata

      - name: Verify workspace remained pristine
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: memory-repair-audit-evidence
          path: ${{ runner.temp }}/memory-repair-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup audit worktrees
        if: always()
        shell: bash
        run: |
          set +e
          git worktree remove --force "${GOLDEN_DIR:-}" >/dev/null 2>&1 || true
          git worktree remove --force "${INDEPENDENT_DIR:-}" >/dev/null 2>&1 || true
          git worktree prune || true

  build_targets:
    name: Build ${{ matrix.label }}
    needs: audit_test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            binary: sing-box-1.14.0-multipath-beta6-darwin-amd64
          - label: Windows amd64
            runner: windows-2025
            goos: windows
            goarch: amd64
            binary: sing-box-1.14.0-multipath-beta6-windows-amd64.exe
          - label: Linux amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            binary: sing-box-1.14.0-multipath-beta6-linux-amd64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.audit_test.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup exact Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: Verify exact audited source and native runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.audit_test.outputs.candidate_sha }}"
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          test "$(go env GOHOSTARCH)" = "amd64"
          test "$(go env GOHOSTOS)" = "${{ matrix.goos }}"
          echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
          echo "go=$(go version)"
          echo "audited_commit=$(git rev-parse HEAD)"

      - name: Set build inputs
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TAGS="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_OTHERS)"
          LDFLAGS_SHARED="$(tr -d '\r\n' < release/LDFLAGS)"
          test -n "$BUILD_TAGS"
          echo "BUILD_TAGS=$BUILD_TAGS" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$LDFLAGS_SHARED" >> "$GITHUB_ENV"

      - name: Native impacted multipath regression Linux/macOS
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -timeout=20m -skip '^TestPerformanceHealthyLinks$' \
            -tags "$BUILD_TAGS" ./protocol/multipath/...

      - name: Native impacted multipath regression Windows
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -timeout=20m -skip '^(TestPerformanceHealthyLinks|TestCoreSenderStatusAndRTTProbe)$' \
            -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" ./protocol/multipath/...

      - name: Build standalone core
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -v -trimpath -tags "$BUILD_TAGS" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            -o "dist/${{ matrix.binary }}" ./cmd/sing-box

      - name: Smoke-test built binary and embedded version
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.binary }}"
          if [[ "${{ matrix.goos }}" != "windows" ]]; then chmod +x "$BIN"; fi
          test -s "$BIN"
          ACTUAL_VERSION="$("./$BIN" version -n | tr -d '\r\n')"
          test "$ACTUAL_VERSION" = "$VERSION"
          VERSION_OUTPUT="$("./$BIN" version)"
          printf '%s\n' "$VERSION_OUTPUT"
          grep -F "Environment: go${GO_VERSION} ${{ matrix.goos }}/${{ matrix.goarch }}" <<< "$VERSION_OUTPUT"
          grep -F 'CGO: disabled' <<< "$VERSION_OUTPUT"

      - name: Build server download offline tool and collector
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          OFFLINE="dist/multipath-download-audit-${GOOS}-${GOARCH}"
          if [[ "$GOOS" == "windows" ]]; then OFFLINE="${OFFLINE}.exe"; fi
          go build -trimpath -ldflags '-s -w -buildid=' -o "$OFFLINE" ./cmd/multipath-download-audit
          "$OFFLINE" -h
          cp tools/collect-multipath-download.py dist/
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 "$OFFLINE" dist/collect-multipath-download.py > dist/download-tools.sha256
          else
            sha256sum "$OFFLINE" dist/collect-multipath-download.py > dist/download-tools.sha256
          fi

      - name: Produce checksum and build provenance
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.binary }}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then shasum -a 256 "$BIN" > "${BIN}.sha256"; else sha256sum "$BIN" > "${BIN}.sha256"; fi
          {
            echo "version=${VERSION}"
            echo "source_ref=${SOURCE_REF}"
            echo "commit=${{ needs.audit_test.outputs.candidate_sha }}"
            echo "golden_commit=${{ needs.audit_test.outputs.parent_sha }}"
            echo "golden_tree=${FROZEN_GOLDEN_TREE}"
            echo "b9_upstream_commit=${B9_UPSTREAM_COMMIT}"
            echo "go_version=$(go env GOVERSION)"
            echo "target=${{ matrix.goos }}/${{ matrix.goarch }}"
            echo "cgo=0"
            echo "build_tags=${BUILD_TAGS}"
            echo "binary=${{ matrix.binary }}"
          } > "${BIN}.buildinfo.txt"
          cat "${BIN}.sha256"
          cat "${BIN}.buildinfo.txt"

      - name: Upload verified binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: |
            dist/${{ matrix.binary }}
            dist/${{ matrix.binary }}.sha256
            dist/${{ matrix.binary }}.buildinfo.txt
            dist/multipath-download-audit-*
            dist/collect-multipath-download.py
            dist/download-tools.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
