             'Support:            SupportOpen,\n\t\t\tEvidence:           "the frozen source emits no per-decision scheduler evidence",\n\t\t\tRequiresFrozenHook: true,',
             'Support:  SupportFull,\n\t\t\tEvidence: "MUTANT",',
             '^TestCoverageDoesNotClaimFrozenInternals$'),
            ('audit-03-recovery-normal-admission','protocol/multipath/audit/analyzer.go',
             'if state.NormalBoosterAdmitted {\n\t\t\t\treturn fmt.Errorf("recovery bypass cannot be reported as normal booster admission")\n\t\t\t}',
             'if false && state.NormalBoosterAdmitted {\n\t\t\t\treturn fmt.Errorf("recovery bypass cannot be reported as normal booster admission")\n\t\t\t}',
             '^TestValidateCapacityRejectsSemanticDrift$'),
          ]
          for name,rel,old,new,test in mutations:
              work=temp/name
              subprocess.check_call(['git','worktree','add','--detach',str(work),candidate],cwd=root,stdout=subprocess.DEVNULL)
              try:
                  p=work/rel; text=p.read_text()
                  if text.count(old)!=1: raise RuntimeError(f'{name} anchor count={text.count(old)}')
                  p.write_text(text.replace(old,new,1))
                  compile=subprocess.run(['go','test','-count=1','-timeout=10m','-tags',tags,'-run','^$','./protocol/multipath/audit'],cwd=work,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  if compile.returncode!=0: raise RuntimeError(f'{name}: invalid mutant compile failed\n{compile.stdout}')
                  run=subprocess.run(['go','test','-json','-count=1','-timeout=10m','-tags',tags,'-run',test,'./protocol/multipath/audit'],cwd=work,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  print(run.stdout)
                  expected=test[1:-1]
                  ran=failed=False
                  for line in run.stdout.splitlines():
                      try: event=json.loads(line)
                      except json.JSONDecodeError: continue
                      if event.get('Test') != expected: continue
                      if event.get('Action') == 'run': ran=True
                      elif event.get('Action') == 'fail': failed=True
                  if run.returncode==0: raise RuntimeError(f'{name}: mutant survived {test}')
                  if not ran or not failed: raise RuntimeError(f'{name}: target test did not fail correctly {test}')
                  print('KILLED',name,'BY',test)
              finally:
                  subprocess.run(['git','worktree','remove','--force',str(work)],cwd=root,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          print('ALL 3 SERVER AUDIT V2 MUTANTS KILLED')
          PY

