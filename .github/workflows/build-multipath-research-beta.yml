            'protocol/multipath/audit/timeline.go':'10705a37d05989c3ab727f6c8614e300a42866713c99cd8b01b0db6776f91049',
            'protocol/multipath/audit/timeline_v3_test.go':'27ab05035e1fde95bc0900d850890724ee42e9e9d4d01c9bfb7eb3d0c3e7556d',
            'protocol/multipath/audit/v3_test_helpers_test.go':'c21e170281b9ed254c5398f26468de5db0fdca2cd57511a0e67ff71b443f4390',
            'option/multipath.go':'769b02deee965dc443cabdb35de9b9fc3f93e1506330ad11a7c4ef918fa98d65',
            'cmd/multipath-download-audit/main.go':'f5f7c39f3627b3a0029739cae02a6c0345226420519c0112c0cf1d509f59af4d',
            'protocol/multipath/audit/server_download.go':'17af0a2f809a6f9a94d43372c0375ac96573d1847594efa41f4b39d1c40c551f',
            'protocol/multipath/audit/server_download_bundle.go':'3cd2168a8787ae2150a310a3045c8f3e966e7b1704db28146c5df34aaac83b56',
            'protocol/multipath/audit/server_download_test.go':'1e3f307f883e3c45222d5a62cc4447bcc2dc81ada3ec7b9c7e76734e5c31c727',
            'protocol/multipath/download_audit.go':'c64462b69c7d46932994eefd29bbf31fbf1f18911642fc9078658ccb662b7b72',
            'protocol/multipath/download_audit_test.go':'96b1879384baa03a2f979fdbfd59608a838b91d299bcc156f7a804608ae736bc',
            'protocol/multipath/downloadevidence/schema.go':'3dbc1fcbef06a11afa8bc0d2e21723558936c7d76356477311255c492be0b852',
            'tools/collect-multipath-download.py':'4c1976f9819e614b91f56dfb445b76f998c806e4af7e0bd26c1c5ac1e5e97e98',
            'tools/download-observation.patch':'bb13719f2aa6dff921fe9b3aaaad053a6e26ea4cf141a437bb28f2ce04b737dc',
            'tools/test-download-collector.py':'01cf9d8401c78a055ad2e9e4c15bd5bdbf073840df5fc9fd835c12952aabd391',
            'tools/verify-download-boundary.py':'957c742b1592941ed5254e808f81ce9aa79715dce5567cb322b49b9699866ae7',
          }
          for rel,want in expected.items():
              got=hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              if got != want:
                  raise SystemExit(f'FAIL identity {rel}: {got} != {want}')
              print('PASS',rel,got)
          PY

      - name: Set audited build inputs
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TAGS="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_OTHERS)"
          LDFLAGS_SHARED="$(tr -d '\r\n' < release/LDFLAGS)"
          test -n "$BUILD_TAGS"
          echo "BUILD_TAGS=$BUILD_TAGS" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$LDFLAGS_SHARED" >> "$GITHUB_ENV"

      - name: Materialize immutable Golden and evidence directories
        shell: bash
        run: |
          set -euo pipefail
          GOLDEN_DIR="${RUNNER_TEMP}/frozen-golden"
          INDEPENDENT_DIR="${RUNNER_TEMP}/independent-repair"
          MUTANT_ROOT="${RUNNER_TEMP}/repair-mutants"
          EVIDENCE_DIR="${RUNNER_TEMP}/memory-repair-evidence"
          git worktree prune || true
          rm -rf "$GOLDEN_DIR" "$INDEPENDENT_DIR" "$MUTANT_ROOT" "$EVIDENCE_DIR"
          mkdir -p "$MUTANT_ROOT" "$EVIDENCE_DIR"
          git worktree add --detach "$GOLDEN_DIR" "$FROZEN_GOLDEN_SHA"
          echo "GOLDEN_DIR=$GOLDEN_DIR" >> "$GITHUB_ENV"
          echo "PARENT_DIR=$GOLDEN_DIR" >> "$GITHUB_ENV"
          echo "INDEPENDENT_DIR=$INDEPENDENT_DIR" >> "$GITHUB_ENV"
          echo "MUTANT_ROOT=$MUTANT_ROOT" >> "$GITHUB_ENV"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"

      - name: Complete-tree and architecture boundary audit
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY' | tee "${EVIDENCE_DIR}/architecture-audit.log"
          from pathlib import Path
          import hashlib, os, re, subprocess
          ROOT=Path(os.environ['GITHUB_WORKSPACE'])
          GOLDEN=Path(os.environ['GOLDEN_DIR'])
          MOD={
            'option/multipath.go',
            'protocol/multipath/budget_stream.go','protocol/multipath/capacity.go','protocol/multipath/core.go',
            'protocol/multipath/inbound.go','protocol/multipath/memory.go','protocol/multipath/memory_available_linux.go',
            'protocol/multipath/outbound.go','protocol/multipath/scheduler.go','protocol/multipath/stream/path.go',
            'protocol/multipath/stream/send.go','protocol/multipath/transport.go','protocol/multipath/types.go'}
          ADD={
            'cmd/multipath-download-audit/main.go',
            'protocol/multipath/audit/server_download.go',
            'protocol/multipath/audit/server_download_bundle.go',
            'protocol/multipath/audit/server_download_test.go',
            'protocol/multipath/download_audit.go',
            'protocol/multipath/download_audit_test.go',
            'protocol/multipath/downloadevidence/schema.go',
            'tools/collect-multipath-download.py',
            'tools/download-observation.patch',
            'tools/test-download-collector.py',
            'tools/verify-download-boundary.py',

            'protocol/multipath/f01_memory_test.go','protocol/multipath/f01_retention_contract_test.go',
            'protocol/multipath/f01_staged_ack_test.go','protocol/multipath/memory_available_linux_test.go',
            'protocol/multipath/memory_runtime.go','protocol/multipath/memory_runtime_test.go',
            'protocol/multipath/stream/records.go','protocol/multipath/stream/records_test.go',
            'protocol/multipath/audit/analyzer.go','protocol/multipath/audit/audit_test.go',
            'protocol/multipath/audit/coverage.go','protocol/multipath/audit/event.go',
            'protocol/multipath/audit/event_type.go','protocol/multipath/audit/parser.go',
            'protocol/multipath/audit/schema.go','protocol/multipath/audit/aggregation.go',
            'protocol/multipath/audit/aggregation_v3_test.go','protocol/multipath/audit/diagnosis.go',
            'protocol/multipath/audit/field_replay.go','protocol/multipath/audit/field_replay_test.go',
            'protocol/multipath/audit/field_acquisition.go','protocol/multipath/audit/field_offline_closure_test.go',
            'protocol/multipath/audit/status.go','protocol/multipath/audit/status_v3_test.go',
            'protocol/multipath/audit/timeline.go','protocol/multipath/audit/timeline_v3_test.go',
            'protocol/multipath/audit/v3_test_helpers_test.go'}
          F01={
            'protocol/multipath/budget_stream.go':'129209b2029e94b4af8fa8f8860b4673310b33371c6d89523fbdceb02a3888be',
            'protocol/multipath/capacity.go':'b20e5703a8642a0e353f548b5f48a39d89a80c3aa2d9f626c18ace32d880b1dd',
            'protocol/multipath/core.go':'50577e0b8a883aeaf9321798fe0971ec19609a19e0f38ba9c5e8a253839f8e18',
            'protocol/multipath/f01_memory_test.go':'e1c5106a67879f7ff043aba94de9d310c3e0687497894f5d74b2001dbfbc4a9b',
            'protocol/multipath/f01_retention_contract_test.go':'331426c6e4ad825c56bacc066412ced5dc4debfa4fab6fdb3e30af5f41f0eeed',
            'protocol/multipath/scheduler.go':'0915d96d0a8a79f5815581513329e8c866bb9344ec1d25f570d12365518f30ca',
            'protocol/multipath/stream/path.go':'940da47ac9427c4d7f9d9e45f1633d1126320dbe6ae31f53b10bc36ccda6c00f',
            'protocol/multipath/stream/records.go':'b4f90337ff63bf6af531dada54aa5b508c6ba883334de290e73e96ed472f1903',
            'protocol/multipath/stream/send.go':'9788e65272784f6bda9364c68043e12c81636a2a5d452fae6d76814dbbd9c489',
            'protocol/multipath/transport.go':'141a760282dca81dbe516a2d8054ca0ec0bb05a00d6a6d4bed774336b2c10b57',
            'protocol/multipath/types.go':'36816988d72ac672e438e41899becfd9abeb2457326de1a0de6b7ef55172349c'}
          FORBIDDEN=('pendingReclaim','reclaimIssued','reclaimCompleted','reclaimRunning','memoryIdleReclaimDelay',
                     'memoryScavenge','retireDetached','reclaimCutoff','waitReclaim','prepareReservedRelease',
                     'prepareRelease','NewManagedBuffer','debug.FreeOSMemory')
          def req(v,m):
              if not v: raise RuntimeError(m)
          import runpy
          normalized=runpy.run_path(str(ROOT/'tools/verify-download-boundary.py'))['normalized_sources'](ROOT)
          def source(rel): return normalized[rel] if rel in normalized else (ROOT/rel).read_bytes()
          def sha(p): return hashlib.sha256(source(str(p.relative_to(ROOT)))).hexdigest()
          def tracked(root):
              raw=subprocess.check_output(['git','-C',str(root),'ls-files','-s','-z'])
              out={}
              for rec in raw.split(b'\0'):
                  if not rec: continue
                  meta,path=rec.split(b'\t',1); mode,oid,stage=meta.split()
                  req(stage==b'0','unmerged '+os.fsdecode(path))
                  out[os.fsdecode(path)]=(mode.decode(),oid.decode())
              return out
          def function(src,name):
              m=re.search(r'(?m)^func\s+(?:\([^\n]+\)\s+)?'+re.escape(name)+r'\s*\([^\n]*',src)
              req(m is not None,'missing function '+name)
              start=m.start(); brace=src.find('{',start); req(brace>=0,'missing brace '+name)
              d=0; q=None; esc=False
              for i in range(brace,len(src)):
                  c=src[i]
                  if q:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==q: q=None
                  else:
                      if c in ('"','`'): q=c
                      elif c=='{': d+=1
                      elif c=='}':
                          d-=1
                          if d==0: return src[start:i+1]
              raise RuntimeError('unclosed '+name)
          gt,rt=tracked(GOLDEN),tracked(ROOT)
          mod={p for p in gt.keys()&rt.keys() if gt[p]!=rt[p]}; add=set(rt)-set(gt); dele=set(gt)-set(rt)
          req(mod==MOD and add==ADD and not dele,f'write-set M={sorted(mod)} A={sorted(add)} D={sorted(dele)}')
          print(f'PASS exact Golden delta {len(MOD)}M/{len(ADD)}A/0D including modes/gitlinks')
          for rel,(mode,oid) in gt.items():
              if rel in MOD: continue
              req(rel in rt and rt[rel]==(mode,oid),'unapproved Golden drift '+rel)
          print('PASS complete-tree freeze outside authorized paths')
          for rel,want in F01.items(): req(sha(ROOT/rel)==want,'F01 byte drift '+rel)
          print('PASS F01/A identity after reversing approved download observation patch')
          for rel in ('protocol/multipath/wire.go','protocol/multipath/protocol.go','protocol/multipath/activation.go',
                      'protocol/multipath/telemetry.go','option/multipath.go','go.mod','go.sum',
                      'protocol/multipath/flow_fault_test.go','protocol/multipath/memory_test.go',
                      'protocol/multipath/recovery_packet.go','protocol/multipath/stream/receive.go',
                      'protocol/multipath/stream/stream_test.go'):
              req(source(rel)==(GOLDEN/rel).read_bytes(),'critical Golden drift '+rel)
          print('PASS frozen critical files and restored B-touched files exact Golden')
          prod='\n'.join(p.read_text(errors='replace') for p in (ROOT/'protocol/multipath').rglob('*.go') if not p.name.endswith('_test.go'))
          for token in FORBIDDEN: req(token not in prod,'rejected B token remains '+token)
          print('PASS rejected physical-credit B state machine absent')
          mem=(ROOT/'protocol/multipath/memory.go').read_text(); runtime=(ROOT/'protocol/multipath/memory_runtime.go').read_text(); avail=(ROOT/'protocol/multipath/memory_available_linux.go').read_text()
          req('processMemoryGuard.acquire()' in mem and 'func (b *memoryBudget) stopLogging()' in mem,'B9 guard lifecycle missing')
          for token in ('debug.SetMemoryLimit','os.LookupEnv("GOMEMLIMIT")','g.users++','once.Do(g.release)'): req(token in runtime,'B9 runtime contract missing '+token)
          for token in ('/proc/self/cgroup','/proc/self/mountinfo','memory.max','memory.current','memory.limit_in_bytes','memory.usage_in_bytes'): req(token in avail,'B9 cgroup contract missing '+token)
          req((ROOT/'protocol/multipath/inbound.go').read_text().count('i.cfg.Memory.stopLogging()')==1,'inbound close guard release')
          req((ROOT/'protocol/multipath/outbound.go').read_text().count('o.cfg.Memory.stopLogging()')==1,'outbound close guard release')
          print('PASS B9 runtime/cgroup guard integration bounded to logging lifecycle')
          for rel,line in (('protocol/multipath/inbound.go','\ti.cfg.Memory.stopLogging()\n'),('protocol/multipath/outbound.go','\to.cfg.Memory.stopLogging()\n')):
              current=source(rel).decode()
              req(current.count(line)==1,'compatibility hook count '+rel)
              req(current.replace(line,'').encode()==(GOLDEN/rel).read_bytes(),'non-hook drift '+rel)
          print('PASS inbound/outbound compatibility delta is exactly one upstream stopLogging hook each')
          for rel,name in (('protocol/multipath/scheduler.go','choosePathLocked'),('protocol/multipath/scheduler.go','pumpLoop'),
                           ('protocol/multipath/memory.go','boosterAllowed'),('protocol/multipath/memory.go','updatePressureLocked')):
              req(function(source(rel).decode(),name)==function((GOLDEN/rel).read_text(),name),'frozen function drift '+rel+':'+name)
          print('PASS normalized Frozen scheduler/pressure bodies; actual observed choice tested independently')
          oracle=(ROOT/'protocol/multipath/download_audit_test.go').read_text()
          req(function(oracle,'frozenDownloadChoiceLocked').replace('frozenDownloadChoiceLocked','choosePathLocked',1)==function(source('protocol/multipath/scheduler.go').decode(),'choosePathLocked'),'independent choice oracle drift')
          req(function(oracle,'frozenDownloadSubmitChoiceLocked').replace('frozenDownloadSubmitChoiceLocked','choosePathForSubmitLocked',1).replace('frozenDownloadChoiceLocked','choosePathLocked')==function(source('protocol/multipath/scheduler.go').decode(),'choosePathForSubmitLocked'),'independent Capacity oracle drift')
          req('processMemoryGuard' not in (ROOT/'protocol/multipath/scheduler.go').read_text(),'runtime guard leaked into scheduler')
          req('processMemoryGuard' not in (ROOT/'protocol/multipath/core.go').read_text(),'runtime guard leaked into core allocation')
          print('PASS runtime guard does not alter MP admission/scheduler semantics')
          req('TestFlowRegressionRepeatedBoosterDisconnect' in (ROOT/'protocol/multipath/flow_fault_test.go').read_text(),'old liveness regression missing')
          print('PASS old repeated-booster-disconnect regression preserved')
