            'protocol/multipath/memory_runtime.go':'70a2a22f367b9f70ed22bc466aa48b8724eafd4853d62d3ecdfa8ce3693297dd',
            'protocol/multipath/memory_runtime_test.go':'e021dc2188f9c00242091608c54392d58bc97bb5c5131a99492959b1604dfb22',
