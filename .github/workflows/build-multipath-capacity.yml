            'cmd/multipath-audit-v3/main.go':'bae1f5b5015d2465f41fa37a566534b9480420e712f0fcd3efdac09b6ea7c1e4',
            'protocol/multipath/auditv3/capture.go':'22f33b1f777a848a79da52d7c98034b39707719da89e128d53938cb05f81d21a',
