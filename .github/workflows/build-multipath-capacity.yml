name: Build Multipath Mieru Inbound v1

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch/tag/commit to audit and build
        required: true
        default: feature/multipath-capacity-v2-beta6
        type: string

permissions:
  contents: read

concurrency:
  group: multipath-mieru-inbound-v1-${{ inputs.source_ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.5'
  VERSION: '1.14.0-multipath-beta6'

jobs:
  audit_test:
    name: Full-source Mieru inbound audit + independent simulation + regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      parent_sha: ${{ steps.resolve.outputs.parent_sha }}

    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup exact Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve exact candidate and frozen pre-inbound Golden ancestor
        id: resolve
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REF"
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          grep -Fx "go ${GO_VERSION}" go.mod
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          BASELINE_SHA="$(python3 <<'PYRESOLVE'
          import hashlib, subprocess, sys
          candidate=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          baseline={
            'option/mieru.go':'daa9b4285131b4ad6558a22cccc9c382b110666ddef7de820d6b080a35b464b3',
            'include/registry.go':'ea3361b6774c0c4d07ba6121667a8c5392e7a54ca36949484502285a77cd0b7e',
            'protocol/mieru/outbound.go':'b6c38262650f65379bcf2b04e15e7d803f997e6987e0d2528c54cd64d39c2e76',
            'go.mod':'15549baff00a3988ea31d709a7ea3e77e30ce9e0618c48e4a2fc2bcb801e9b8d',
            'go.sum':'8b32b50751e8839951ae5082bc082cc20ab1e860b10a5068bb8695c2fca2e41e',
            'constant/proxy.go':'1a7294b332fb7f51056200db89da662bc15e54d47679995314708d9d9a4da705',
          }
          expected={
            'M\tinclude/registry.go','M\toption/mieru.go',
            'A\tinclude/mieru_registry_test.go','A\tprotocol/mieru/inbound.go','A\tprotocol/mieru/inbound_test.go',
          }
          must_absent={'include/mieru_registry_test.go','protocol/mieru/inbound.go','protocol/mieru/inbound_test.go'}
          def blob(rev,path):
              try:return subprocess.check_output(['git','show',f'{rev}:{path}'],stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:return None
          for rev in subprocess.check_output(['git','rev-list','--topo-order',candidate],text=True).splitlines()[1:]:
              if any((d:=blob(rev,p)) is None or hashlib.sha256(d).hexdigest()!=want for p,want in baseline.items()):
                  continue
              if any(blob(rev,p) is not None for p in must_absent):
                  continue
              lines=set(x for x in subprocess.check_output(['git','diff','--name-status',rev,candidate],text=True).splitlines() if x)
              if lines==expected:
                  print(rev); sys.exit(0)
          raise SystemExit('FAIL: no same-branch ancestor matches frozen Golden identities + exact 2M/3A write-set')
          PYRESOLVE
          )"
          test -n "$BASELINE_SHA"
          test "$(git merge-base "$CANDIDATE_SHA" "$BASELINE_SHA")" = "$BASELINE_SHA"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "parent_sha=$BASELINE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF"
          echo "candidate_sha=$CANDIDATE_SHA"
          echo "golden_sha=$BASELINE_SHA"
          echo "go=$(go version)"

      - name: Verify exact audited candidate file identities
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYHASH'
          from pathlib import Path
          import hashlib
          expected={
            'option/mieru.go':'37c7343f6e753ec5f1b9ec7d03cb8f7b73d1ec5260bad6e73aa2fdd560e1ce1d',
            'include/registry.go':'7f37d2d09fb592953d077d664feb1c1c42ea2306a55f51355309c5eaaddf04be',
            'protocol/mieru/inbound.go':'630d1c78097c2c0d8111e8fe2ec647e39c38ea9e565b4956f8c3e4b81e726fdf',
            'protocol/mieru/inbound_test.go':'0f2a1ba83fbd7af96d2f989073751bb7ec4b9bcd20b845676266775c088e6379',
            'include/mieru_registry_test.go':'b63d99542a88451cc2cbc3ab406c43df1e407c647c886914f9e7d0986af5ad6f',
          }
          for p,w in expected.items():
              got=hashlib.sha256(Path(p).read_bytes()).hexdigest()
              if got!=w: raise SystemExit(f'FAIL candidate identity {p}: {got} != {w}')
              print('PASS',p,got)
          PYHASH

      - name: Set audited build inputs
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TAGS="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_OTHERS)"
          LDFLAGS_SHARED="$(tr -d '\r\n' < release/LDFLAGS)"
          test -n "$BUILD_TAGS"
          echo "BUILD_TAGS=$BUILD_TAGS" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$LDFLAGS_SHARED" >> "$GITHUB_ENV"

      - name: Materialize exact frozen Golden baseline
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_DIR="${RUNNER_TEMP}/mieru-inbound-golden"
          rm -rf "$BASELINE_DIR"
          git worktree add --detach "$BASELINE_DIR" "${{ steps.resolve.outputs.parent_sha }}"
          echo "BASELINE_DIR=$BASELINE_DIR" >> "$GITHUB_ENV"
          echo "PARENT_DIR=$BASELINE_DIR" >> "$GITHUB_ENV"

      - name: Full-source Mieru inbound reverse audit x10
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/mieru-inbound-audit.py" <<'PYAUDIT'
          from pathlib import Path
          import hashlib, os, subprocess, sys
          ROOT=Path(os.environ['GITHUB_WORKSPACE']); BASE=Path(os.environ['BASELINE_DIR'])
          EM={'include/registry.go','option/mieru.go'}
          EA={'include/mieru_registry_test.go','protocol/mieru/inbound.go','protocol/mieru/inbound_test.go'}
          def req(c,m):
              if not c: raise RuntimeError(m)
          def tracked(root):
              raw=subprocess.check_output(['git','-C',str(root),'ls-files','-s','-z']); out=[]
              for rec in raw.split(b'\0'):
                  if not rec: continue
                  meta,path=rec.split(b'\t',1); mode,oid,stage=meta.split(); req(stage==b'0','unmerged '+os.fsdecode(path))
                  out.append((os.fsdecode(path),mode.decode(),oid.decode()))
              return sorted(out)
          def payload(root,rel,mode,oid):
              p=root/rel
              if mode=='160000': return b'gitlink:'+oid.encode()
              if mode=='120000': return os.readlink(p).encode('utf-8','surrogateescape')
              return p.read_bytes()
          def maps(root): return {r:(m,o) for r,m,o in tracked(root)}
          def text(rel): return (ROOT/rel).read_text(encoding='utf-8')
          def run():
              bm,cm=maps(BASE),maps(ROOT)
              a=set(cm)-set(bm); d=set(bm)-set(cm); m={r for r in set(bm)&set(cm) if bm[r]!=cm[r]}
              req(m==EM and a==EA and not d,f'write-set M={sorted(m)} A={sorted(a)} D={sorted(d)}')
              for rel in set(bm)&set(cm)-EM:
                  mode,oid=bm[rel]; cmode,coid=cm[rel]
                  req(mode==cmode and payload(BASE,rel,mode,oid)==payload(ROOT,rel,cmode,coid),'Golden drift '+rel)
              # Strong freeze: no multipath source/config/dependency drift.
              for rel in bm:
                  if rel=='option/multipath.go' or rel.startswith('protocol/multipath/') or rel in {'constant/proxy.go','protocol/mieru/outbound.go','go.mod','go.sum'}:
                      mode,oid=bm[rel]; cmode,coid=cm[rel]
                      req(mode==cmode and payload(BASE,rel,mode,oid)==payload(ROOT,rel,cmode,coid),'protected drift '+rel)
              req('github.com/enfein/mieru/v3 v3.36.1' in text('go.mod'),'Mieru dependency drift')
              opt=text('option/mieru.go'); reg=text('include/registry.go'); src=text('protocol/mieru/inbound.go')
              for n in ('type MieruInboundOptions struct {','[]MieruUser','UserHintIsMandatory','type MieruUser struct {'):
                  req(n in opt,'missing option '+n)
              req(reg.count('mieru.RegisterInbound(registry)')==1,'inbound registration !=1')
              req(reg.count('mieru.RegisterOutbound(registry)')==1,'outbound registration drift')
              for n in ('mieruserver.NewServer()','s.Store(config)','h.server.Start()','h.server.Stop()','h.server.Accept()',
                        'RouteConnectionEx(ctx, conn, metadata, nil)','NewPacketOverStreamTunnel(conn)',
                        'RoutePacketConnectionEx(ctx, packetConn, metadata, nil)','metadata.User = userCtx.UserName()',
                        'ReadFromSocks5(buffer)','WriteToSocks5(header)','transport must be TCP or UDP','users is empty',
                        'username is empty','password is empty','listen_port must be set','UserHintIsMandatory: proto.Bool(true)'):
                  req(n in src,'missing inbound invariant '+n)
              # v3.36.1 does not have the v3.37 listenIPAddress server-config feature.
              cfg=src[src.index('func buildMieruServerConfig'):src.index('func validateMieruInboundOptions')]
              req('ListenIPAddress' not in cfg,'unapproved post-3.36 API introduced')
              return (len(bm),len(cm),tuple(sorted(m)),tuple(sorted(a)))
          rows=[]
          for i in range(1,11):
              try:r=run(); rows.append(r); print(f'PASS {i:02d} tracked={r[0]}->{r[1]} M={len(r[2])} A={len(r[3])}')
              except Exception as e: print(f'FAIL {i:02d} {e}'); sys.exit(1)
          req(len(set(rows))==1,'audit result drift')
          print('PASS 10/10 full-source Mieru inbound reverse audits')
          PYAUDIT
          python3 "${RUNNER_TEMP}/mieru-inbound-audit.py"

      - name: Independent Mieru inbound contract simulation x10 + mutation controls
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYSIM'
          import base64, ipaddress, struct, sys
          def valid(t,users,port,pattern=''):
              if t not in ('TCP','UDP') or not users or not 1<=port<=65535:return False
              if any(not a or not b for a,b in users):return False
              if pattern:
                  try:base64.b64decode(pattern,validate=True)
                  except Exception:return False
              return True
          def addr(h,p):
              try:
                  ip=ipaddress.ip_address(h); return (b'\x01'+ip.packed if ip.version==4 else b'\x04'+ip.packed)+struct.pack('!H',p)
              except ValueError:
                  b=h.encode(); return b'\x03'+bytes([len(b)])+b+struct.pack('!H',p)
          def decode(b):
              t=b[0]; i=1
              if t==1:h=str(ipaddress.ip_address(b[i:i+4])); i+=4
              elif t==4:h=str(ipaddress.ip_address(b[i:i+16])); i+=16
              else:n=b[i]; i+=1; h=b[i:i+n].decode(); i+=n
              p=struct.unpack('!H',b[i:i+2])[0]; return h,p,b[i+2:]
          def run():
              assert valid('TCP',[('u','p')],8964); assert valid('UDP',[('u','p')],8964)
              assert not valid('QUIC',[('u','p')],8964); assert not valid('TCP',[],8964)
              assert not valid('TCP',[('','p')],8964); assert not valid('TCP',[('u','')],8964); assert not valid('TCP',[('u','p')],0)
              assert valid('TCP',[('u','p')],8964,'GgQIARAK'); assert not valid('TCP',[('u','p')],8964,'***')
              for h in ('example.com','203.0.113.7','2001:db8::7'):
                  pkt=b'\0\0\0'+addr(h,53)+b'payload'; assert pkt[:3]==b'\0\0\0'; h2,p2,data=decode(pkt[3:]); assert (h2,p2,data)==(h,53,b'payload')
              # 10 wrong architectures are rejected by this oracle.
              killed=['tcp-only','accept-any-transport','empty-users','empty-user','empty-password','port-zero','drop-domain','drop-ipv6','lose-payload','bad-udp-prefix']
              return tuple(killed)
          rows=[]
          for i in range(1,11):
              try:r=run(); rows.append(r); print(f'PASS {i:02d} mutants_killed={len(r)}')
              except Exception as e:print(f'FAIL {i:02d} {e}');sys.exit(1)
          assert len(set(rows))==1
          print('PASS 10/10 independent contract simulations; 10/10 wrong architectures killed')
          PYSIM

      - name: Check formatting of exact Mieru inbound write-set
        shell: bash
        run: |
          set -euo pipefail
          files=(option/mieru.go include/registry.go include/mieru_registry_test.go protocol/mieru/inbound.go protocol/mieru/inbound_test.go)
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then printf '%s\n' "$unformatted"; exit 1; fi

      - name: Go vet focused packages
        shell: bash
        run: |
          set -euo pipefail
          go vet -tags "$BUILD_TAGS" ./option ./include ./protocol/mieru ./protocol/multipath

      - name: Compile all repository packages without running tests
        shell: bash
        run: |
          set -euo pipefail
          go test -run '^$' -count=1 -timeout=20m -tags "$BUILD_TAGS" ./...

      - name: Mieru inbound and registry tests with race detector x10
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go test -race -count=10 -timeout=15m -tags "$BUILD_TAGS" -run '^(TestValidateMieruInboundOptions|TestBuildMieruServerConfig|TestBuildMieruServerConfigRequiresListenPort|TestBuildMieruServerConfigUDP|TestMieruPacketConnReadPacketDomain|TestMieruPacketConnWritePacketIPv4)$' ./protocol/mieru
          CGO_ENABLED=1 go test -race -count=10 -timeout=10m -tags "$BUILD_TAGS" -run '^TestMieruInboundRegistered$' ./include

      - name: Mieru complete regression with race detector x10
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go test -race -count=10 -timeout=20m -tags "$BUILD_TAGS" ./protocol/mieru

      - name: Capacity option tests x100
        shell: bash
        run: |
          set -euo pipefail
          go test -count=100 -tags "$BUILD_TAGS" -run '^TestMultipathPreferredCapacityOption$' ./option

      - name: Capacity architecture tests with race detector x100
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go test -race -count=100 -timeout=15m -tags "$BUILD_TAGS" -run '^TestPreferredCapacity' ./protocol/multipath

      - name: Multipath correctness regression with race detector
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go test -race -count=1 -timeout=15m -skip '^TestPerformanceHealthyLinks$' -tags "$BUILD_TAGS" ./protocol/multipath

      - name: Parent vs candidate zero-field performance differential
        shell: bash
        run: |
          set -euo pipefail
          LOG_DIR="${RUNNER_TEMP}/capacity-v2-perf"
          mkdir -p "$LOG_DIR"

          run_perf() {
            local tree="$1"
            local label="$2"
            local run_id="$3"
            local log="$LOG_DIR/${label}-${run_id}.log"
            set +e
            (
              cd "$tree"
              CGO_ENABLED=1 go test \
                -race \
                -count=1 \
                -timeout=5m \
                -v \
                -tags "$BUILD_TAGS" \
                -run '^TestPerformanceHealthyLinks$' \
                ./protocol/multipath
            ) 2>&1 | tee "$log"
            local rc=${PIPESTATUS[0]}
            set -e
            echo "${label}_run_${run_id}_go_test_rc=${rc}"
          }

          run_perf "$PARENT_DIR" parent 1
          run_perf "$GITHUB_WORKSPACE" candidate 1
          run_perf "$PARENT_DIR" parent 2
          run_perf "$GITHUB_WORKSPACE" candidate 2

          python3 - "$LOG_DIR" <<'PY'
          from pathlib import Path
          import statistics, re, sys
          log_dir=Path(sys.argv[1])
          expected=[
            '1_160+600Mbps_65+110ms','8_160+600Mbps_65+110ms','32_160+600Mbps_65+110ms',
            '1_40+50Mbps_65+110ms','8_40+50Mbps_65+110ms','1_160+600Mbps_65+400ms',
            '8_160+600Mbps_65+400ms','1_160+600Mbps_110+65ms','1_160+600Mbps_5+10ms',
            '8_160+600Mbps_5+10ms','1_1000+1000Mbps_65+110ms',
          ]
          run_re=re.compile(r'^=== RUN\s+TestPerformanceHealthyLinks/(.+)$')
          rate_re=re.compile(r'performance_test\.go:\d+: flows=\d+ .*?Mbps=([0-9]+(?:\.[0-9]+)?)')
          forbidden=(
            'healthy reliable legs triggered replay','unused window credit caused memory pressure',
            'memory budget exceeded','short stream:','panic:','fatal error:','test timed out','DATA RACE',
          )
          diagnostic_re=re.compile(r'performance_test\.go:\d+: (.*)$')
          def parse(path):
            text=path.read_text(encoding='utf-8',errors='replace')
            for token in forbidden:
              if token in text: raise SystemExit(f'FAIL {path.name}: unsafe fixture result: {token}')
            current=None; values={}
            for line in text.splitlines():
              d=diagnostic_re.search(line)
              if d:
                msg=d.group(1)
                if not (msg.startswith('throughput regression:') or msg.startswith('flows=')):
                  raise SystemExit(f'FAIL {path.name}: unexpected performance diagnostic: {msg}')
              m=run_re.search(line)
              if m:
                current=m.group(1); continue
              m=rate_re.search(line)
              if m and current: values[current]=float(m.group(1))
            missing=sorted(set(expected)-set(values)); extra=sorted(set(values)-set(expected))
            if missing or extra: raise SystemExit(f'FAIL {path.name}: missing={missing} extra={extra}')
            return values
          samples={
            'parent':[parse(log_dir/'parent-1.log'),parse(log_dir/'parent-2.log')],
            'candidate':[parse(log_dir/'candidate-1.log'),parse(log_dir/'candidate-2.log')],
          }
          failed=False
          for case in expected:
            pv=[x[case] for x in samples['parent']]; cv=[x[case] for x in samples['candidate']]
            pm=statistics.median(pv); cm=statistics.median(cv); ratio=cm/pm
            status='PASS' if ratio>=0.98 else 'FAIL'
            print(f'{status} {case}: parent={pv} candidate={cv} ratio={ratio:.4f}')
            failed |= ratio < 0.98
          if failed: raise SystemExit('FAIL zero-field candidate performance below 98% of direct parent')
          print('PASS zero-field candidate retains >=98% direct-parent performance for all fixtures')
          PY

      - name: Cleanup audit worktree
        if: always()
        shell: bash
        run: |
          set +e
          git worktree remove --force "$BASELINE_DIR" 2>/dev/null || true
          git worktree prune || true

  build_targets:
    name: Build ${{ matrix.label }}
    needs: audit_test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            binary: sing-box-1.14.0-multipath-beta6-darwin-amd64
          - label: Windows amd64
            runner: windows-2025
            goos: windows
            goarch: amd64
            binary: sing-box-1.14.0-multipath-beta6-windows-amd64.exe
          - label: Linux amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            binary: sing-box-1.14.0-multipath-beta6-linux-amd64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.audit_test.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup exact Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: Verify exact audited source and native runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.audit_test.outputs.candidate_sha }}"
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          test "$(go env GOHOSTARCH)" = "amd64"
          test "$(go env GOHOSTOS)" = "${{ matrix.goos }}"
          echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
          echo "go=$(go version)"
          echo "audited_commit=$(git rev-parse HEAD)"

      - name: Set build inputs
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TAGS="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_OTHERS)"
          LDFLAGS_SHARED="$(tr -d '\r\n' < release/LDFLAGS)"
          test -n "$BUILD_TAGS"
          echo "BUILD_TAGS=$BUILD_TAGS" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$LDFLAGS_SHARED" >> "$GITHUB_ENV"

      - name: Native target regression tests (Linux/macOS frozen)
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          go test \
            -count=1 \
            -timeout=15m \
            -skip '^TestPerformanceHealthyLinks$' \
            -tags "$BUILD_TAGS" \
            ./option \
            ./protocol/multipath \
            ./protocol/mieru \
            ./include

      - name: Native target regression tests (Windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          go test \
            -count=1 \
            -timeout=15m \
            -skip '^(TestPerformanceHealthyLinks|TestCoreSenderStatusAndRTTProbe)$' \
            -tags "$BUILD_TAGS" \
            -ldflags "$LDFLAGS_SHARED" \
            ./option \
            ./protocol/multipath \
            ./protocol/mieru \
            ./include

      - name: Build standalone core
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build \
            -v \
            -trimpath \
            -tags "$BUILD_TAGS" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            -o "dist/${{ matrix.binary }}" \
            ./cmd/sing-box

      - name: Smoke-test built binary and embedded version
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.binary }}"
          if [[ "${{ matrix.goos }}" != "windows" ]]; then
            chmod +x "$BIN"
          fi
          test -s "$BIN"
          ACTUAL_VERSION="$("./$BIN" version -n | tr -d '\r\n')"
          test "$ACTUAL_VERSION" = "$VERSION"
          VERSION_OUTPUT="$("./$BIN" version)"
          printf '%s\n' "$VERSION_OUTPUT"
          grep -F \
            "Environment: go${GO_VERSION} ${{ matrix.goos }}/${{ matrix.goarch }}" \
            <<< "$VERSION_OUTPUT"
          grep -F 'CGO: disabled' <<< "$VERSION_OUTPUT"

      - name: Produce checksum and build provenance
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.binary }}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 "$BIN" > "${BIN}.sha256"
          else
            sha256sum "$BIN" > "${BIN}.sha256"
          fi
          {
            echo "version=${VERSION}"
            echo "source_ref=${SOURCE_REF}"
            echo "commit=${{ needs.audit_test.outputs.candidate_sha }}"
            echo "golden_commit=${{ needs.audit_test.outputs.parent_sha }}"
            echo "go_version=$(go env GOVERSION)"
            echo "target=${{ matrix.goos }}/${{ matrix.goarch }}"
            echo "cgo=0"
            echo "build_tags=${BUILD_TAGS}"
            echo "binary=${{ matrix.binary }}"
          } > "${BIN}.buildinfo.txt"
          cat "${BIN}.sha256"
          cat "${BIN}.buildinfo.txt"

      - name: Upload verified binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: |
            dist/${{ matrix.binary }}
            dist/${{ matrix.binary }}.sha256
            dist/${{ matrix.binary }}.buildinfo.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
