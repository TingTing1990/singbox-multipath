        run: |
          set -euo pipefail
          CGO_ENABLED=1 go test -race -count=1 -timeout=20m -skip '^TestPerformanceHealthyLinks$' \
            -tags "$BUILD_TAGS" ./protocol/multipath/... 2>&1 | tee "${EVIDENCE_DIR}/multipath-full-race.log"

      - name: Golden vs repaired zero-field performance differential
        shell: bash
        run: |
          set -euo pipefail
          LOG_DIR="${RUNNER_TEMP}/capacity-v2-perf"
          mkdir -p "$LOG_DIR"
          run_perf() {
            local tree="$1"
            local label="$2"
            local run_id="$3"
            local log="$LOG_DIR/${label}-${run_id}.log"
            set +e
            (
              cd "$tree"
              CGO_ENABLED=1 go test \
                -race \
                -count=1 \
                -timeout=5m \
                -v \
                -tags "$BUILD_TAGS" \
                -run '^TestPerformanceHealthyLinks$' \
                ./protocol/multipath
            ) 2>&1 | tee "$log"
            local rc=${PIPESTATUS[0]}
            set -e
            echo "${label}_run_${run_id}_go_test_rc=${rc}"
          }
          run_perf "$PARENT_DIR" golden 1
          run_perf "$GITHUB_WORKSPACE" repaired 1
          run_perf "$PARENT_DIR" golden 2
          run_perf "$GITHUB_WORKSPACE" repaired 2
          python3 - "$LOG_DIR" <<'PY'
          from pathlib import Path
          import re, statistics, sys
          d=Path(sys.argv[1])
          expected=['1_160+600Mbps_65+110ms','8_160+600Mbps_65+110ms','32_160+600Mbps_65+110ms',
                    '1_40+50Mbps_65+110ms','8_40+50Mbps_65+110ms','1_160+600Mbps_65+400ms',
                    '8_160+600Mbps_65+400ms','1_160+600Mbps_110+65ms','1_160+600Mbps_5+10ms',
                    '8_160+600Mbps_5+10ms','1_1000+1000Mbps_65+110ms']
          run_re=re.compile(r'^=== RUN\s+TestPerformanceHealthyLinks/(.+)$')
          rate_re=re.compile(r'performance_test\.go:\d+: flows=\d+ .*?Mbps=([0-9]+(?:\.[0-9]+)?)')
          forbidden=(
              'healthy reliable legs triggered replay','unused window credit caused memory pressure',
              'memory budget exceeded','short stream:','panic:','fatal error:','test timed out','DATA RACE',
          )
          diagnostic_re=re.compile(r'performance_test\.go:\d+: (.*)$')
          def parse(p):
              text=p.read_text(encoding='utf-8',errors='replace')
              for x in forbidden:
                  if x in text: raise SystemExit(f'FAIL {p.name}: unsafe fixture result: {x}')
              cur=None; values={}
              for line in text.splitlines():
                  d=diagnostic_re.search(line)
                  if d:
                      msg=d.group(1)
                      if not (msg.startswith('throughput regression:') or msg.startswith('flows=')):
                          raise SystemExit(f'FAIL {p.name}: unexpected performance diagnostic: {msg}')
                  m=run_re.search(line)
                  if m: cur=m.group(1); continue
                  m=rate_re.search(line)
                  if m and cur: values[cur]=float(m.group(1))
              missing=sorted(set(expected)-set(values)); extra=sorted(set(values)-set(expected))
              if missing or extra: raise SystemExit(f'FAIL {p.name}: missing={missing} extra={extra}')
              return values
          samples={k:[parse(d/f'{k}-1.log'),parse(d/f'{k}-2.log')] for k in ('golden','repaired')}
          failed=False
          for case in expected:
              gv=[x[case] for x in samples['golden']]; rv=[x[case] for x in samples['repaired']]
              ratio=statistics.median(rv)/statistics.median(gv)
              print(f'{case}: golden={gv} repaired={rv} ratio={ratio:.4f}')
              failed |= ratio < 0.98
          if failed: raise SystemExit('FAIL repaired zero-field performance below 98% Golden')
          print('PASS repaired retains >=98% Golden performance for all fixtures')
          PY

      - name: Verify workspace remained pristine
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-audit-v3-evidence
          path: ${{ runner.temp }}/server-audit-v3-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup audit worktrees
        if: always()
        shell: bash
        run: |
          set +e
          git worktree remove --force "${GOLDEN_DIR:-}" >/dev/null 2>&1 || true
          git worktree remove --force "${V2_DIR:-}" >/dev/null 2>&1 || true
          git worktree remove --force "${INDEPENDENT_DIR:-}" >/dev/null 2>&1 || true
          git worktree prune || true

  build_targets:
    name: Build ${{ matrix.label }}
    needs: audit_test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            binary: sing-box-1.14.0-multipath-beta6-darwin-amd64
            audit_binary: multipath-audit-v3-darwin-amd64
          - label: Windows amd64
            runner: windows-2025
            goos: windows
            goarch: amd64
            binary: sing-box-1.14.0-multipath-beta6-windows-amd64.exe
            audit_binary: multipath-audit-v3-windows-amd64.exe
          - label: Linux amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            binary: sing-box-1.14.0-multipath-beta6-linux-amd64
            audit_binary: multipath-audit-v3-linux-amd64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.audit_test.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup exact Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: Verify exact audited source and native runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.audit_test.outputs.candidate_sha }}"
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          test "$(go env GOHOSTARCH)" = "amd64"
          test "$(go env GOHOSTOS)" = "${{ matrix.goos }}"
          echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
          echo "go=$(go version)"
          echo "audited_commit=$(git rev-parse HEAD)"

      - name: Set build inputs
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TAGS="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_OTHERS)"
          LDFLAGS_SHARED="$(tr -d '\r\n' < release/LDFLAGS)"
          test -n "$BUILD_TAGS"
          echo "BUILD_TAGS=$BUILD_TAGS" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$LDFLAGS_SHARED" >> "$GITHUB_ENV"

      - name: Native impacted multipath regression Linux/macOS
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -timeout=20m -skip '^TestPerformanceHealthyLinks$' \
            -tags "$BUILD_TAGS" ./protocol/multipath/...

      - name: Native impacted multipath regression Windows
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -timeout=20m -skip '^(TestPerformanceHealthyLinks|TestCoreSenderStatusAndRTTProbe)$' \
            -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" ./protocol/multipath/...

      - name: Build standalone core
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -v -trimpath -tags "$BUILD_TAGS" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            -o "dist/${{ matrix.binary }}" ./cmd/sing-box

      - name: Build standalone Server Audit V3 tool
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go build -v -trimpath \
            -ldflags "-s -w -buildid=" \
            -o "dist/${{ matrix.audit_binary }}" ./cmd/multipath-audit-v3

      - name: Smoke-test built binary and embedded version
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.binary }}"
          if [[ "${{ matrix.goos }}" != "windows" ]]; then chmod +x "$BIN"; fi
          test -s "$BIN"
          ACTUAL_VERSION="$("./$BIN" version -n | tr -d '\r\n')"
          test "$ACTUAL_VERSION" = "$VERSION"
          VERSION_OUTPUT="$("./$BIN" version)"
          printf '%s\n' "$VERSION_OUTPUT"
          grep -F "Environment: go${GO_VERSION} ${{ matrix.goos }}/${{ matrix.goarch }}" <<< "$VERSION_OUTPUT"
          grep -F 'CGO: disabled' <<< "$VERSION_OUTPUT"
          AUDIT_BIN="dist/${{ matrix.audit_binary }}"
          if [[ "${{ matrix.goos }}" != "windows" ]]; then chmod +x "$AUDIT_BIN"; fi
          test -s "$AUDIT_BIN"
          "./$AUDIT_BIN" help >/dev/null

      - name: Produce checksum and build provenance
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.binary }}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then shasum -a 256 "$BIN" > "${BIN}.sha256"; else sha256sum "$BIN" > "${BIN}.sha256"; fi
          {
            echo "version=${VERSION}"
            echo "source_ref=${SOURCE_REF}"
            echo "commit=${{ needs.audit_test.outputs.candidate_sha }}"
            echo "golden_commit=${{ needs.audit_test.outputs.parent_sha }}"
            echo "v2_baseline_commit=${{ needs.audit_test.outputs.v2_baseline_sha }}"
            echo "golden_tree=${FROZEN_GOLDEN_TREE}"
            echo "b9_upstream_commit=${B9_UPSTREAM_COMMIT}"
            echo "go_version=$(go env GOVERSION)"
            echo "target=${{ matrix.goos }}/${{ matrix.goarch }}"
            echo "cgo=0"
            echo "build_tags=${BUILD_TAGS}"
            echo "binary=${{ matrix.binary }}"
          } > "${BIN}.buildinfo.txt"
          cat "${BIN}.sha256"
          cat "${BIN}.buildinfo.txt"
          AUDIT_BIN="dist/${{ matrix.audit_binary }}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then shasum -a 256 "$AUDIT_BIN" > "${AUDIT_BIN}.sha256"; else sha256sum "$AUDIT_BIN" > "${AUDIT_BIN}.sha256"; fi
          {
            echo "tool=multipath-audit-v3"
            echo "source_ref=${SOURCE_REF}"
            echo "commit=${{ needs.audit_test.outputs.candidate_sha }}"
            echo "v2_baseline_commit=${{ needs.audit_test.outputs.v2_baseline_sha }}"
            echo "go_version=$(go env GOVERSION)"
            echo "target=${{ matrix.goos }}/${{ matrix.goarch }}"
            echo "cgo=0"
            echo "binary=${{ matrix.audit_binary }}"
          } > "${AUDIT_BIN}.buildinfo.txt"
          cat "${AUDIT_BIN}.sha256"
          cat "${AUDIT_BIN}.buildinfo.txt"

      - name: Upload verified binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: |
            dist/${{ matrix.binary }}
            dist/${{ matrix.binary }}.sha256
            dist/${{ matrix.binary }}.buildinfo.txt
            dist/${{ matrix.audit_binary }}
            dist/${{ matrix.audit_binary }}.sha256
            dist/${{ matrix.audit_binary }}.buildinfo.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
