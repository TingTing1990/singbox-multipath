name: Build Multipath Capacity Scheduler

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch/tag/commit to audit and build
        required: true
        default: feature/multipath-capacity-scheduler-beta6
        type: string

permissions:
  contents: read

concurrency:
  group: multipath-capacity-${{ inputs.source_ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.5'
  VERSION: '1.14.0-multipath-beta6'
  PARENT_BRANCH: 'feature/mieru-outbound-beta6'

jobs:
  audit_test:
    name: Source audit + independent tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      parent_sha: ${{ steps.resolve.outputs.parent_sha }}

    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup exact Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve audited source and parent
        id: resolve
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail

          test -n "$SOURCE_REF"
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          grep -Fx "go ${GO_VERSION}" go.mod

          CANDIDATE_SHA="$(git rev-parse HEAD)"

          git fetch --no-tags origin \
            "+refs/heads/${PARENT_BRANCH}:refs/remotes/origin/${PARENT_BRANCH}"

          PARENT_SHA="$(git rev-parse "refs/remotes/origin/${PARENT_BRANCH}^{commit}")"

          echo "source_ref=${SOURCE_REF}"
          echo "candidate_sha=${CANDIDATE_SHA}"
          echo "parent_branch=${PARENT_BRANCH}"
          echo "parent_sha=${PARENT_SHA}"
          echo "go=$(go version)"

          echo "candidate_sha=${CANDIDATE_SHA}" >> "$GITHUB_OUTPUT"
          echo "parent_sha=${PARENT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set audited build inputs
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TAGS="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_OTHERS)"
          LDFLAGS_SHARED="$(tr -d '\r\n' < release/LDFLAGS)"

          test -n "$BUILD_TAGS"

          echo "BUILD_TAGS=$BUILD_TAGS" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$LDFLAGS_SHARED" >> "$GITHUB_ENV"

          echo "BUILD_TAGS=$BUILD_TAGS"
          echo "LDFLAGS_SHARED=$LDFLAGS_SHARED"

      - name: Audit capacity source and frozen runtime invariants
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys

          root = Path('.')
          parent = f"refs/remotes/origin/{os.environ['PARENT_BRANCH']}"

          def fail(message):
              print(f"FAIL {message}")
              raise SystemExit(1)

          def ok(message):
              print(f"PASS {message}")

          def git(*args):
              return subprocess.check_output(['git', *args], text=True)

          def extract_func(text, signature):
              try:
                  start = text.index(signature)
                  brace = text.index('{', start)
              except ValueError:
                  fail(f"missing function: {signature}")
              depth = 0
              for index in range(brace, len(text)):
                  char = text[index]
                  if char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          return text[start:index + 1]
              fail(f"unbalanced function: {signature}")

          # CI/workflow metadata is intentionally outside the runtime feature
          # write-set. This workflow lives only on the default branch; the source
          # ref being audited does not need to carry any workflow file.
          changed = set(git(
              'diff', '--name-only', parent, 'HEAD', '--', '.',
              ':(exclude).github/**',
          ).splitlines())

          expected = {
              'README.md',
              'option/multipath.go',
              'option/multipath_test.go',
              'protocol/multipath/activation.go',
              'protocol/multipath/inbound.go',
              'protocol/multipath/outbound.go',
              'protocol/multipath/reorder_options_test.go',
              'protocol/multipath/scheduler.go',
              'protocol/multipath/status.go',
              'protocol/multipath/types.go',
              'protocol/multipath/capacity_scheduler_test.go',
          }

          missing = sorted(expected - changed)
          unexpected = sorted(changed - expected)
          if missing or unexpected:
              fail(
                  f"functional write-set mismatch; missing={missing} "
                  f"unexpected={unexpected}"
              )
          ok('functional write-set is exactly the approved 11 files')

          # Existing Mieru implementation must be inherited unchanged.
          for rel in (
              'constant/proxy.go',
              'option/mieru.go',
              'protocol/mieru/outbound.go',
              'include/registry.go',
              'go.mod',
              'go.sum',
          ):
              if subprocess.run(
                  ['git', 'diff', '--quiet', parent, 'HEAD', '--', rel]
              ).returncode != 0:
                  fail(f"existing Mieru baseline changed: {rel}")
          ok('Mieru functional baseline unchanged')

          # These beta6 protocol/data-plane files are outside this feature.
          frozen = (
              'protocol/multipath/wire.go',
              'protocol/multipath/telemetry.go',
              'protocol/multipath/memory.go',
              'protocol/multipath/stream/path.go',
              'protocol/multipath/protocol.go',
              'protocol/multipath/performance_test.go',
          )
          for rel in frozen:
              if subprocess.run(
                  ['git', 'diff', '--quiet', parent, 'HEAD', '--', rel]
              ).returncode != 0:
                  fail(f"frozen multipath file changed: {rel}")
          ok('wire/telemetry/memory/path/protocol/performance fixture unchanged')

          options = (root / 'option/multipath.go').read_text()
          if options.count('json:"preferred_capacity_mbps,omitempty"') != 2:
              fail('preferred_capacity_mbps must exist exactly once on outbound and once on inbound')
          ok('single user field exposed on both Local-TX option surfaces')

          conversion = (
              'PreferredCapacityBytesPS:       '
              'uint64(options.PreferredCapacityMbps) * 1_000_000 / 8'
          )
          for rel in (
              'protocol/multipath/outbound.go',
              'protocol/multipath/inbound.go',
          ):
              if conversion not in (root / rel).read_text():
                  fail(f"capacity conversion missing: {rel}")
          ok('Mbps-to-bytes/s conversion wired identically on client and server Local TX')

          status = (root / 'protocol/multipath/status.go').read_text()
          if 'json:"preferred_capacity_mbps,omitempty"' not in status:
              fail('status parameter is not additive/omitempty')
          if 'PreferredCapacityBytesPS * 8 / 1_000_000' not in status:
              fail('status preferred capacity conversion missing')
          ok('status reports configured capacity and omits it when disabled')

          activation = (root / 'protocol/multipath/activation.go').read_text()
          for needle in (
              'preferredWindowBase := c.preferredDeliveredBytes()',
              'preferredDelivered := c.preferredDeliveredBytes()',
              'return preferred.path.Received',
              'preferredCapacityWindowReady(',
              'preferredCapacityReady := c.cfg.PreferredCapacityBytesPS == 0',
          ):
              if needle not in activation:
                  fail(f'preferred-capacity activation gate missing: {needle}')
          if activation.count('&& preferredCapacityReady') < 3:
              fail('bytes/rate/queue activation paths are not all capacity-gated')
          if 'legCounters[0].txBytes.Load()' in activation:
              fail('activation capacity gate must not use local child Write counters')
          ok('positive capacity gates normal leg1 DATA activation on peer-confirmed preferred delivery; zero keeps original trigger behavior')

          for rel in (
              'protocol/multipath/wire.go',
              'protocol/multipath/telemetry.go',
          ):
              text = (root / rel).read_text()
              if 'PreferredCapacity' in text or 'preferred_capacity' in text:
                  fail(f"capacity leaked into wire/remote telemetry: {rel}")
          ok('wire protocol and remote telemetry schema unchanged')

          parent_scheduler = git('show', f'{parent}:protocol/multipath/scheduler.go')
          current_scheduler = (root / 'protocol/multipath/scheduler.go').read_text()

          original = extract_func(
              parent_scheduler,
              'func (c *mpCore) choosePathLocked(length int) *mpLeg',
          )
          adaptive = extract_func(
              current_scheduler,
              'func (c *mpCore) chooseAdaptivePathLocked(length int) *mpLeg',
          )
          if original[original.index('{'):] != adaptive[adaptive.index('{'):]:
              fail('direct-parent adaptive scheduler body changed')
          ok('original beta6 adaptive scheduler body retained byte-for-byte')

          wrapper = extract_func(
              current_scheduler,
              'func (c *mpCore) choosePathLockedAt(length int, now time.Time) *mpLeg',
          )
          if 'chosen := c.chooseAdaptivePathLocked(length)' not in wrapper:
              fail('capacity wrapper does not begin from original scheduler decision')
          if not (
              'if c.cfg.PreferredCapacityBytesPS == 0 {' in wrapper
              and 'return chosen' in wrapper
          ):
              fail('disabled capacity is not a strict guard bypass')
          ok('preferred_capacity_mbps=0 returns original scheduler decision before guard')

          pump = extract_func(
              current_scheduler,
              'func (c *mpCore) pumpLoop()',
          )
          if 'now := time.Now()' not in pump:
              fail('pump no longer owns its loop timestamp')
          if 'c.choosePathLockedAt(segment.Length, now)' not in pump:
              fail('production pump does not reuse its existing timestamp')
          if 'c.choosePathLocked(segment.Length)' in pump:
              fail('production pump still uses wrapper that obtains another timestamp')
          ok('production scheduler reuses the existing pump timestamp')

          # No non-test production caller may call choosePathLocked(); that helper
          # remains only for legacy tests. This prevents a hidden time.Now hot path.
          production_calls = []
          for path in (root / 'protocol/multipath').glob('*.go'):
              if path.name.endswith('_test.go') or path.name == 'scheduler.go':
                  continue
              if 'choosePathLocked(' in path.read_text():
                  production_calls.append(str(path))
          if production_calls:
              fail(f"unexpected production choosePathLocked callers: {production_calls}")
          ok('no hidden production caller adds a second scheduler timestamp')

          guard = extract_func(
              current_scheduler,
              'func (c *mpCore) applyPreferredCapacityFloorLocked('
              'chosen *mpLeg, length int, now time.Time) *mpLeg',
          )
          for needle in (
              '!c.active.Load()',
              'preferred := c.getLeg(0)',
              'preferred.path.Stale',
              '!c.cfg.Recovery.allows(0)',
              'if preferred.busy {\n\t\treturn nil',
              'preferred.path.Outstanding()+uint64(length) > pipeline {\n\t\treturn nil',
              'return preferred',
          ):
              if needle not in guard:
                  fail(f"capacity reservation guard missing condition: {needle}")
          if 'getLeg(1)' in guard or 'return c.getLeg(1)' in guard:
              fail('capacity reservation guard directly controls booster selection')
          ok('owed preferred capacity waits on busy/full preferred; stale/unavailable remains safety fallback')

          refill = extract_func(
              current_scheduler,
              'func (c *mpCore) refillPreferredCapacityCreditLocked(now time.Time, length int)',
          )
          for needle in (
              'c.capFloor.credit = float64(length)',
              'earned := elapsed.Seconds() * float64(c.cfg.PreferredCapacityBytesPS)',
              'c.capFloor.credit < 0 && earned+1 >= float64(length)',
              'preferredCapacityDebtChunks',
              'preferredCapacitySurplusChunks',
          ):
              if needle not in refill:
                  fail(f"capacity reservation accounting missing: {needle}")
          ok('first post-activation chunk is preferred and low/at-target demand clears historical surplus')

          submit = extract_func(
              current_scheduler,
              'func (c *mpCore) submitLocked('
              'leg *mpLeg, segment stream.Segment, repair bool, now time.Time) error',
          )
          accepted = (
              'case leg.send <- frame:\n'
              '\t\tc.notePreferredCapacityAssignmentLocked('
              'leg, segment.Length, now)\n'
              '\t\treturn nil'
          )
          if accepted not in submit:
              fail('capacity accounting is not after successful assignment enqueue')
          ok('preferred assignment is accounted only after successful enqueue')

          tests = (root / 'protocol/multipath/capacity_scheduler_test.go').read_text()
          required_tests = (
              'TestPreferredCapacityWindowGate',
              'TestPreferredCapacityActivationGateIntegration',
              'TestPreferredCapacityActivationIgnoresLocalWriteCompletion',
              'TestPreferredCapacityDisabledPreservesAdaptiveDecision',
              'TestPreferredCapacityBelowTargetIsStrictPreferredOnly',
              'TestPreferredCapacityAboveTargetUsesOnlyExcessOnBooster',
              'TestPreferredCapacityPreservesHealthyAdaptiveSplit',
              'TestPreferredCapacityDoesNotCapPreferredAboveTarget',
              'TestPreferredCapacityOwedWaitsInsteadOfFeedingBooster',
              'TestPreferredCapacityStalePreferredRemainsSafetyException',
          )
          for name in required_tests:
              if f'func {name}' not in tests:
                  fail(f"required capacity test missing: {name}")
          ok('dedicated tests cover activation gate/reservation/zero/safety/no-cap/healthy-split invariants')
          PY

      - name: Check formatting of approved Go write-set
        shell: bash
        run: |
          set -euo pipefail
          files=(
            option/multipath.go
            option/multipath_test.go
            protocol/multipath/activation.go
            protocol/multipath/inbound.go
            protocol/multipath/outbound.go
            protocol/multipath/reorder_options_test.go
            protocol/multipath/scheduler.go
            protocol/multipath/status.go
            protocol/multipath/types.go
            protocol/multipath/capacity_scheduler_test.go
          )
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Independent capacity policy oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          TARGET = 70.0

          def activation_allowed(preferred_mbps, original_trigger, enabled=True):
              if not original_trigger:
                  return False
              if not enabled:
                  return True
              return preferred_mbps + 1e-9 >= TARGET

          for mbps, want in (
              (60, False),
              (69, False),
              (70, True),
              (80, True),
          ):
              got = activation_allowed(mbps, True)
              assert got == want, (mbps, got, want)
          assert activation_allowed(140, False) is False
          assert activation_allowed(0, True, enabled=False) is True

          def required_split(offered_mbps, natural_preferred_mbps=None):
              if offered_mbps <= TARGET:
                  return offered_mbps, 0.0
              if natural_preferred_mbps is not None and natural_preferred_mbps >= TARGET:
                  preferred = min(offered_mbps, natural_preferred_mbps)
                  return preferred, offered_mbps - preferred
              return TARGET, offered_mbps - TARGET

          for offered in (60, 69, 70):
              a, b = required_split(offered)
              assert a == offered and b == 0, (offered, a, b)

          for offered, want_b in ((80, 10), (140, 70), (200, 130)):
              a, b = required_split(offered)
              assert a == 70 and b == want_b, (offered, a, b)

          a, b = required_split(130, natural_preferred_mbps=90)
          assert (a, b) == (90, 40), (a, b)

          a, b = required_split(120, natural_preferred_mbps=120)
          assert (a, b) == (120, 0), (a, b)

          print('PASS activation gate: 60/69 blocked; 70/80 admitted; original trigger still required')
          print('PASS below/at target: 60/69/70 => preferred only')
          print('PASS excess demand: 80=>70+10, 140=>70+70, 200=>70+130')
          print('PASS healthy beta6 split preserved: 90+40')
          print('PASS preferred target is reservation, not cap')
          PY

      - name: Go vet focused packages
        shell: bash
        run: |
          set -euo pipefail
          go vet \
            -tags "$BUILD_TAGS" \
            ./option \
            ./protocol/multipath \
            ./protocol/mieru

      - name: Capacity option tests x100
        shell: bash
        run: |
          set -euo pipefail
          go test \
            -count=100 \
            -tags "$BUILD_TAGS" \
            -run '^TestMultipathPreferredCapacityOption$' \
            ./option

      - name: Capacity gate and reservation tests with race detector x100
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go test \
            -race \
            -count=100 \
            -timeout=10m \
            -tags "$BUILD_TAGS" \
            -run '^TestPreferredCapacity' \
            ./protocol/multipath

      - name: Multipath correctness regression with race detector
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go test \
            -race \
            -count=1 \
            -timeout=15m \
            -skip '^TestPerformanceHealthyLinks$' \
            -tags "$BUILD_TAGS" \
            ./protocol/multipath

      - name: Parent vs candidate zero-capacity performance differential
        shell: bash
        run: |
          set -euo pipefail

          PARENT_DIR="${RUNNER_TEMP}/multipath-parent"
          LOG_DIR="${RUNNER_TEMP}/capacity-perf"
          mkdir -p "$LOG_DIR"
          rm -rf "$PARENT_DIR"

          git worktree add --detach \
            "$PARENT_DIR" \
            "refs/remotes/origin/${PARENT_BRANCH}"

          cleanup() {
            git worktree remove --force "$PARENT_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          run_perf() {
            local tree="$1"
            local label="$2"
            local run_id="$3"
            local log="$LOG_DIR/${label}-${run_id}.log"

            set +e
            (
              cd "$tree"
              CGO_ENABLED=1 go test \
                -race \
                -count=1 \
                -timeout=5m \
                -v \
                -tags "$BUILD_TAGS" \
                -run '^TestPerformanceHealthyLinks$' \
                ./protocol/multipath
            ) 2>&1 | tee "$log"
            local rc=${PIPESTATUS[0]}
            set -e
            echo "${label}_run_${run_id}_go_test_rc=${rc}"
          }

          # Two independent samples on each exact tree. The fixture may return
          # non-zero because it embeds historical beta3 thresholds; that exit code
          # is not used as the differential verdict. Safety errors and measured
          # throughput are parsed below.
          run_perf "$PARENT_DIR" parent 1
          run_perf "$GITHUB_WORKSPACE" candidate 1
          run_perf "$PARENT_DIR" parent 2
          run_perf "$GITHUB_WORKSPACE" candidate 2

          python3 - "$LOG_DIR" <<'PY'
          from pathlib import Path
          import statistics
          import re
          import sys

          log_dir = Path(sys.argv[1])

          expected = [
              '1_160+600Mbps_65+110ms',
              '8_160+600Mbps_65+110ms',
              '32_160+600Mbps_65+110ms',
              '1_40+50Mbps_65+110ms',
              '8_40+50Mbps_65+110ms',
              '1_160+600Mbps_65+400ms',
              '8_160+600Mbps_65+400ms',
              '1_160+600Mbps_110+65ms',
              '1_160+600Mbps_5+10ms',
              '8_160+600Mbps_5+10ms',
              '1_1000+1000Mbps_65+110ms',
          ]

          run_re = re.compile(
              r'^=== RUN\s+TestPerformanceHealthyLinks/(.+)$'
          )
          rate_re = re.compile(
              r'performance_test\.go:\d+: '
              r'flows=\d+ .*?Mbps=([0-9]+(?:\.[0-9]+)?)'
          )

          forbidden = (
              'healthy reliable legs triggered replay',
              'unused window credit caused memory pressure',
              'memory budget exceeded',
              'short stream:',
              'panic:',
              'fatal error:',
              'test timed out',
              'DATA RACE',
          )
          diagnostic_re = re.compile(
              r'performance_test\.go:\d+: (.*)$'
          )

          def parse(path):
              text = path.read_text(encoding='utf-8', errors='replace')
              for token in forbidden:
                  if token in text:
                      raise SystemExit(
                          f'FAIL {path.name}: unsafe fixture result: {token}'
                      )
              current = None
              values = {}
              for line in text.splitlines():
                  diagnostic = diagnostic_re.search(line)
                  if diagnostic:
                      message = diagnostic.group(1)
                      if not (
                          message.startswith('throughput regression:')
                          or message.startswith('flows=')
                      ):
                          raise SystemExit(
                              f'FAIL {path.name}: unexpected performance diagnostic: '
                              f'{message}'
                          )

                  match = run_re.search(line)
                  if match:
                      current = match.group(1)
                      continue
                  match = rate_re.search(line)
                  if match and current:
                      values[current] = float(match.group(1))
              missing = sorted(set(expected) - set(values))
              extra = sorted(set(values) - set(expected))
              if missing or extra:
                  raise SystemExit(
                      f'FAIL {path.name}: missing={missing} extra={extra}'
                  )
              return values

          samples = {
              'parent': [
                  parse(log_dir / 'parent-1.log'),
                  parse(log_dir / 'parent-2.log'),
              ],
              'candidate': [
                  parse(log_dir / 'candidate-1.log'),
                  parse(log_dir / 'candidate-2.log'),
              ],
          }

          failed = False
          print('=== ZERO-CAPACITY PARENT VS CANDIDATE PERFORMANCE ===')
          for case in expected:
              parent_values = [sample[case] for sample in samples['parent']]
              candidate_values = [sample[case] for sample in samples['candidate']]
              parent_median = statistics.median(parent_values)
              candidate_median = statistics.median(candidate_values)
              ratio = candidate_median / parent_median
              status = 'PASS' if ratio >= 0.98 else 'FAIL'
              print(
                  f'{status} {case}: '
                  f'parent={parent_values} median={parent_median:.1f} '
                  f'candidate={candidate_values} median={candidate_median:.1f} '
                  f'ratio={ratio:.4f}'
              )
              if ratio < 0.98:
                  failed = True

          if failed:
              raise SystemExit(
                  'FAIL capacity branch is below 98% of its direct parent '
                  'with preferred_capacity_mbps disabled'
              )

          print(
              'PASS candidate retains at least 98% of direct-parent '
              'performance for every deterministic fixture'
          )
          PY


  build_targets:
    name: Build ${{ matrix.label }}
    needs: audit_test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            binary: sing-box-1.14.0-multipath-beta6-darwin-amd64
          - label: Windows amd64
            runner: windows-2025
            goos: windows
            goarch: amd64
            binary: sing-box-1.14.0-multipath-beta6-windows-amd64.exe
          - label: Linux amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            binary: sing-box-1.14.0-multipath-beta6-linux-amd64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.audit_test.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup exact Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: Verify exact audited source and native runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.audit_test.outputs.candidate_sha }}"
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          test "$(go env GOHOSTARCH)" = "amd64"
          test "$(go env GOHOSTOS)" = "${{ matrix.goos }}"
          echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
          echo "go=$(go version)"
          echo "audited_commit=$(git rev-parse HEAD)"

      - name: Set build inputs
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TAGS="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_OTHERS)"
          LDFLAGS_SHARED="$(tr -d '\r\n' < release/LDFLAGS)"
          test -n "$BUILD_TAGS"
          echo "BUILD_TAGS=$BUILD_TAGS" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$LDFLAGS_SHARED" >> "$GITHUB_ENV"

      - name: Native target regression tests (Linux/macOS frozen)
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          go test \
            -count=1 \
            -timeout=15m \
            -skip '^TestPerformanceHealthyLinks$' \
            -tags "$BUILD_TAGS" \
            ./option \
            ./protocol/multipath \
            ./protocol/mieru

      - name: Native target regression tests (Windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          go test \
            -count=1 \
            -timeout=15m \
            -skip '^(TestPerformanceHealthyLinks|TestCoreSenderStatusAndRTTProbe)$' \
            -tags "$BUILD_TAGS" \
            -ldflags "$LDFLAGS_SHARED" \
            ./option \
            ./protocol/multipath \
            ./protocol/mieru

      - name: Build standalone core
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build \
            -v \
            -trimpath \
            -tags "$BUILD_TAGS" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            -o "dist/${{ matrix.binary }}" \
            ./cmd/sing-box

      - name: Smoke-test built binary and embedded version
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.binary }}"
          if [[ "${{ matrix.goos }}" != "windows" ]]; then
            chmod +x "$BIN"
          fi
          test -s "$BIN"
          ACTUAL_VERSION="$("./$BIN" version -n | tr -d '\r\n')"
          test "$ACTUAL_VERSION" = "$VERSION"
          VERSION_OUTPUT="$("./$BIN" version)"
          printf '%s\n' "$VERSION_OUTPUT"
          grep -F \
            "Environment: go${GO_VERSION} ${{ matrix.goos }}/${{ matrix.goarch }}" \
            <<< "$VERSION_OUTPUT"
          grep -F 'CGO: disabled' <<< "$VERSION_OUTPUT"

      - name: Produce checksum and build provenance
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.binary }}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 "$BIN" > "${BIN}.sha256"
          else
            sha256sum "$BIN" > "${BIN}.sha256"
          fi
          {
            echo "version=${VERSION}"
            echo "source_ref=${SOURCE_REF}"
            echo "commit=${{ needs.audit_test.outputs.candidate_sha }}"
            echo "parent_commit=${{ needs.audit_test.outputs.parent_sha }}"
            echo "go_version=$(go env GOVERSION)"
            echo "target=${{ matrix.goos }}/${{ matrix.goarch }}"
            echo "cgo=0"
            echo "build_tags=${BUILD_TAGS}"
            echo "binary=${{ matrix.binary }}"
          } > "${BIN}.buildinfo.txt"
          cat "${BIN}.sha256"
          cat "${BIN}.buildinfo.txt"

      - name: Upload verified binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: |
            dist/${{ matrix.binary }}
            dist/${{ matrix.binary }}.sha256
            dist/${{ matrix.binary }}.buildinfo.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
