name: Build Multipath Capacity

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch/tag/commit to audit and build
        required: true
        default: feature/multipath-capacity-v2-beta6
        type: string

permissions:
  contents: read

concurrency:
  group: multipath-mieru-inbound-v1-${{ inputs.source_ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.5'
  VERSION: '1.14.0-multipath-beta6'
  FROZEN_GOLDEN_SHA: '7c889cbefc34b3bbc5719ecf0e44c969b216b199'
  FROZEN_GOLDEN_TREE: '2b3c62cc0ee25af52d55411db918884208c42b6e'
  REPAIR_BASE_SHA: '7c3473ab86f7dd8cb7995b93574ad17001ed87c2'
  REPAIR_BASE_TREE: 'e343df90e9576b47364c4a910e62a0ec8db7424a'

jobs:
  audit_test:
    name: Full-source Mieru inbound audit + independent simulation + regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      parent_sha: ${{ steps.resolve.outputs.parent_sha }}

    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup exact Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve exact candidate against fixed Golden and fixed repair base
        id: resolve
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REF"
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          grep -Fx "go ${GO_VERSION}" go.mod

          CANDIDATE_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse "${FROZEN_GOLDEN_SHA}^{tree}")" = "$FROZEN_GOLDEN_TREE"
          test "$(git rev-parse "${REPAIR_BASE_SHA}^{tree}")" = "$REPAIR_BASE_TREE"
          test "$(git merge-base "$REPAIR_BASE_SHA" "$FROZEN_GOLDEN_SHA")" = "$FROZEN_GOLDEN_SHA"
          test "$(git merge-base "$CANDIDATE_SHA" "$REPAIR_BASE_SHA")" = "$REPAIR_BASE_SHA"

          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "parent_sha=$FROZEN_GOLDEN_SHA" >> "$GITHUB_OUTPUT"
          echo "repair_base_sha=$REPAIR_BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF"
          echo "candidate_sha=$CANDIDATE_SHA"
          echo "frozen_golden_sha=$FROZEN_GOLDEN_SHA"
          echo "frozen_golden_tree=$FROZEN_GOLDEN_TREE"
          echo "repair_base_sha=$REPAIR_BASE_SHA"
          echo "repair_base_tree=$REPAIR_BASE_TREE"
          echo "go=$(go version)"

      - name: Verify exact repaired candidate file identities
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYHASH'
          from pathlib import Path
          import hashlib
          expected={
            'include/registry.go':'7f37d2d09fb592953d077d664feb1c1c42ea2306a55f51355309c5eaaddf04be',
            'option/mieru.go':'37c7343f6e753ec5f1b9ec7d03cb8f7b73d1ec5260bad6e73aa2fdd560e1ce1d',
            'include/mieru_registry_test.go':'b63d99542a88451cc2cbc3ab406c43df1e407c647c886914f9e7d0986af5ad6f',
            'protocol/mieru/inbound.go':'020e78b1982d2b182f4ebab132c9a1392e50b0cabd949b1d6f7892fae4952acd',
            'protocol/mieru/inbound_test.go':'51a3e7b0c2b7e921ccdc5f4951c71bc3d6409ee7e7cfa8085865372013d47d36',
            'protocol/multipath/inbound.go':'93a8a8fc3f6b642292d52d0c08607d03736aa18d30aabbec519fd391295f7dc2',
            'protocol/multipath/server_audit_test.go':'776ebccd350bbc03d9f9635c8c52f29597b58eb153f5863b330a2518a928dda3',
            'protocol/mieru/outbound.go':'b6c38262650f65379bcf2b04e15e7d803f997e6987e0d2528c54cd64d39c2e76',
            'go.mod':'15549baff00a3988ea31d709a7ea3e77e30ce9e0618c48e4a2fc2bcb801e9b8d',
            'go.sum':'8b32b50751e8839951ae5082bc082cc20ab1e860b10a5068bb8695c2fca2e41e',
          }
          for path,want in expected.items():
              got=hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if got!=want:
                  raise SystemExit(f'FAIL candidate identity {path}: {got} != {want}')
              print('PASS',path,got)
          PYHASH

      - name: Set audited build inputs
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TAGS="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_OTHERS)"
          LDFLAGS_SHARED="$(tr -d '\r\n' < release/LDFLAGS)"
          test -n "$BUILD_TAGS"
          echo "BUILD_TAGS=$BUILD_TAGS" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$LDFLAGS_SHARED" >> "$GITHUB_ENV"

      - name: Materialize fixed Golden and fixed repair base outside candidate workspace
        shell: bash
        run: |
          set -euo pipefail
          GOLDEN_DIR="${RUNNER_TEMP}/frozen-golden"
          REPAIR_DIR="${RUNNER_TEMP}/repair-base"
          EVIDENCE_DIR="${RUNNER_TEMP}/mieru-inbound-freeze-audit-evidence"
          INDEPENDENT_WORKTREE="${RUNNER_TEMP}/independent-candidate"
          MUTANT_ROOT="${RUNNER_TEMP}/real-mutants"

          git worktree prune || true
          rm -rf "$GOLDEN_DIR" "$REPAIR_DIR" "$EVIDENCE_DIR" "$INDEPENDENT_WORKTREE" "$MUTANT_ROOT"
          mkdir -p "$EVIDENCE_DIR" "$MUTANT_ROOT"

          git worktree add --detach "$GOLDEN_DIR" "$FROZEN_GOLDEN_SHA"
          git worktree add --detach "$REPAIR_DIR" "$REPAIR_BASE_SHA"

          echo "GOLDEN_DIR=$GOLDEN_DIR" >> "$GITHUB_ENV"
          echo "REPAIR_DIR=$REPAIR_DIR" >> "$GITHUB_ENV"
          echo "PARENT_DIR=$GOLDEN_DIR" >> "$GITHUB_ENV"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          echo "INDEPENDENT_WORKTREE=$INDEPENDENT_WORKTREE" >> "$GITHUB_ENV"
          echo "MUTANT_ROOT=$MUTANT_ROOT" >> "$GITHUB_ENV"

          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Full-source architecture audit - 10 independent domains
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/freeze-audit.py" <<'PYAUDIT'
          from pathlib import Path
          import hashlib, os, subprocess, sys

          ROOT=Path(os.environ.get('AUDIT_ROOT') or os.environ['GITHUB_WORKSPACE'])
          GOLDEN=Path(os.environ['GOLDEN_DIR'])
          REPAIR=Path(os.environ['REPAIR_DIR'])
          FROZEN=os.environ['FROZEN_GOLDEN_SHA']
          FROZEN_TREE=os.environ['FROZEN_GOLDEN_TREE']
          REPAIR_SHA=os.environ['REPAIR_BASE_SHA']
          REPAIR_TREE=os.environ['REPAIR_BASE_TREE']
          REPAIR_M={'include/registry.go','option/mieru.go'}
          REPAIR_A={'include/mieru_registry_test.go','protocol/mieru/inbound.go','protocol/mieru/inbound_test.go'}
          FIX_M={'protocol/mieru/inbound.go','protocol/mieru/inbound_test.go','protocol/multipath/inbound.go','protocol/multipath/server_audit_test.go'}
          TOTAL_M=REPAIR_M|{'protocol/multipath/inbound.go','protocol/multipath/server_audit_test.go'}
          TOTAL_A=REPAIR_A

          def req(value,message):
              if not value: raise RuntimeError(message)
          def git(root,*args):
              return subprocess.check_output(['git','-C',str(root),*args],text=True).strip()
          def tracked(root):
              raw=subprocess.check_output(['git','-C',str(root),'ls-files','-s','-z'])
              out={}
              for record in raw.split(b'\0'):
                  if not record: continue
                  meta,path=record.split(b'\t',1)
                  mode,oid,stage=meta.split()
                  req(stage==b'0','unmerged '+os.fsdecode(path))
                  out[os.fsdecode(path)]=(mode.decode(),oid.decode())
              return out
          def delta(base,root):
              b=tracked(base); c=tracked(root)
              a=set(c)-set(b); d=set(b)-set(c)
              m={p for p in set(b)&set(c) if b[p]!=c[p]}
              return b,c,m,a,d
          def text(root,rel): return (root/rel).read_text(encoding='utf-8')
          def hash_file(root,rel): return hashlib.sha256((root/rel).read_bytes()).hexdigest()
          def passline(number,name,detail): print(f'PASS {number:02d} {name}: {detail}')

          # 01 provenance: fixed commits/trees only; no dynamic ancestor discovery.
          head=git(ROOT,'rev-parse','HEAD')
          req(git(GOLDEN,'rev-parse','HEAD')==FROZEN,'Golden commit mismatch')
          req(git(GOLDEN,'rev-parse','HEAD^{tree}')==FROZEN_TREE,'Golden tree mismatch')
          req(git(REPAIR,'rev-parse','HEAD')==REPAIR_SHA,'repair-base commit mismatch')
          req(git(REPAIR,'rev-parse','HEAD^{tree}')==REPAIR_TREE,'repair-base tree mismatch')
          req(git(ROOT,'merge-base',head,REPAIR_SHA)==REPAIR_SHA,'candidate is not descendant of fixed repair base')
          req(git(ROOT,'merge-base',REPAIR_SHA,FROZEN)==FROZEN,'repair base is not descendant of fixed Golden')
          req(not git(ROOT,'status','--porcelain'),'candidate checkout is dirty before audit')
          passline(1,'provenance',f'golden={FROZEN[:12]} repair={REPAIR_SHA[:12]} candidate={head[:12]}')

          # 02 exact authorized deltas at both boundaries.
          _,_,rm,ra,rd=delta(GOLDEN,REPAIR)
          req(rm==REPAIR_M and ra==REPAIR_A and not rd,f'Golden->repair delta M={sorted(rm)} A={sorted(ra)} D={sorted(rd)}')
          _,_,fm,fa,fd=delta(REPAIR,ROOT)
          req(fm==FIX_M and not fa and not fd,f'repair->candidate delta M={sorted(fm)} A={sorted(fa)} D={sorted(fd)}')
          _,_,tm,ta,td=delta(GOLDEN,ROOT)
          req(tm==TOTAL_M and ta==TOTAL_A and not td,f'Golden->candidate delta M={sorted(tm)} A={sorted(ta)} D={sorted(td)}')
          passline(2,'write-set','Golden 4M/3A overall; repair delta exactly 4M/0A/0D')

          # 03 complete-tree freeze: mode/blob identity outside the approved sets, including gitlinks.
          gm,cm,_,_,_=delta(GOLDEN,ROOT)
          for rel,(mode,oid) in gm.items():
              if rel in TOTAL_M: continue
              req(rel in cm and cm[rel]==(mode,oid),'unapproved Golden drift '+rel)
          rr,cr,_,_,_=delta(REPAIR,ROOT)
          for rel,(mode,oid) in rr.items():
              if rel in FIX_M: continue
              req(rel in cr and cr[rel]==(mode,oid),'unapproved repair-base drift '+rel)
          passline(3,'complete-tree-freeze',f'Golden tracked={len(gm)} candidate tracked={len(cm)} modes/gitlinks included')

          # 04 dependencies and existing Mieru outbound stay frozen.
          req('go 1.25.5' in text(ROOT,'go.mod'),'Go version drift')
          req('github.com/enfein/mieru/v3 v3.36.1' in text(ROOT,'go.mod'),'Mieru dependency drift')
          for rel in ('go.mod','go.sum','protocol/mieru/outbound.go','constant/proxy.go'):
              req(tracked(ROOT)[rel]==tracked(GOLDEN)[rel],'frozen dependency/outbound drift '+rel)
          passline(4,'dependency-boundary','Go 1.25.5 + Mieru v3.36.1; outbound/go.mod/go.sum frozen')

          # 05 listener ownership: sing-box creates sockets, Mieru retains Accept ownership.
          src=text(ROOT,'protocol/mieru/inbound.go')
          for needle in ('config.StreamListenerFactory = listenerFactory','config.PacketListenerFactory = listenerFactory',
                         'return f.listener.ListenTCP()','return f.listener.ListenUDP()',
                         'defaultListen := badoption.Addr(netip.IPv4Unspecified())'):
              req(needle in src,'listener adapter invariant missing: '+needle)
          req('.listener.Start()' not in src and 'socketListener.Start()' not in src,'sing-box listener loop must not own Accept')
          cfg=src[src.index('func buildMieruServerConfig'):src.index('func validateMieruInboundOptions')]
          req('ListenIPAddress' not in cfg,'post-v3.36 ListenIPAddress API introduced')
          passline(5,'listener-ownership','factory uses ListenTCP/ListenUDP; no double Accept loop; omitted listen preserves wildcard')

          # 06 lifecycle/TCP routing remains the inherited Mieru server path.
          for needle in ('mieruserver.NewServer()','s.Store(config)','h.server.Start()','h.server.Stop()','h.server.Accept()',
                         'RouteConnectionEx(ctx, conn, metadata, nil)','metadata.User = userCtx.UserName()'):
              req(needle in src,'lifecycle/TCP invariant missing: '+needle)
          passline(6,'lifecycle-tcp','Store/Start/Accept/Stop + user/destination routing preserved')

          # 07 UDP protocol and transferred-buffer ownership are explicit.
          for needle in ('defer buffer.Release()','header[0] != 0 || header[1] != 0','header[2] != 0',
                         'ReadFromSocks5(buffer)','WriteToSocks5(header)','NewPacketOverStreamTunnel(conn)',
                         'RoutePacketConnectionEx(ctx, packetConn, metadata, nil)'):
              req(needle in src,'UDP invariant missing: '+needle)
          passline(7,'udp-contract','RSV/FRAG validation + buffer ownership + TCP-over-stream packet routing')

          # 08 Multipath data plane remains frozen; only approved audit logging/test files may differ.
          for rel in ('protocol/multipath/scheduler.go','protocol/multipath/capacity.go','protocol/multipath/wire.go','protocol/multipath/memory.go','option/multipath.go'):
              req(tracked(ROOT)[rel]==tracked(GOLDEN)[rel],'Multipath data-plane drift '+rel)
          mp=text(ROOT,'protocol/multipath/inbound.go')
          req('instance=", strconv.Quote(i.Tag())' in mp,'CAP_AUDIT_DROPPED instance quoting fix missing')
          passline(8,'multipath-isolation','scheduler/capacity/wire/memory frozen; only audit log schema repair allowed')

          # 09 regression coverage must exist for every repaired contract.
          mt=text(ROOT,'protocol/mieru/inbound_test.go'); at=text(ROOT,'protocol/multipath/server_audit_test.go')
          for needle in ('TestMieruInboundListenerUsesSingBoxListenOptions','TestMieruInboundOmittedListenPreservesWildcardIPv4',
                         'TestMieruPacketConnWritePacketConsumesBufferOnError','TestMieruPacketConnWritePacketConsumesBufferOnAddressEncodingError',
                         'TestMieruPacketConnRejectsInvalidUDPHeader','TestMieruPacketConnRejectsMalformedUDPAddress'):
              req(needle in mt,'missing Mieru regression '+needle)
          req('TestPreferredCapacityAuditDroppedSurvivesInstanceFilter' in at,'missing CAP_AUDIT regression')
          passline(9,'regression-surface','listener/ownership/header/audit-filter regressions present')

          # 10 build inputs and registry/config surfaces remain bounded.
          opt=text(ROOT,'option/mieru.go'); reg=text(ROOT,'include/registry.go')
          req(reg.count('mieru.RegisterInbound(registry)')==1,'Mieru inbound registration !=1')
          req(reg.count('mieru.RegisterOutbound(registry)')==1,'Mieru outbound registration drift')
          for needle in ('type MieruInboundOptions struct {','[]MieruUser','UserHintIsMandatory','type MieruUser struct {'):
              req(needle in opt,'Mieru option schema drift: '+needle)
          for rel in ('release/DEFAULT_BUILD_TAGS_OTHERS','release/LDFLAGS'):
              req(tracked(ROOT)[rel]==tracked(GOLDEN)[rel],'build input drift '+rel)
          passline(10,'build-registry','registry/options/build tags/ldflags bounded and frozen')
          print('ALL 10 DISTINCT FULL-SOURCE ARCHITECTURE AUDIT DOMAINS PASS')
          PYAUDIT
          python3 "${RUNNER_TEMP}/freeze-audit.py" | tee "${EVIDENCE_DIR}/full-source-audit.log"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize independent external contract tests
        shell: bash
        run: |
          set -euo pipefail
          INDEPENDENT_DIR="${RUNNER_TEMP}/independent-tests"
          mkdir -p "$INDEPENDENT_DIR/protocol/mieru" "$INDEPENDENT_DIR/protocol/multipath"
          cat > "$INDEPENDENT_DIR/protocol/mieru/freeze_independent_test.go" <<'GOEOF'
          package mieru
          
          import (
          	"context"
          	"errors"
          	"net"
          	"net/netip"
          	"strings"
          	"testing"
          	"time"
          
          	mierucommon "github.com/enfein/mieru/v3/apis/common"
          	"github.com/sagernet/sing-box/adapter"
          	"github.com/sagernet/sing-box/log"
          	"github.com/sagernet/sing-box/option"
          	"github.com/sagernet/sing/common/buf"
          	"github.com/sagernet/sing/common/json/badoption"
          	M "github.com/sagernet/sing/common/metadata"
          )
          
          type freezePacketConn struct {
          	read     []byte
          	write    []byte
          	writeErr error
          }
          
          func (c *freezePacketConn) ReadFrom(p []byte) (int, net.Addr, error) {
          	if c.read == nil {
          		return 0, nil, errors.New("no packet")
          	}
          	n := copy(p, c.read)
          	c.read = nil
          	return n, &net.UDPAddr{IP: net.IPv4(127, 0, 0, 1), Port: 12345}, nil
          }
          
          func (c *freezePacketConn) WriteTo(p []byte, _ net.Addr) (int, error) {
          	if c.writeErr != nil {
          		return 0, c.writeErr
          	}
          	c.write = append([]byte(nil), p...)
          	return len(p), nil
          }
          
          func (c *freezePacketConn) Close() error                     { return nil }
          func (c *freezePacketConn) LocalAddr() net.Addr              { return &net.UDPAddr{} }
          func (c *freezePacketConn) SetDeadline(time.Time) error      { return nil }
          func (c *freezePacketConn) SetReadDeadline(time.Time) error  { return nil }
          func (c *freezePacketConn) SetWriteDeadline(time.Time) error { return nil }
          
          func freezeOptions(transport string, port uint16) option.MieruInboundOptions {
          	return option.MieruInboundOptions{
          		ListenOptions: option.ListenOptions{ListenPort: port},
          		Transport:     transport,
          		Users:         []option.MieruUser{{Name: "u", Password: "p"}},
          	}
          }
          
          func freezeReserve(t *testing.T, network, address string) (uint16, bool) {
          	t.Helper()
          	if network == "tcp4" || network == "tcp6" {
          		listener, err := net.Listen(network, net.JoinHostPort(address, "0"))
          		if err != nil {
          			return 0, false
          		}
          		port := uint16(listener.Addr().(*net.TCPAddr).Port)
          		_ = listener.Close()
          		return port, true
          	}
          	packetConn, err := net.ListenPacket(network, net.JoinHostPort(address, "0"))
          	if err != nil {
          		return 0, false
          	}
          	port := uint16(packetConn.LocalAddr().(*net.UDPAddr).Port)
          	_ = packetConn.Close()
          	return port, true
          }
          
          func TestFreezeIndependentExplicitListen(t *testing.T) {
          	tests := []struct {
          		name      string
          		transport string
          		address   string
          		network   string
          	}{
          		{name: "tcp4", transport: "TCP", address: "127.0.0.1", network: "tcp4"},
          		{name: "udp4", transport: "UDP", address: "127.0.0.1", network: "udp4"},
          		{name: "tcp6", transport: "TCP", address: "::1", network: "tcp6"},
          		{name: "udp6", transport: "UDP", address: "::1", network: "udp6"},
          	}
          	for _, tt := range tests {
          		t.Run(tt.name, func(t *testing.T) {
          			port, ok := freezeReserve(t, tt.network, tt.address)
          			if !ok {
          				t.Skip("address family unavailable")
          			}
          			options := freezeOptions(tt.transport, port)
          			listenAddress := badoption.Addr(netip.MustParseAddr(tt.address))
          			options.Listen = &listenAddress
          			raw, err := NewInbound(context.Background(), nil, log.NewNOPFactory().Logger(), "freeze-listen", options)
          			if err != nil {
          				t.Fatal(err)
          			}
          			inbound := raw.(*Inbound)
          			if err := inbound.Start(adapter.StartStateStart); err != nil {
          				t.Fatal(err)
          			}
          			defer inbound.Close()
          
          			var actual net.Addr
          			if tt.transport == "TCP" {
          				if inbound.listener.TCPListener() == nil {
          					t.Fatal("TCP factory not used")
          				}
          				actual = inbound.listener.TCPListener().Addr()
          			} else {
          				if inbound.listener.UDPConn() == nil {
          					t.Fatal("UDP factory not used")
          				}
          				actual = inbound.listener.UDPConn().LocalAddr()
          			}
          			host, _, err := net.SplitHostPort(actual.String())
          			if err != nil {
          				t.Fatal(err)
          			}
          			if netip.MustParseAddr(host).Unmap() != netip.MustParseAddr(tt.address).Unmap() {
          				t.Fatalf("configured=%s actual=%s", tt.address, host)
          			}
          			if err := inbound.Close(); err != nil {
          				t.Fatal(err)
          			}
          			if inbound.server.IsRunning() {
          				t.Fatal("server still running after Close")
          			}
          		})
          	}
          }
          
          func TestFreezeIndependentOmittedListenCompatibility(t *testing.T) {
          	port, ok := freezeReserve(t, "tcp4", "127.0.0.1")
          	if !ok {
          		t.Fatal("IPv4 unavailable")
          	}
          	raw, err := NewInbound(context.Background(), nil, log.NewNOPFactory().Logger(), "freeze-default", freezeOptions("TCP", port))
          	if err != nil {
          		t.Fatal(err)
          	}
          	inbound := raw.(*Inbound)
          	if err := inbound.Start(adapter.StartStateStart); err != nil {
          		t.Fatal(err)
          	}
          	defer inbound.Close()
          	address := inbound.listener.TCPListener().Addr().(*net.TCPAddr)
          	if !address.IP.IsUnspecified() || address.IP.To4() == nil {
          		t.Fatalf("omitted listen drifted: %v", address)
          	}
          }
          
          func TestFreezeIndependentWriteBufferOwnership(t *testing.T) {
          	for _, fail := range []bool{false, true} {
          		name := "success"
          		if fail {
          			name = "write_error"
          		}
          		t.Run(name, func(t *testing.T) {
          			packetConn := &freezePacketConn{}
          			if fail {
          				packetConn.writeErr = errors.New("injected")
          			}
          			wrapped := &mieruPacketConn{PacketConn: packetConn}
          			buffer := buf.NewSize(1024)
          			_, _ = buffer.Write([]byte("payload"))
          			err := wrapped.WritePacket(buffer, M.ParseSocksaddr("203.0.113.7:53"))
          			if (err != nil) != fail {
          				t.Fatalf("unexpected error %v", err)
          			}
          			if buffer.RawCap() != 0 {
          				t.Fatalf("transferred buffer retained cap=%d", buffer.RawCap())
          			}
          		})
          	}
          }
          
          func TestFreezeIndependentAddressEncodingErrorConsumesBuffer(t *testing.T) {
          	wrapped := &mieruPacketConn{PacketConn: &freezePacketConn{}}
          	buffer := buf.NewSize(1024)
          	_, _ = buffer.Write([]byte("payload"))
          	err := wrapped.WritePacket(buffer, M.Socksaddr{Fqdn: strings.Repeat("a", 256), Port: 53})
          	if err == nil {
          		t.Fatal("expected SOCKS5 address encoding error")
          	}
          	if buffer.RawCap() != 0 {
          		t.Fatalf("address encoding error retained transferred buffer cap=%d", buffer.RawCap())
          	}
          }
          
          func TestFreezeIndependentUDPHeaderBoundary(t *testing.T) {
          	packets := [][]byte{
          		{1, 0, 0, 1, 203, 0, 113, 7, 0, 53, 'x'},
          		{0, 1, 0, 1, 203, 0, 113, 7, 0, 53, 'x'},
          		{0, 0, 1, 1, 203, 0, 113, 7, 0, 53, 'x'},
          	}
          	for _, packet := range packets {
          		wrapped := &mieruPacketConn{PacketConn: &freezePacketConn{read: append([]byte(nil), packet...)}}
          		buffer := buf.NewSize(1024)
          		_, err := wrapped.ReadPacket(buffer)
          		buffer.Release()
          		if err == nil {
          			t.Fatalf("invalid UDP header accepted: %x", packet[:3])
          		}
          	}
          }
          
          func TestFreezeIndependentMalformedUDPAddress(t *testing.T) {
          	packets := [][]byte{
          		{},
          		{0},
          		{0, 0},
          		{0, 0, 0},
          		{0, 0, 0, 9},
          		{0, 0, 0, 1, 127},
          	}
          	for _, packet := range packets {
          		wrapped := &mieruPacketConn{PacketConn: &freezePacketConn{read: append([]byte(nil), packet...)}}
          		buffer := buf.NewSize(1024)
          		_, err := wrapped.ReadPacket(buffer)
          		buffer.Release()
          		if err == nil {
          			t.Fatalf("malformed UDP packet accepted: %x", packet)
          		}
          	}
          }
          
          func TestFreezeIndependentUpstreamUDPInterop(t *testing.T) {
          	for _, address := range []string{"203.0.113.7:53", "[2001:db8::7]:5353"} {
          		t.Run(address, func(t *testing.T) {
          			destination := M.ParseSocksaddr(address)
          			packetConn := &freezePacketConn{}
          			wrapped := &mieruPacketConn{PacketConn: packetConn}
          			buffer := buf.NewSize(1024)
          			_, _ = buffer.Write([]byte("payload"))
          			if err := wrapped.WritePacket(buffer, destination); err != nil {
          				t.Fatal(err)
          			}
          			upstream := mierucommon.NewUDPAssociateWrapper(&freezePacketConn{read: packetConn.write})
          			payload := make([]byte, 1024)
          			n, actual, err := upstream.ReadFrom(payload)
          			if err != nil {
          				t.Fatal(err)
          			}
          			if actual.String() != destination.String() || string(payload[:n]) != "payload" {
          				t.Fatalf("got=%s payload=%q", actual, payload[:n])
          			}
          		})
          	}
          }
          
          func TestFreezeIndependentValidationBoundaries(t *testing.T) {
          	cases := []option.MieruInboundOptions{
          		freezeOptions("QUIC", 8964),
          		freezeOptions("TCP", 8964),
          		freezeOptions("TCP", 8964),
          		freezeOptions("TCP", 8964),
          	}
          	cases[1].Users = nil
          	cases[2].Users[0].Name = ""
          	cases[3].Users[0].Password = ""
          	for index, options := range cases {
          		if err := validateMieruInboundOptions(options); err == nil {
          			t.Fatalf("invalid validation case %d accepted", index)
          		}
          	}
          
          	zeroPort := freezeOptions("TCP", 0)
          	if _, _, err := buildMieruServerConfig(context.Background(), zeroPort); err == nil {
          		t.Fatal("zero listen_port accepted")
          	}
          }
          GOEOF

          cat > "$INDEPENDENT_DIR/protocol/multipath/freeze_independent_test.go" <<'GOEOF'
          package multipath
          
          import (
          	"context"
          	"fmt"
          	"strings"
          	"testing"
          	"time"
          
          	"github.com/sagernet/sing-box/adapter/inbound"
          	"github.com/sagernet/sing-box/log"
          )
          
          type freezeAuditLogger struct {
          	log.ContextLogger
          	lines []string
          }
          
          func (l *freezeAuditLogger) ErrorContext(_ context.Context, args ...any) {
          	l.lines = append(l.lines, fmt.Sprint(args...))
          }
          
          func (l *freezeAuditLogger) InfoContext(_ context.Context, args ...any) {
          	l.lines = append(l.lines, fmt.Sprint(args...))
          }
          
          func TestFreezeIndependentAuditDropFilter(t *testing.T) {
          	controller := newPreferredCapacityController(70, time.Second, 64<<10)
          	controller.enableAudit()
          	for i := 0; i < preferredCapacityAuditQueueLimit+1; i++ {
          		controller.recordAuditReady(time.Unix(int64(10000+i), 0))
          	}
          	logger := &freezeAuditLogger{ContextLogger: log.NewNOPFactory().Logger()}
          	inbound := &Inbound{
          		Adapter: inbound.NewAdapter("multipath", "mp-in-39002"),
          		ctx:     context.Background(),
          		logger:  logger,
          		cfg:     coreConfig{PreferredCapacity: controller},
          	}
          	inbound.flushPreferredCapacityAudit()
          
          	found := false
          	for _, line := range logger.lines {
          		if strings.Contains(line, "CAP_AUDIT_DROPPED") &&
          			strings.Contains(line, `instance="mp-in-39002"`) &&
          			strings.Contains(line, "evidence_complete=false") {
          			found = true
          		}
          	}
          	if !found {
          		t.Fatal("DROPPED evidence lost by quoted instance filter")
          	}
          }
          GOEOF
          echo "INDEPENDENT_DIR=$INDEPENDENT_DIR" >> "$GITHUB_ENV"

      - name: Independent repaired-contract execution in isolated worktree
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          rm -rf "$INDEPENDENT_WORKTREE"
          git worktree add --detach "$INDEPENDENT_WORKTREE" "${{ steps.resolve.outputs.candidate_sha }}"
          cleanup_independent() {
            git worktree remove --force "$INDEPENDENT_WORKTREE" 2>/dev/null || true
            git worktree prune || true
          }
          trap cleanup_independent EXIT

          cp "$INDEPENDENT_DIR/protocol/mieru/freeze_independent_test.go" \
            "$INDEPENDENT_WORKTREE/protocol/mieru/zz_freeze_independent_test.go"
          cp "$INDEPENDENT_DIR/protocol/multipath/freeze_independent_test.go" \
            "$INDEPENDENT_WORKTREE/protocol/multipath/zz_freeze_independent_test.go"

          (
            cd "$INDEPENDENT_WORKTREE"
            test "$(git rev-parse HEAD)" = "${{ steps.resolve.outputs.candidate_sha }}"
            CGO_ENABLED=1 go test \
              -race -count=1 -timeout=15m \
              -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" \
              -run '^TestFreezeIndependent' \
              ./protocol/mieru ./protocol/multipath
          ) 2>&1 | tee "${EVIDENCE_DIR}/independent-contracts.log"

          cleanup_independent
          trap - EXIT
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Actual mutation controls - 10 executable wrong variants
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYMUT'
          from pathlib import Path
          import json, os, re, shutil, subprocess

          root=Path(os.environ['GITHUB_WORKSPACE'])
          temp=Path(os.environ['MUTANT_ROOT'])
          temp.mkdir(parents=True,exist_ok=True)
          independent=Path(os.environ['INDEPENDENT_DIR'])
          evidence=Path(os.environ['EVIDENCE_DIR'])/'mutations'
          evidence.mkdir(parents=True,exist_ok=True)
          candidate=subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()
          tags=os.environ['BUILD_TAGS']; ldflags=os.environ['LDFLAGS_SHARED']

          mutations=[
            ('01-no-stream-factory','protocol/mieru/inbound.go','\tconfig.StreamListenerFactory = listenerFactory\n','',r'^TestFreezeIndependentExplicitListen/tcp4$','./protocol/mieru'),
            ('02-no-packet-factory','protocol/mieru/inbound.go','\tconfig.PacketListenerFactory = listenerFactory\n','',r'^TestFreezeIndependentExplicitListen/udp4$','./protocol/mieru'),
            ('03-buffer-not-released','protocol/mieru/inbound.go','\tdefer buffer.Release()\n','',r'^TestFreezeIndependentWriteBufferOwnership$','./protocol/mieru'),
            ('04-rsv-accepted','protocol/mieru/inbound.go','\tif header[0] != 0 || header[1] != 0 {','\tif false {',r'^TestFreezeIndependentUDPHeaderBoundary$','./protocol/mieru'),
            ('05-frag-accepted','protocol/mieru/inbound.go','\tif header[2] != 0 {','\tif false {',r'^TestFreezeIndependentUDPHeaderBoundary$','./protocol/mieru'),
            ('06-drop-instance-unquoted','protocol/multipath/inbound.go','strconv.Quote(i.Tag())','i.Tag()',r'^TestFreezeIndependentAuditDropFilter$','./protocol/multipath'),
            ('07-invalid-transport-accepted','protocol/mieru/inbound.go','\tif options.Transport != "TCP" && options.Transport != "UDP" {','\tif false {',r'^TestFreezeIndependentValidationBoundaries$','./protocol/mieru'),
            ('08-empty-users-accepted','protocol/mieru/inbound.go','\tif len(options.Users) == 0 {','\tif false {',r'^TestFreezeIndependentValidationBoundaries$','./protocol/mieru'),
            ('09-empty-password-accepted','protocol/mieru/inbound.go','\t\tif user.Password == "" {','\t\tif false {',r'^TestFreezeIndependentValidationBoundaries$','./protocol/mieru'),
          ]

          def run(cmd,cwd,env=None):
              return subprocess.run(cmd,cwd=cwd,env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)

          def exact_test_name(regex):
              match=re.fullmatch(r'\^([A-Za-z0-9_/-]+)\$',regex)
              if not match:
                  raise RuntimeError(f'behavior mutation requires an exact test selector: {regex}')
              return match.group(1)

          for name,rel,old,new,regex,pkg in mutations:
              work=temp/name
              subprocess.check_call(['git','worktree','add','--detach',str(work),candidate],cwd=root,stdout=subprocess.DEVNULL)
              try:
                  target=work/rel
                  data=target.read_text()
                  count=data.count(old)
                  if count!=1:
                      raise RuntimeError(f'{name}: mutation anchor count={count}')
                  data=data.replace(old,new,1)

                  # Mutation 06 must remain a compilable wrong implementation.
                  if name=='06-drop-instance-unquoted':
                      import_anchor='\t"strconv"\n'
                      import_count=data.count(import_anchor)
                      if import_count!=1:
                          raise RuntimeError(f'{name}: strconv import anchor count={import_count}')
                      data=data.replace(import_anchor,'',1)

                  target.write_text(data)
                  shutil.copyfile(independent/'protocol/mieru/freeze_independent_test.go',work/'protocol/mieru/zz_freeze_independent_test.go')
                  shutil.copyfile(independent/'protocol/multipath/freeze_independent_test.go',work/'protocol/multipath/zz_freeze_independent_test.go')
                  env=dict(os.environ,CGO_ENABLED='1')

                  # A behavior mutant must compile before it can be credited as killed.
                  compile_cmd=['go','test','-count=1','-timeout=10m','-tags',tags,'-ldflags',ldflags,'-run','^$',pkg]
                  compile_result=run(compile_cmd,work,env)
                  (evidence/f'{name}.compile.log').write_text(compile_result.stdout)
                  if compile_result.returncode!=0:
                      raise RuntimeError(f'{name}: INVALID MUTANT compile failed exit={compile_result.returncode}')

                  expected_test=exact_test_name(regex)
                  cmd=['go','test','-json','-count=1','-timeout=10m','-tags',tags,'-ldflags',ldflags,'-run',regex,pkg]
                  result=run(cmd,work,env)
                  (evidence/f'{name}.test.jsonl').write_text(result.stdout)

                  ran=False
                  failed=False
                  for line in result.stdout.splitlines():
                      try:
                          event=json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if not isinstance(event,dict) or event.get('Test')!=expected_test:
                          continue
                      if event.get('Action')=='run':
                          ran=True
                      elif event.get('Action')=='fail':
                          failed=True

                  if result.returncode==0:
                      raise RuntimeError(f'{name}: mutant SURVIVED target={expected_test}')
                  if not ran:
                      raise RuntimeError(f'{name}: INVALID RESULT target test did not run: {expected_test}')
                  if not failed:
                      raise RuntimeError(f'{name}: INVALID RESULT nonzero exit without target test failure: {expected_test}')
                  print(f'KILLED BY TARGET TEST {name}: {expected_test}')
              finally:
                  subprocess.run(['git','worktree','remove','--force',str(work)],cwd=root,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)

          # 10: commit an unapproved scheduler byte change and prove the full-tree audit rejects it.
          name='10-golden-scheduler-drift'; work=temp/name
          subprocess.check_call(['git','worktree','add','--detach',str(work),candidate],cwd=root,stdout=subprocess.DEVNULL)
          try:
              scheduler=work/'protocol/multipath/scheduler.go'
              scheduler.write_text('// MUTANT: unapproved frozen scheduler drift\n'+scheduler.read_text())
              subprocess.check_call(['git','add','protocol/multipath/scheduler.go'],cwd=work)
              subprocess.check_call(['git','-c','user.name=Mutation Control','-c','user.email=mutation@example.invalid','commit','-m','mutation control'],cwd=work,stdout=subprocess.DEVNULL)
              env=dict(os.environ,AUDIT_ROOT=str(work))
              result=run(['python3',str(Path(os.environ['RUNNER_TEMP'])/'freeze-audit.py')],work,env)
              (evidence/f'{name}.log').write_text(result.stdout)
              if result.returncode==0:
                  raise RuntimeError(f'{name}: mutant SURVIVED')
              print(f'KILLED {name}: exit={result.returncode}')
          finally:
              subprocess.run(['git','worktree','remove','--force',str(work)],cwd=root,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              subprocess.run(['git','worktree','prune'],cwd=root,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          print('ALL 10 EXECUTABLE WRONG VARIANTS KILLED')
          PYMUT
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Check formatting of exact Mieru inbound write-set
        shell: bash
        run: |
          set -euo pipefail
          files=(option/mieru.go include/registry.go include/mieru_registry_test.go protocol/mieru/inbound.go protocol/mieru/inbound_test.go protocol/multipath/inbound.go protocol/multipath/server_audit_test.go)
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then printf '%s\n' "$unformatted"; exit 1; fi

      - name: Go vet focused packages
        shell: bash
        run: |
          set -euo pipefail
          go vet -tags "$BUILD_TAGS" ./option ./include ./protocol/mieru ./protocol/multipath

      - name: Compile all repository packages without running tests
        shell: bash
        run: |
          set -euo pipefail
          go test \
            -run '^$' \
            -count=1 \
            -timeout=20m \
            -tags "$BUILD_TAGS" \
            -ldflags "$LDFLAGS_SHARED" \
            ./...

      - name: Mieru inbound and registry tests with race detector x10
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go test -race -count=10 -timeout=20m -tags "$BUILD_TAGS" -run '^(TestValidateMieruInboundOptions|TestBuildMieruServerConfig|TestBuildMieruServerConfigRequiresListenPort|TestBuildMieruServerConfigUDP|TestMieruInboundListenerUsesSingBoxListenOptions|TestMieruInboundOmittedListenPreservesWildcardIPv4|TestMieruPacketConnReadPacketDomain|TestMieruPacketConnWritePacketIPv4|TestMieruPacketConnWritePacketConsumesBufferOnError|TestMieruPacketConnRejectsInvalidUDPHeader)$' ./protocol/mieru
          CGO_ENABLED=1 go test -race -count=10 -timeout=10m -tags "$BUILD_TAGS" -run '^TestMieruInboundRegistered$' ./include

      - name: Mieru complete regression with race detector x10
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go test -race -count=10 -timeout=20m -tags "$BUILD_TAGS" ./protocol/mieru

      - name: Capacity option tests x100
        shell: bash
        run: |
          set -euo pipefail
          go test -count=100 -tags "$BUILD_TAGS" -run '^TestMultipathPreferredCapacityOption$' ./option

      - name: Capacity architecture tests with race detector x100
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go test -race -count=100 -timeout=15m -tags "$BUILD_TAGS" -run '^TestPreferredCapacity' ./protocol/multipath

      - name: Multipath correctness regression with race detector
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go test -race -count=1 -timeout=15m -skip '^TestPerformanceHealthyLinks$' -tags "$BUILD_TAGS" ./protocol/multipath

      - name: Parent vs candidate zero-field performance differential
        shell: bash
        run: |
          set -euo pipefail
          LOG_DIR="${RUNNER_TEMP}/capacity-v2-perf"
          mkdir -p "$LOG_DIR"

          run_perf() {
            local tree="$1"
            local label="$2"
            local run_id="$3"
            local log="$LOG_DIR/${label}-${run_id}.log"
            set +e
            (
              cd "$tree"
              CGO_ENABLED=1 go test \
                -race \
                -count=1 \
                -timeout=5m \
                -v \
                -tags "$BUILD_TAGS" \
                -run '^TestPerformanceHealthyLinks$' \
                ./protocol/multipath
            ) 2>&1 | tee "$log"
            local rc=${PIPESTATUS[0]}
            set -e
            echo "${label}_run_${run_id}_go_test_rc=${rc}"
          }

          run_perf "$PARENT_DIR" parent 1
          run_perf "$GITHUB_WORKSPACE" candidate 1
          run_perf "$PARENT_DIR" parent 2
          run_perf "$GITHUB_WORKSPACE" candidate 2

          python3 - "$LOG_DIR" <<'PY'
          from pathlib import Path
          import statistics, re, sys
          log_dir=Path(sys.argv[1])
          expected=[
            '1_160+600Mbps_65+110ms','8_160+600Mbps_65+110ms','32_160+600Mbps_65+110ms',
            '1_40+50Mbps_65+110ms','8_40+50Mbps_65+110ms','1_160+600Mbps_65+400ms',
            '8_160+600Mbps_65+400ms','1_160+600Mbps_110+65ms','1_160+600Mbps_5+10ms',
            '8_160+600Mbps_5+10ms','1_1000+1000Mbps_65+110ms',
          ]
          run_re=re.compile(r'^=== RUN\s+TestPerformanceHealthyLinks/(.+)$')
          rate_re=re.compile(r'performance_test\.go:\d+: flows=\d+ .*?Mbps=([0-9]+(?:\.[0-9]+)?)')
          forbidden=(
            'healthy reliable legs triggered replay','unused window credit caused memory pressure',
            'memory budget exceeded','short stream:','panic:','fatal error:','test timed out','DATA RACE',
          )
          diagnostic_re=re.compile(r'performance_test\.go:\d+: (.*)$')
          def parse(path):
            text=path.read_text(encoding='utf-8',errors='replace')
            for token in forbidden:
              if token in text: raise SystemExit(f'FAIL {path.name}: unsafe fixture result: {token}')
            current=None; values={}
            for line in text.splitlines():
              d=diagnostic_re.search(line)
              if d:
                msg=d.group(1)
                if not (msg.startswith('throughput regression:') or msg.startswith('flows=')):
                  raise SystemExit(f'FAIL {path.name}: unexpected performance diagnostic: {msg}')
              m=run_re.search(line)
              if m:
                current=m.group(1); continue
              m=rate_re.search(line)
              if m and current: values[current]=float(m.group(1))
            missing=sorted(set(expected)-set(values)); extra=sorted(set(values)-set(expected))
            if missing or extra: raise SystemExit(f'FAIL {path.name}: missing={missing} extra={extra}')
            return values
          samples={
            'parent':[parse(log_dir/'parent-1.log'),parse(log_dir/'parent-2.log')],
            'candidate':[parse(log_dir/'candidate-1.log'),parse(log_dir/'candidate-2.log')],
          }
          failed=False
          for case in expected:
            pv=[x[case] for x in samples['parent']]; cv=[x[case] for x in samples['candidate']]
            pm=statistics.median(pv); cm=statistics.median(cv); ratio=cm/pm
            status='PASS' if ratio>=0.98 else 'FAIL'
            print(f'{status} {case}: parent={pv} candidate={cv} ratio={ratio:.4f}')
            failed |= ratio < 0.98
          if failed: raise SystemExit('FAIL zero-field candidate performance below 98% of direct parent')
          print('PASS zero-field candidate retains >=98% direct-parent performance for all fixtures')
          PY

      - name: Verify candidate workspace remained pristine after all audit mutation and test stages
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$STATUS" ]]; then
            printf '%s\n' "$STATUS"
            echo 'FAIL: candidate workspace was modified by CI infrastructure' >&2
            exit 1
          fi
          echo 'PASS candidate workspace remained pristine'

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mieru-inbound-freeze-audit-evidence
          path: ${{ runner.temp }}/mieru-inbound-freeze-audit-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup audit worktrees
        if: always()
        shell: bash
        run: |
          set +e
          git worktree remove --force "$INDEPENDENT_WORKTREE" 2>/dev/null || true
          git worktree remove --force "$GOLDEN_DIR" 2>/dev/null || true
          git worktree remove --force "$REPAIR_DIR" 2>/dev/null || true
          if [[ -d "$MUTANT_ROOT" ]]; then
            while IFS= read -r -d '' dir; do
              git worktree remove --force "$dir" 2>/dev/null || true
            done < <(find "$MUTANT_ROOT" -mindepth 1 -maxdepth 1 -type d -print0 2>/dev/null)
          fi
          git worktree prune || true

  build_targets:
    name: Build ${{ matrix.label }}
    needs: audit_test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            binary: sing-box-1.14.0-multipath-beta6-darwin-amd64
          - label: Windows amd64
            runner: windows-2025
            goos: windows
            goarch: amd64
            binary: sing-box-1.14.0-multipath-beta6-windows-amd64.exe
          - label: Linux amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            binary: sing-box-1.14.0-multipath-beta6-linux-amd64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.audit_test.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup exact Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: Verify exact audited source and native runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.audit_test.outputs.candidate_sha }}"
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          test "$(go env GOHOSTARCH)" = "amd64"
          test "$(go env GOHOSTOS)" = "${{ matrix.goos }}"
          echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
          echo "go=$(go version)"
          echo "audited_commit=$(git rev-parse HEAD)"

      - name: Set build inputs
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TAGS="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_OTHERS)"
          LDFLAGS_SHARED="$(tr -d '\r\n' < release/LDFLAGS)"
          test -n "$BUILD_TAGS"
          echo "BUILD_TAGS=$BUILD_TAGS" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$LDFLAGS_SHARED" >> "$GITHUB_ENV"

      - name: Native target regression tests (Linux/macOS frozen)
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          go test \
            -count=1 \
            -timeout=15m \
            -skip '^TestPerformanceHealthyLinks$' \
            -tags "$BUILD_TAGS" \
            ./option \
            ./protocol/multipath \
            ./protocol/mieru \
            ./include

      - name: Native target regression tests (Windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          go test \
            -count=1 \
            -timeout=15m \
            -skip '^(TestPerformanceHealthyLinks|TestCoreSenderStatusAndRTTProbe)$' \
            -tags "$BUILD_TAGS" \
            -ldflags "$LDFLAGS_SHARED" \
            ./option \
            ./protocol/multipath \
            ./protocol/mieru \
            ./include

      - name: Build standalone core
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build \
            -v \
            -trimpath \
            -tags "$BUILD_TAGS" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            -o "dist/${{ matrix.binary }}" \
            ./cmd/sing-box

      - name: Smoke-test built binary and embedded version
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.binary }}"
          if [[ "${{ matrix.goos }}" != "windows" ]]; then
            chmod +x "$BIN"
          fi
          test -s "$BIN"
          ACTUAL_VERSION="$("./$BIN" version -n | tr -d '\r\n')"
          test "$ACTUAL_VERSION" = "$VERSION"
          VERSION_OUTPUT="$("./$BIN" version)"
          printf '%s\n' "$VERSION_OUTPUT"
          grep -F \
            "Environment: go${GO_VERSION} ${{ matrix.goos }}/${{ matrix.goarch }}" \
            <<< "$VERSION_OUTPUT"
          grep -F 'CGO: disabled' <<< "$VERSION_OUTPUT"

      - name: Produce checksum and build provenance
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.binary }}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 "$BIN" > "${BIN}.sha256"
          else
            sha256sum "$BIN" > "${BIN}.sha256"
          fi
          {
            echo "version=${VERSION}"
            echo "source_ref=${SOURCE_REF}"
            echo "commit=${{ needs.audit_test.outputs.candidate_sha }}"
            echo "golden_commit=${{ needs.audit_test.outputs.parent_sha }}"
            echo "golden_tree=${FROZEN_GOLDEN_TREE}"
            echo "repair_base_commit=${REPAIR_BASE_SHA}"
            echo "repair_base_tree=${REPAIR_BASE_TREE}"
            echo "go_version=$(go env GOVERSION)"
            echo "target=${{ matrix.goos }}/${{ matrix.goarch }}"
            echo "cgo=0"
            echo "build_tags=${BUILD_TAGS}"
            echo "binary=${{ matrix.binary }}"
          } > "${BIN}.buildinfo.txt"
          cat "${BIN}.sha256"
          cat "${BIN}.buildinfo.txt"

      - name: Upload verified binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: |
            dist/${{ matrix.binary }}
            dist/${{ matrix.binary }}.sha256
            dist/${{ matrix.binary }}.buildinfo.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
