name: Build Multipath Capacity V2 Server Audit v1

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch/tag/commit to audit and build
        required: true
        default: feature/multipath-capacity-v2-beta6
        type: string

permissions:
  contents: read

concurrency:
  group: multipath-capacity-v2-server-audit-v1-${{ inputs.source_ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.5'
  VERSION: '1.14.0-multipath-beta6'
  PARENT_BRANCH: 'feature/mieru-outbound-beta6'
  AUDIT_BASE_REV: '0c7792b743bb679f304395264565e94d24a95a71'

jobs:
  audit_test:
    name: Full-source audit + independent simulation + runtime tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      parent_sha: ${{ steps.resolve.outputs.parent_sha }}
      audit_base_sha: ${{ steps.resolve.outputs.audit_base_sha }}

    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup exact Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve exact candidate and clean parent
        id: resolve
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REF"
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          grep -Fx "go ${GO_VERSION}" go.mod

          CANDIDATE_SHA="$(git rev-parse HEAD)"
          AUDIT_BASE_SHA="$(git rev-parse "${AUDIT_BASE_REV}^{commit}")"
          test "$(git merge-base "$CANDIDATE_SHA" "$AUDIT_BASE_SHA")" = "$AUDIT_BASE_SHA"

          git fetch --no-tags origin \
            "+refs/heads/${PARENT_BRANCH}:refs/remotes/origin/${PARENT_BRANCH}"
          PARENT_TIP="$(git rev-parse "refs/remotes/origin/${PARENT_BRANCH}^{commit}")"
          # Freeze this incremental audit to the exact final-additive commit. The
          # clean Mieru parent is its merge-base with the maintained parent branch,
          # so a later parent-branch advance cannot create a false CI failure.
          PARENT_SHA="$(git merge-base "$AUDIT_BASE_SHA" "$PARENT_TIP")"
          test "$(git merge-base "$CANDIDATE_SHA" "$PARENT_SHA")" = "$PARENT_SHA"

          echo "source_ref=$SOURCE_REF"
          echo "candidate_sha=$CANDIDATE_SHA"
          echo "audit_base_sha=$AUDIT_BASE_SHA"
          echo "parent_branch=$PARENT_BRANCH"
          echo "parent_tip=$PARENT_TIP"
          echo "clean_parent_sha=$PARENT_SHA"
          echo "go=$(go version)"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "parent_sha=$PARENT_SHA" >> "$GITHUB_OUTPUT"
          echo "audit_base_sha=$AUDIT_BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Set audited build inputs
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TAGS="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_OTHERS)"
          LDFLAGS_SHARED="$(tr -d '\r\n' < release/LDFLAGS)"
          test -n "$BUILD_TAGS"
          echo "BUILD_TAGS=$BUILD_TAGS" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$LDFLAGS_SHARED" >> "$GITHUB_ENV"
          echo "BUILD_TAGS=$BUILD_TAGS"
          echo "LDFLAGS_SHARED=$LDFLAGS_SHARED"

      - name: Materialize exact parent worktree
        shell: bash
        run: |
          set -euo pipefail
          PARENT_DIR="${RUNNER_TEMP}/multipath-parent-v2"
          rm -rf "$PARENT_DIR"
          git worktree add --detach "$PARENT_DIR" "${{ steps.resolve.outputs.parent_sha }}"
          echo "PARENT_DIR=$PARENT_DIR" >> "$GITHUB_ENV"

      - name: Materialize exact final-additive audit baseline
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_BASE_DIR="${RUNNER_TEMP}/multipath-audit-base-v2-additive"
          rm -rf "$AUDIT_BASE_DIR"
          git worktree add --detach "$AUDIT_BASE_DIR" "${{ steps.resolve.outputs.audit_base_sha }}"
          echo "AUDIT_BASE_DIR=$AUDIT_BASE_DIR" >> "$GITHUB_ENV"

      - name: Full-source server-audit closure audit x10
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/multipath-capacity-v2-server-audit-full-audit.py" <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import hashlib, os, re, subprocess, sys
          ROOT=Path(os.environ['GITHUB_WORKSPACE'])
          PARENT=Path(os.environ['PARENT_DIR'])
          REPORT=Path(os.environ['RUNNER_TEMP'])/'multipath-capacity-v2-server-audit-full-audit-report.txt'
          AUDIT_BASE=Path(os.environ['AUDIT_BASE_DIR'])
          EXPECTED_PARENT_MODIFIED={
           'README.md','option/multipath.go','option/multipath_test.go',
           'protocol/multipath/activation.go','protocol/multipath/inbound.go','protocol/multipath/outbound.go',
           'protocol/multipath/reorder_options_test.go','protocol/multipath/scheduler.go',
           'protocol/multipath/status.go','protocol/multipath/types.go',
          }
          EXPECTED_PARENT_ADDED={'protocol/multipath/capacity.go','protocol/multipath/capacity_test.go','protocol/multipath/server_audit_test.go'}
          EXPECTED_AUDIT_MODIFIED={'README.md','protocol/multipath/activation.go','protocol/multipath/capacity.go','protocol/multipath/inbound.go','protocol/multipath/types.go'}
          EXPECTED_AUDIT_ADDED={'protocol/multipath/server_audit_test.go'}
          MIERU={'constant/proxy.go','option/mieru.go','protocol/mieru/outbound.go','include/registry.go','go.mod','go.sum'}
          FROZEN_RUNTIME={'protocol/multipath/wire.go','protocol/multipath/telemetry.go','protocol/multipath/memory.go','protocol/multipath/stream/path.go','protocol/multipath/protocol.go','protocol/multipath/performance_test.go'}
          class Fail(Exception): pass
          
          def tracked(root):
              raw=subprocess.check_output(['git','-C',str(root),'ls-files','-s','-z'])
              entries=[]
              for record in raw.split(b'\0'):
                  if not record:
                      continue
                  meta,path_b=record.split(b'\t',1)
                  mode_b,oid_b,stage_b=meta.split()
                  if stage_b != b'0':
                      raise Fail(f'unmerged index entry: {os.fsdecode(path_b)} stage={stage_b.decode()}')
                  entries.append((os.fsdecode(path_b),mode_b.decode(),oid_b.decode()))
              return sorted(entries,key=lambda x:x[0])
          def tracked_payload(root,rel,mode,oid):
              p=root/rel
              if mode == '160000':
                  # Git submodule/gitlink: the tracked source is the commit OID, while the
                  # checkout path is a directory. Never call read_bytes() on that directory.
                  return b'gitlink:' + oid.encode()
              if mode == '120000':
                  if not p.is_symlink():
                      raise Fail(f'tracked symlink missing or materialized incorrectly: {rel}')
                  return os.readlink(p).encode('utf-8','surrogateescape')
              if not p.is_file():
                  raise Fail(f'tracked regular file is not a file: {rel} mode={mode}')
              return p.read_bytes()
          def tree_digest(root):
              h=hashlib.sha256(); n=0; total=0
              for rel,mode,oid in tracked(root):
                  rel_b=rel.encode('utf-8','surrogateescape'); mode_b=mode.encode(); b=tracked_payload(root,rel,mode,oid)
                  n+=1
                  if mode != '160000': total+=len(b)
                  h.update(len(rel_b).to_bytes(8,'big')); h.update(rel_b)
                  h.update(len(mode_b).to_bytes(8,'big')); h.update(mode_b)
                  h.update(len(b).to_bytes(8,'big')); h.update(b)
              return n,total,h.hexdigest()
          def scan_full_tree(): return tree_digest(ROOT)
          def text(rel): return (ROOT/rel).read_text(encoding='utf-8')
          def parent_text(rel): return (PARENT/rel).read_text(encoding='utf-8')
          def require(c,msg):
              if not c: raise Fail(msg)
          def diffsets(a,b):
              af={rel:(mode,oid) for rel,mode,oid in tracked(a)}; bf={rel:(mode,oid) for rel,mode,oid in tracked(b)}
              added=set(bf)-set(af); removed=set(af)-set(bf); modified={k for k in set(af)&set(bf) if af[k]!=bf[k]}
              return modified,added,removed
          def extract_func(src,sig):
              start=src.index(sig); brace=src.index('{',start); depth=0
              for i in range(brace,len(src)):
                  if src[i]=='{': depth+=1
                  elif src[i]=='}':
                      depth-=1
                      if depth==0: return src[start:i+1]
              raise Fail('unbalanced '+sig)
          
          def pass1():
              m,a,r=diffsets(PARENT,ROOT); require(m==EXPECTED_PARENT_MODIFIED and a==EXPECTED_PARENT_ADDED and not r,f'clean-parent write-set mismatch modified={sorted(m)} added={sorted(a)} removed={sorted(r)}')
              im,ia,ir=diffsets(AUDIT_BASE,ROOT); require(im==EXPECTED_AUDIT_MODIFIED and ia==EXPECTED_AUDIT_ADDED and not ir,f'incremental server-audit write-set mismatch modified={sorted(im)} added={sorted(ia)} removed={sorted(ir)}')
              for rel in MIERU: require((ROOT/rel).read_bytes()==(PARENT/rel).read_bytes(),f'Mieru/dependency drift: {rel}')
              return 'exact final-additive incremental write-set + clean-parent feature write-set + Mieru/dependency freeze'
          def pass2():
              opt=text('option/multipath.go'); cap=text('protocol/multipath/capacity.go'); inp=text('protocol/multipath/inbound.go'); out=text('protocol/multipath/outbound.go'); typ=text('protocol/multipath/types.go')
              require(opt.count('PreferredCapacityMbps')==2,'field not exactly inbound+outbound')
              require('if mbps == 0 {\n\t\treturn nil' in cap,'zero field does not create nil controller')
              require(inp.count('newPreferredCapacityController(options.PreferredCapacityMbps')==1,'inbound controller ownership wrong')
              require(out.count('newPreferredCapacityController(options.PreferredCapacityMbps')==1,'outbound controller ownership wrong')
              require('PreferredCapacity              *preferredCapacityController' in typ,'core config shared pointer missing')
              require('cfg := o.cfg' in out,'outbound per-core config no longer shallow-copies shared controller')
              require('preferred_capacity' not in text('protocol/multipath/wire.go').lower(),'field leaked into wire')
              require('preferred_capacity' not in text('protocol/multipath/telemetry.go').lower(),'field leaked into telemetry')
              return 'instance ownership + Local-TX direction isolation + strict zero-field bypass + wire isolation'
          def pass3():
              act=text('protocol/multipath/activation.go'); base=(AUDIT_BASE/'protocol/multipath/activation.go').read_text(encoding='utf-8')
              for needle in ('activationAfterBytes(', 'c.cfg.ThresholdBytesPS > 0', 'c.cfg.ActivationOnQueue'): require(needle in act,'original activation trigger missing: '+needle)
              require(act.count('if !capacity.DeliveryReady {')==3,'all three original triggers are not explicitly capacity-gated')
              require(act.count('recordPreferredCapacityGateDecision(now, info, capacity, false)')==3,'blocked decision evidence missing from a trigger')
              require(act.count('recordPreferredCapacityGateDecision(now, info, capacity, true)')==3,'opened decision evidence missing from a trigger')
              for sig in ('func activationAfterBytes(', 'func (c *mpCore) activate('): require(extract_func(act,sig)==extract_func(base,sig),'control helper changed while adding audit: '+sig)
              state=extract_func(act,'func (c *mpCore) preferredCapacityActivationState'); require('snapshot.DeliveryReady = true' in state and 'snapshot.RecoveryBypass = true' in state,'recovery bypass evidence missing')
              prepare=extract_func(act,'func (c *mpCore) preparePreferredCapacityActivation'); require('!c.cfg.Recovery.allows(0)' in prepare,'recovery bypass can establish normal protection'); require('controller.activateProtection(now, capacity)' in prepare,'protection activation missing')
              return 'original beta6 trigger predicates preserved; all three capacity decisions directly evidenced; recovery bypass remains non-normal admission'
          def pass4():
              sch=text('protocol/multipath/scheduler.go'); psch=parent_text('protocol/multipath/scheduler.go'); sig='func (c *mpCore) choosePathLocked(length int) *mpLeg'
              require(extract_func(sch,sig)==extract_func(psch,sig),'original beta6 scheduler body changed')
              wrap=extract_func(sch,'func (c *mpCore) choosePathForSubmitLocked')
              require('chosen := c.choosePathLocked(length)' in wrap,'wrapper does not start from original scheduler')
              require('if controller == nil || chosen == nil' in wrap,'zero-field exact candidate bypass missing')
              require('if chosen.id == 0' in wrap,'natural preferred candidate not preserved')
              for needle in ('preferred.path.Stale','preferred.busy','!preferred.ready.Load()','preferred.path.Outstanding()+uint64(length) > pipeline'): require(needle in wrap,'preferred safety eligibility missing: '+needle)
              require('return pathSelection{leg: preferred, reservation: reservation}' in wrap,'owed protected assignment cannot override booster')
              fin=extract_func(sch,'func (s pathSelection) finish'); require('.commit()' in fin and '.refund()' in fin,'reservation transaction incomplete')
              return 'unchanged beta6 scheduler + additive wrapper + no busy/full HOL + transactional accounting'
          def pass5():
              sch=text('protocol/multipath/scheduler.go'); cap=text('protocol/multipath/capacity.go')
              hw=extract_func(sch,'func (c *mpCore) handleWindow')
              require('leg.path.Feedback(message.Paths[leg.id], now)' in hw,'peer receipt feedback missing')
              require('confirmPreferredCapacityDelivery(leg.path.Received)' in hw and 'observePreferredDelivery(delivered, now)' in hw,'peer-confirmed normal delivery authority missing')
              submit=extract_func(sch,'func (c *mpCore) submitLocked'); require('if !repair {' in submit and 'recordPreferredCapacityRange' in submit,'repair exclusion missing')
              require('c.assigned += uint64(r.bytes)' in cap,'successful assignment diagnostic missing')
              return 'peer-confirmed normal unique delivery authority + repair exclusion + successful assignment diagnostics'
          def pass6():
              cap=text('protocol/multipath/capacity.go'); tests=text('protocol/multipath/capacity_test.go')
              for needle in ('protectedBytesPS','protectionValid','protectionActive','activateProtection','reservationRateLocked'): require(needle in cap,'additive state missing: '+needle)
              rate=extract_func(cap,'func (c *preferredCapacityController) reservationRateLocked'); require('if c.protectionValid' in rate and 'return c.protectedBytesPS' in rate,'post-activation reservation tied to target')
              arm=extract_func(cap,'func (c *preferredCapacityController) activateProtection'); require('c.credit = float64(max(c.chunkSize, 1))' in arm,'pre-activation surplus not reset at booster admission')
              require('TestPreferredCapacityProtectsProven90AgainstBoosterDisplacement' in tests,'90->70 regression missing')
              require('TestPreferredCapacityTarget50DoesNotPullProven75Down' in tests,'50->75 no-cap regression missing')
              return 'explicit booster-additive invariant protects delivery-proven P rather than configured T'
          def pass7():
              cap=text('protocol/multipath/capacity.go'); tests=text('protocol/multipath/capacity_test.go'); upd=extract_func(cap,'func (c *preferredCapacityController) updateProtectedRateLocked')
              require('c.assignmentRate+assignmentTolerance < protected' in upd,'scheduler under-assignment can self-ratify degradation')
              require('preferredCapacityDegradeWindows' in upd and 'c.degradeWindows++' in upd,'multi-window physical degradation evidence missing')
              require('c.setProtectedRateLocked(now, c.deliveryRate, true, "physical_delivery_degradation")' in upd,'delivery-driven physical decay missing')
              require('(c.protectionValid && c.deliveryRate > c.protectedBytesPS)' in upd,'below-target recovery cannot relearn')
              require('protected := c.protectedBytesPS' in upd,'degradation remains incorrectly anchored to admission target')
              for name in ('TestPreferredCapacityLowDemandDoesNotDecayProvenRate','TestPreferredCapacitySchedulerUnderAssignmentCannotDecayProvenRate','TestPreferredCapacityModerateSchedulerUnderAssignmentCannotDecayProvenRate','TestPreferredCapacityRealDeliveryDegradationDecaysConservatively','TestPreferredCapacityRealDegradationMayFallBelowAdmissionTarget','TestPreferredCapacityBelowTargetDegradationAndRecoveryRemainDeliveryDriven','TestPreferredCapacityHigherPeerDeliveryRaisesProtection'): require(name in tests,'adaptation test missing: '+name)
              return 'no self-ratifying decay; low demand preserved; real degradation/recovery remains delivery-driven'
          def pass8():
              cap=text('protocol/multipath/capacity.go'); sch=text('protocol/multipath/scheduler.go'); inp=text('protocol/multipath/inbound.go'); section=cap[:cap.index('// recordPreferredCapacityRange')]
              require('c.stateMu' not in section and 'c.legsMu' not in section,'controller calls back into core locks / reverses lock order')
              require('now.Before(c.deliveryStart)' in cap and 'now.Before(c.creditLast)' in cap,'cross-core monotonic time guards missing')
              require('preferredCapacityDebtChunks' in cap and 'preferredCapacitySurplusChunks' in cap,'credit bounds missing')
              require('preferredCapacityRanges' in cap and 'preferredCapacityRangeHead' in cap,'receipt range lifecycle missing')
              require('selection.finish(pumpErr)' in sch,'reservation lifecycle detached from submit result')
              require('preferredCapacityAuditQueueLimit = 1024' in cap and 'c.auditDropped++' in cap,'server audit buffer is not bounded with explicit loss')
              require('go i.senderStatusLoop()' in inp and 'go i.flushPreferredCapacityAudit' not in inp,'audit introduced a new control/logging goroutine')
              require('CAP_AUDIT_DROPPED' in inp and 'evidence_complete=false' in inp,'audit loss is not FIELD-failing evidence')
              return 'lock-order isolation + monotonic shared time + bounded control state/audit queue + no new audit goroutine + explicit evidence loss'
          def pass9():
              cap=text('protocol/multipath/capacity.go'); inp=text('protocol/multipath/inbound.go'); out=text('protocol/multipath/outbound.go'); typ=text('protocol/multipath/types.go'); readme=text('README.md'); status=text('protocol/multipath/status.go'); reorder=text('protocol/multipath/reorder_options_test.go')
              for ev in ('CAP_AUDIT_READY','CAP_GATE_BLOCKED','CAP_GATE_OPENED','CAP_PROTECTION_ARMED','CAP_WINDOW','CAP_PROTECTION_CHANGED'): require(ev in cap,'server FIELD audit event missing: '+ev)
              for field in ('original_trigger_satisfied','recovery_bypass','target_mbps','delivery_mbps','delivery_ready','protected_mbps','protection_valid','protection_active','preferred_assignment_mbps','degrade_windows','normal_booster_admitted','current_bytes','threshold_bytes','session_id','destination','controller_window_seq'): require(field in cap,'server FIELD evidence field missing: '+field)
              require(inp.count('preferredCapacity.enableAudit()')==1,'server inbound audit not enabled exactly once')
              require('enableAudit()' not in out,'client outbound unexpectedly enables server audit plane')
              for needle in ('recordAuditReady(time.Now())','i.flushPreferredCapacityAudit()','cfg.CapacityAuditSessionID = statusSessionID(hello.Session)','cfg.CapacityAuditDestination = destination.String()'): require(needle in inp,'server audit lifecycle/correlation missing: '+needle)
              require('CAP_AUDIT_READY side=server' in readme and 'CAP_GATE_BLOCKED' in readme and 'original_trigger_satisfied=true' in readme,'FIELD precheck/acceptance contract missing from README')
              for needle in ('protected_mbps','protection_valid','protection_active','preferred_assigned_bytes','assignment_bytes_per_second'): require(needle in status,'existing outbound capacity status drifted: '+needle)
              require('baseline.PreferredCapacity != nil' in reorder and 'omitted preferred capacity created a controller' in reorder,'zero-field config regression missing')
              for rel in FROZEN_RUNTIME: require((ROOT/rel).read_bytes()==(PARENT/rel).read_bytes(),f'frozen runtime drift: {rel}')
              require('CAP_AUDIT' not in text('protocol/multipath/wire.go') and 'CAP_AUDIT' not in text('protocol/multipath/telemetry.go'),'server audit leaked into wire/telemetry')
              return 'server inbound FIELD observability closure + precheck + session correlation + outbound-status preservation + frozen runtime'
          def pass10():
              tests=text('protocol/multipath/capacity_test.go')+'\n'+text('protocol/multipath/server_audit_test.go'); gomod=text('go.mod')
              required=['TestPreferredCapacityProtectsProven90AgainstBoosterDisplacement','TestPreferredCapacityTarget50DoesNotPullProven75Down','TestPreferredCapacitySharedProtectionAcrossCores','TestPreferredCapacityPreActivationSurplusCannotLicenseImmediateDisplacement','TestPreferredCapacityBusyPreferredDoesNotBlockBooster','TestPreferredCapacityFullPreferredDoesNotBlockBooster','TestPreferredCapacityDisabledReturnsOriginalDecision','TestPreferredCapacityRepairRangesExcludedFromDelivery','TestPreferredCapacitySchedulerUnderAssignmentCannotDecayProvenRate','TestPreferredCapacityModerateSchedulerUnderAssignmentCannotDecayProvenRate','TestPreferredCapacityBelowTargetDegradationAndRecoveryRemainDeliveryDriven','TestPreferredCapacityServerAuditReadyAndDisabledIsolation','TestPreferredCapacityServerAuditBlockedAfterOriginalBytesTrigger','TestPreferredCapacityServerAuditOpenedAndProtectionArmed','TestPreferredCapacityRecoveryBypassIsNotReportedAsNormalAdmission','TestPreferredCapacityServerAuditWindowAndPhysicalDegradationReason','TestPreferredCapacityAuditIsDecisionEquivalent','TestPreferredCapacityAuditQueueIsBoundedAndLossIsExplicit','TestPreferredCapacityAuditLogLineCarriesFieldAcceptanceEvidence']
              for n in required: require('func '+n in tests,'required adversarial/audit test missing: '+n)
              require(re.search(r'^go 1\.25\.5$',gomod,re.M) is not None,'Go 1.25.5 baseline changed')
              require((ROOT/'release/DEFAULT_BUILD_TAGS_OTHERS').read_bytes()==(PARENT/'release/DEFAULT_BUILD_TAGS_OTHERS').read_bytes(),'build tags drift')
              require((ROOT/'release/LDFLAGS').read_bytes()==(PARENT/'release/LDFLAGS').read_bytes(),'ldflags drift')
              return 'additive adversarial regressions + server FIELD evidence tests + Go/build inputs frozen'
          
          passes=[pass1,pass2,pass3,pass4,pass5,pass6,pass7,pass8,pass9,pass10]
          lines=[]; base=None
          for i,fn in enumerate(passes,1):
              n,total,d=scan_full_tree(); base=base or d
              try:
                  require(d==base,'source tree changed during audit')
                  line=f'PASS {i:02d} files={n} bytes={total} tree_sha256={d} :: {fn()}'
              except Exception as e:
                  line=f'FAIL {i:02d} files={n} bytes={total} tree_sha256={d} :: {e}'; lines.append(line); print(line); REPORT.write_text('\n'.join(lines)+'\n'); sys.exit(1)
              lines.append(line); print(line)
          REPORT.write_text('\n'.join(lines)+'\nALL 10 COMPLETE-SOURCE AUDIT PASSES COMPLETE\n')
          print('ALL 10 COMPLETE-SOURCE AUDIT PASSES COMPLETE')
          PY
          python3 "${RUNNER_TEMP}/multipath-capacity-v2-server-audit-full-audit.py"

      - name: Independent external additive simulation x10 with mutation controls
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/multipath-capacity-v2-additive-independent-sim.py" <<'PY'
          #!/usr/bin/env python3
          """External physical-model simulation for preferred_capacity_mbps additive semantics.
          
          This simulator deliberately does not import, parse, or copy Go scheduler/controller
          logic. It models only frozen external behavior: one shared Local-TX preferred
          resource, peer-confirmed normal delivery as capacity authority, target as admission
          threshold, booster as additive excess, and conservative adaptation after genuine
          physical degradation.
          """
          from dataclasses import dataclass, field
          from typing import List, Optional
          import json, os
          
          @dataclass
          class Phase:
              seconds: int
              demand: float
              preferred_cap: float
              booster_cap: float
              repair: float = 0.0
              busy: bool = False
          
          @dataclass
          class Case:
              name: str
              target: float
              flows: int
              phases: List[Phase]
              baseline_split: Optional[tuple[float,float]] = None
          
          @dataclass
          class Row:
              t: int
              demand: float
              preferred: float
              booster: float
              repair: float
              protected: float
              ready: bool
              active: bool
          
          class SpecPolicy:
              def __init__(self, case: Case):
                  self.c = case
                  self.active = False
                  self.protected = 0.0
                  self.degrade = 0
                  self.rows: List[Row] = []
          
              def step(self, t: int, p: Phase):
                  if self.c.target == 0:
                      ps, bs = self.c.baseline_split or (0.6, 0.4)
                      pref = min(p.preferred_cap, p.demand * ps)
                      boost = min(p.booster_cap, p.demand * bs)
                      self.rows.append(Row(t,p.demand,pref,boost,p.repair,0,True,False))
                      return
          
                  if not self.active:
                      # Before booster admission all normal DATA stays preferred. Physical
                      # delivery, not local assignment or repair, decides readiness.
                      pref = min(p.demand, p.preferred_cap)
                      ready = pref >= self.c.target
                      excess = p.demand > pref + 1e-9
                      if ready:
                          # The complete preferred-only window proves what can be protected.
                          self.protected = max(self.protected, pref)
                      boost = 0.0
                      self.rows.append(Row(t,p.demand,pref,boost,p.repair,self.protected,ready,False))
                      # Treat the frozen original activation trigger as satisfied in formal
                      # high-load cases; no booster is useful when there is no excess.
                      if ready and excess:
                          self.active = True
                      return
          
                  # Additive phase: preserve the delivery-proven preferred contribution.
                  pref_assignment = min(p.demand, self.protected)
                  pref = min(pref_assignment, p.preferred_cap)
          
                  # busy/full is a safety condition, not a reason to wait. Any normal demand
                  # that the preferred path cannot physically deliver may continue on booster.
                  remaining = max(0.0, p.demand - pref)
                  boost = min(p.booster_cap, remaining)
          
                  # Natural preferred throughput above the protected value is never capped.
                  # When there is no need for booster, all demand remains preferred.
                  if p.demand <= p.preferred_cap:
                      pref = p.demand
                      boost = 0.0
                  if pref > self.protected:
                      self.protected = pref
          
                  # A low delivery sample may only lower protection when enough preferred
                  # work was actually assigned. Low demand / scheduler under-assignment must
                  # not ratify displacement. Require three complete materially-low windows.
                  healthy = self.protected * 0.90
                  if pref_assignment >= healthy and pref < healthy:
                      self.degrade += 1
                      if self.degrade >= 3:
                          self.protected = pref
                          self.degrade = 0
                  else:
                      self.degrade = 0
          
                  self.rows.append(Row(t,p.demand,pref,boost,p.repair,self.protected,pref>=self.c.target,self.active))
          
              def run(self):
                  t=0
                  for phase in self.c.phases:
                      for _ in range(phase.seconds):
                          self.step(t,phase); t+=1
                  return self.rows
          
          # Mutants intentionally embody previously observed or plausible wrong architectures.
          class FloorOnlyMutant(SpecPolicy):
              def step(self,t,p):
                  was=self.active
                  super().step(t,p)
                  if not was and self.active:
                      self.protected=self.c.target
                  elif self.active:
                      # old V2 behavior: target floor only
                      self.protected=self.c.target
                      r=self.rows[-1]
                      pref=min(p.preferred_cap,p.demand,self.c.target)
                      boost=min(p.booster_cap,max(0,p.demand-pref))
                      self.rows[-1]=Row(r.t,r.demand,pref,boost,r.repair,self.protected,r.ready,r.active)
          
          class TargetCapMutant(FloorOnlyMutant):
              pass
          
          class PerSessionGateMutant(SpecPolicy):
              def step(self,t,p):
                  if not self.active and self.c.target>0 and p.demand/self.c.flows < self.c.target:
                      pref=min(p.demand,p.preferred_cap)
                      self.rows.append(Row(t,p.demand,pref,0,p.repair,0,False,False)); return
                  super().step(t,p)
          
          class BusyWaitMutant(SpecPolicy):
              def step(self,t,p):
                  super().step(t,p)
                  if self.active and p.busy:
                      r=self.rows[-1]
                      self.rows[-1]=Row(r.t,r.demand,r.preferred,0,r.repair,r.protected,r.ready,r.active)
          
          class LocalWriteGateMutant(SpecPolicy):
              def step(self,t,p):
                  if not self.active and self.c.target>0 and p.demand>=self.c.target:
                      pref=min(p.demand,p.preferred_cap)
                      self.protected=max(self.c.target,pref)
                      self.active=True
                      boost=min(p.booster_cap,max(0,p.demand-pref))
                      self.rows.append(Row(t,p.demand,pref,boost,p.repair,self.protected,True,True)); return
                  super().step(t,p)
          
          class RepairCountsMutant(SpecPolicy):
              def step(self,t,p):
                  if not self.active and self.c.target>0:
                      pref=min(p.demand,p.preferred_cap)
                      if pref+p.repair>=self.c.target:
                          self.protected=max(self.c.target,pref)
                          self.active=True
                          boost=min(p.booster_cap,max(0,p.demand-pref))
                          self.rows.append(Row(t,p.demand,pref,boost,p.repair,self.protected,True,True)); return
                  super().step(t,p)
          
          class HistoricalLeakMutant(SpecPolicy):
              def step(self,t,p):
                  super().step(t,p)
                  if self.active and p.demand < self.c.target:
                      r=self.rows[-1]; leak=min(p.booster_cap,p.demand*0.15)
                      self.rows[-1]=Row(r.t,r.demand,max(0,r.preferred-leak),leak,r.repair,r.protected,r.ready,r.active)
          
          class ZeroDriftMutant(SpecPolicy):
              def step(self,t,p):
                  if self.c.target==0:
                      pref=min(p.preferred_cap,p.demand*0.9); boost=min(p.booster_cap,p.demand*0.1)
                      self.rows.append(Row(t,p.demand,pref,boost,p.repair,0,True,False)); return
                  super().step(t,p)
          
          class UnderassignmentRatifiesMutant(SpecPolicy):
              def __init__(self,case): super().__init__(case); self.forced=False
              def step(self,t,p):
                  super().step(t,p)
                  if self.active and not self.forced:
                      self.protected=self.c.target; self.forced=True
          
          class NoDegradeMutant(SpecPolicy):
              def step(self,t,p):
                  old=self.protected
                  super().step(t,p)
                  if self.active and old>0 and self.protected<old:
                      self.protected=old
          
          CASES=[
              Case('01-below-target-60',70,1,[Phase(4,60,90,100)]),
              Case('02-demand80-preferred90-no-excess',70,4,[Phase(4,80,90,100)]),
              Case('03-proven90-target70-demand150',70,4,[Phase(1,150,90,100),Phase(4,150,90,100)]),
              Case('04-eight-flow-proven80-demand160',70,8,[Phase(1,160,80,100),Phase(4,160,80,100)]),
              Case('05-target50-proven75-demand120',50,4,[Phase(1,120,75,100),Phase(4,120,75,100)]),
              Case('06-busy-preferred-excess-continues',70,4,[Phase(1,140,75,100),Phase(4,140,75,100,busy=True)]),
              Case('07-real-degrade-90-to80',70,4,[Phase(1,150,90,100),Phase(1,150,90,100),Phase(4,150,80,100,busy=True)]),
              Case('08-high-to-low-demand',70,4,[Phase(1,150,90,100),Phase(2,150,90,100),Phase(3,60,90,100)]),
              Case('09-repair-does-not-unlock',70,4,[Phase(4,100,50,100,repair=30)]),
              Case('10-target0-transparency',0,4,[Phase(4,100,100,100)],baseline_split=(0.6,0.4)),
          ]
          
          def last(rows): return rows[-1]
          def req(cond,msg):
              if not cond: raise AssertionError(msg)
          
          def check(case,rows):
              r=last(rows)
              n=case.name
              if n.startswith('01'):
                  req(abs(r.preferred-60)<0.01 and r.booster==0 and not r.active,'below-target leaked booster')
              elif n.startswith('02'):
                  req(abs(r.preferred-80)<0.01 and r.booster==0,'demand within preferred capacity used booster')
              elif n.startswith('03'):
                  req(r.preferred>=89 and 59<=r.booster<=61 and r.protected>=89,'90->70 displacement or wrong excess')
              elif n.startswith('04'):
                  req(r.preferred>=79 and 79<=r.booster<=81,'8-flow shared protection failed')
              elif n.startswith('05'):
                  req(r.preferred>=74 and 44<=r.booster<=46,'target50 pulled preferred75 down')
              elif n.startswith('06'):
                  req(r.preferred>=74 and r.booster>=64,'busy preferred blocked booster excess')
              elif n.startswith('07'):
                  req(79<=r.protected<=81 and r.preferred>=79 and r.booster>=69,'real degradation did not adapt to80')
              elif n.startswith('08'):
                  req(abs(r.preferred-60)<0.01 and r.booster==0,'low demand leaked booster after historical activation')
              elif n.startswith('09'):
                  req(not r.active and r.booster==0 and abs(r.preferred-50)<0.01,'repair/local demand falsely unlocked booster')
              elif n.startswith('10'):
                  req(abs(r.preferred-60)<0.01 and abs(r.booster-40)<0.01,'target0 drifted baseline')
          
          print('=== 10 EXTERNAL PHYSICAL SIMULATIONS ===')
          formal=[]
          for i,c in enumerate(CASES,1):
              p=SpecPolicy(c); rows=p.run(); check(c,rows); r=last(rows)
              rec={'simulation':i,'case':c.name,'preferred_mbps':r.preferred,'booster_mbps':r.booster,'protected_mbps':r.protected,'active':r.active}
              formal.append(rec)
              print(f"PASS SIM {i:02d} {c.name}: preferred={r.preferred:.2f} booster={r.booster:.2f} protected={r.protected:.2f} active={r.active}")
          
          print('\n=== MUTATION / WRONG-ARCHITECTURE KILLS ===')
          kill_plan=[
              ('old-v2-floor-only-90-to70',FloorOnlyMutant,CASES[2]),
              ('target-as-cap',TargetCapMutant,CASES[4]),
              ('per-session-target',PerSessionGateMutant,CASES[3]),
              ('preferred-busy-waits',BusyWaitMutant,CASES[5]),
              ('local-write-gate',LocalWriteGateMutant,CASES[8]),
              ('repair-counts-as-capacity',RepairCountsMutant,CASES[8]),
              ('historical-active-leak',HistoricalLeakMutant,CASES[7]),
              ('target-zero-drift',ZeroDriftMutant,CASES[9]),
              ('underassignment-ratifies-70',UnderassignmentRatifiesMutant,CASES[2]),
              ('never-decays-real-degradation',NoDegradeMutant,CASES[6]),
          ]
          killed=[]
          for i,(name,cls,c) in enumerate(kill_plan,1):
              p=cls(c); rows=p.run()
              try:
                  check(c,rows)
              except AssertionError as e:
                  killed.append(name); print(f'PASS KILL {i:02d} {name}: {e}')
              else:
                  raise SystemExit(f'FAIL simulator could not kill {name}')
          
          out={'formal_simulations':formal,'mutants_killed':killed}
          outdir=os.environ.get('RUNNER_TEMP','.')
          os.makedirs(outdir,exist_ok=True)
          with open(os.path.join(outdir,'multipath-capacity-v2-additive-sim-results.json'),'w') as f: json.dump(out,f,indent=2)
          with open(os.path.join(outdir,'multipath-capacity-v2-additive-sim-report.txt'),'w') as f:
              f.write('10 external physical simulations: PASS\n')
              for r in formal: f.write(json.dumps(r)+'\n')
              f.write('10 wrong-architecture mutants killed: PASS\n')
              for m in killed: f.write('MUTANT KILLED: '+m+'\n')
          print('\nALL 10 SIMULATIONS PASS; ALL 10 WRONG ARCHITECTURES KILLED')
          PY
          python3 "${RUNNER_TEMP}/multipath-capacity-v2-additive-independent-sim.py"

      - name: Independent Server FIELD Audit Closure v1 acceptance x10 + mutation controls
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/server-audit-v1-independent.py" <<'PY'
          from dataclasses import dataclass, replace
          MiB=1024*1024
          @dataclass(frozen=True)
          class E:
              kind:str; target:float; delivery:float=0; ready:bool=False; trigger:str='none'; trigger_ok:bool=False
              current_bytes:int=0; threshold_bytes:int=0; protected:float=0; assignment:float=0
              protection_valid:bool=False; protection_active:bool=False; normal_admitted:bool=False
              recovery_bypass:bool=False; session_id:str=''; destination:str=''; change_reason:str=''
              old_protected:float=0; new_protected:float=0; evidence_complete:bool=True
          def one(es,k):
              xs=[e for e in es if e.kind==k]; assert len(xs)==1,(k,len(xs)); return xs[0]
          def complete(es):
              assert all(e.evidence_complete for e in es); assert not any(e.kind=='CAP_AUDIT_DROPPED' for e in es)
          def s21(es):
              complete(es); b=one(es,'CAP_GATE_BLOCKED'); assert one(es,'CAP_AUDIT_READY').target==700
              assert b.target==700 and b.trigger=='bytes' and b.trigger_ok and b.current_bytes>=b.threshold_bytes>=2*MiB
              assert b.delivery<b.target and not b.ready and not b.normal_admitted and not b.recovery_bypass
              assert b.session_id and b.destination; assert not any(e.kind in ('CAP_GATE_OPENED','CAP_PROTECTION_ARMED') for e in es)
          def s22(es):
              complete(es); o=one(es,'CAP_GATE_OPENED'); a=one(es,'CAP_PROTECTION_ARMED')
              assert o.target==70 and o.trigger_ok and o.ready and o.normal_admitted and not o.recovery_bypass
              assert o.session_id and o.destination and a.session_id==o.session_id and a.destination==o.destination
              assert a.protection_valid and a.protection_active and a.protected>a.target and a.normal_admitted
          def s23(es):
              complete(es); a=one(es,'CAP_PROTECTION_ARMED'); assert a.target==70 and a.protected>=89
              ws=[e for e in es if e.kind=='CAP_WINDOW' and e.protection_active]; assert ws
              for w in ws: assert w.protected>=89 and w.assignment>=w.protected-2
          def s24(es):
              complete(es); cs=[e for e in es if e.kind=='CAP_PROTECTION_CHANGED' and e.new_protected<e.old_protected]; assert cs
              c=cs[-1]; assert c.change_reason=='physical_delivery_degradation' and c.assignment>=c.old_protected-2
              lows=[w for w in es if w.kind=='CAP_WINDOW' and w.protection_active and w.assignment>=c.old_protected-2 and w.delivery<.9*c.old_protected]
              assert len(lows)>=3
          def recovery(es):
              complete(es); o=one(es,'CAP_GATE_OPENED'); assert o.recovery_bypass and not o.normal_admitted
              assert not any(e.kind=='CAP_PROTECTION_ARMED' for e in es)
          R700=E('CAP_AUDIT_READY',700)
          B700=E('CAP_GATE_BLOCKED',700,550,False,'bytes',True,581745969,2*MiB,session_id='a4bd1539',destination='speedtest.hnd.fdcservers.net:8080')
          R70=E('CAP_AUDIT_READY',70)
          O70=E('CAP_GATE_OPENED',70,90,True,'bytes',True,4*MiB,2*MiB,normal_admitted=True,session_id='11223344',destination='download.example:443')
          A90=E('CAP_PROTECTION_ARMED',70,90,True,'bytes',True,4*MiB,2*MiB,90,90,True,True,True,False,'11223344','download.example:443')
          W=[E('CAP_WINDOW',70,d,True,protected=90,assignment=90,protection_valid=True,protection_active=True,normal_admitted=True) for d in (90,89,91)]
          DW=[E('CAP_WINDOW',70,60,False,protected=90,assignment=90,protection_valid=True,protection_active=True,normal_admitted=True) for _ in range(3)]
          C60=E('CAP_PROTECTION_CHANGED',70,60,False,protected=60,assignment=90,protection_valid=True,protection_active=True,normal_admitted=True,change_reason='physical_delivery_degradation',old_protected=90,new_protected=60)
          RB=E('CAP_GATE_OPENED',70,0,True,'bytes',True,3*MiB,2*MiB,recovery_bypass=True,normal_admitted=False,session_id='55667788',destination='recovery.example:443')
          formal=[('S2-1 700 below target',[R700,B700],s21),('S2-2 open/arm',[R70,O70,A90],s22),('S2-3 additive P',[R70,O70,A90,*W],s23),('S2-4 real degradation',[R70,O70,A90,*DW,C60],s24),('recovery bypass',[R70,RB],recovery)]
          mutants=[
            ('missing-blocked',[R700],s21),('no-trigger-proof',[R700,replace(B700,trigger_ok=False)],s21),
            ('no-session-correlation',[R700,replace(B700,session_id='')],s21),('recovery-as-normal',[R70,replace(RB,normal_admitted=True)],recovery),
            ('T-as-protected-P',[R70,O70,replace(A90,protected=70)],s22),('P-underassigned',[R70,O70,A90,*W[:-1],replace(W[-1],assignment=70)],s23),
            ('underassignment-ratifies-degrade',[R70,O70,A90,*DW,replace(C60,assignment=60)],s24),
            ('silent-loss',[R700,B700,E('CAP_AUDIT_DROPPED',700,evidence_complete=False)],s21),
          ]
          for batch in range(10):
              for n,es,f in formal: f(es)
              for n,es,f in mutants:
                  try: f(es)
                  except AssertionError: pass
                  else: raise SystemExit('FAIL mutation survived: '+n)
          print('PASS 10 independent Server FIELD Audit Closure v1 batches')
          print('PASS 8/8 incomplete/wrong evidence architectures killed in every batch')
          PY
          python3 "${RUNNER_TEMP}/server-audit-v1-independent.py"

