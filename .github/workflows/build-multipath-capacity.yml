            'protocol/multipath/auditv3/journal.go':'f7a3a0abbed1aa85e1ac3a60644a340391d965fb1a5236bd4ad2875c79de2ce4',
            'protocol/multipath/auditv3/journal_test.go':'c3bd2eb7f38698b3877b10e771dc3a3f6ad02e43e194c8153abfd256d9d23225',
            'protocol/multipath/auditv3/metrics.go':'63e695ad1c94a8a5bdab955e5fadea8b89d388139185accf07c8487808e0ddea',
            'protocol/multipath/auditv3/report.go':'645674490bca673df200fa314ba1239ade6b27f03111d4b84eea0c679d63b5c6',
            'protocol/multipath/auditv3/schema.go':'6b4e8f267490ac02f02793fe2af18ae59fc314d7e3032c0c713fa96f0edf8554',
            'protocol/multipath/auditv3/simulation_test.go':'0c7807b0978ac0daacd4a6eb7d98af6327a0b2475b791882ab6acdfc0d42019d',
            'protocol/multipath/auditv3/status_parser.go':'fbb10846686dd86af7638c36590e67d51835d122ba3634b2c4ab093b51909d18',
            'protocol/multipath/auditv3/status_parser_test.go':'92ad0f285ea40a1e6863483d8583ec22f3a810a83ff03eded1fd59704a434f81',
            'protocol/multipath/auditv3/test_helpers_test.go':'49b106d6a8c18f22f7771bce5ce55fb55d796996656b2b8d39adb1c9ab25dd7e',
            'protocol/multipath/auditv3/timeline.go':'79b3326901b96eeb00660fa167c6cbc7b9e2d2b57b82dcd993b59a60b1318f7f',
            'protocol/multipath/auditv3/timeline_test.go':'eb014053189b282e1fd3c4c4b17e70fae8c279832786822264d0cae9bcee3e32',
          }
          for rel,want in expected.items():
              got=hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              if got != want:
                  raise SystemExit(f'FAIL identity {rel}: {got} != {want}')
              print('PASS',rel,got)
          PY

      - name: Set audited build inputs
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TAGS="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_OTHERS)"
          LDFLAGS_SHARED="$(tr -d '\r\n' < release/LDFLAGS)"
          test -n "$BUILD_TAGS"
          echo "BUILD_TAGS=$BUILD_TAGS" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$LDFLAGS_SHARED" >> "$GITHUB_ENV"

      - name: Materialize immutable Golden and evidence directories
        shell: bash
        run: |
          set -euo pipefail
          GOLDEN_DIR="${RUNNER_TEMP}/frozen-golden"
          V2_DIR="${RUNNER_TEMP}/server-audit-v2-baseline"
          INDEPENDENT_DIR="${RUNNER_TEMP}/independent-repair"
          MUTANT_ROOT="${RUNNER_TEMP}/repair-mutants"
          EVIDENCE_DIR="${RUNNER_TEMP}/server-audit-v3-evidence"
          git worktree prune || true
          rm -rf "$GOLDEN_DIR" "$V2_DIR" "$INDEPENDENT_DIR" "$MUTANT_ROOT" "$EVIDENCE_DIR"
          mkdir -p "$MUTANT_ROOT" "$EVIDENCE_DIR"
          git worktree add --detach "$GOLDEN_DIR" "$FROZEN_GOLDEN_SHA"
          git worktree add --detach "$V2_DIR" "${{ steps.resolve.outputs.v2_baseline_sha }}"
          echo "GOLDEN_DIR=$GOLDEN_DIR" >> "$GITHUB_ENV"
          echo "V2_DIR=$V2_DIR" >> "$GITHUB_ENV"
          echo "PARENT_DIR=$GOLDEN_DIR" >> "$GITHUB_ENV"
          echo "INDEPENDENT_DIR=$INDEPENDENT_DIR" >> "$GITHUB_ENV"
          echo "MUTANT_ROOT=$MUTANT_ROOT" >> "$GITHUB_ENV"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"

      - name: Complete-tree and architecture boundary audit
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY' | tee "${EVIDENCE_DIR}/architecture-audit.log"
          from pathlib import Path
          import hashlib, os, re, subprocess
          ROOT=Path(os.environ['GITHUB_WORKSPACE'])
          GOLDEN=Path(os.environ['GOLDEN_DIR'])
          V2=Path(os.environ['V2_DIR'])
          MOD={
            'protocol/multipath/budget_stream.go','protocol/multipath/capacity.go','protocol/multipath/core.go',
            'protocol/multipath/inbound.go','protocol/multipath/memory.go','protocol/multipath/memory_available_linux.go',
            'protocol/multipath/outbound.go','protocol/multipath/scheduler.go','protocol/multipath/stream/path.go',
            'protocol/multipath/stream/send.go','protocol/multipath/transport.go','protocol/multipath/types.go'}
          ADD={
            'protocol/multipath/f01_memory_test.go','protocol/multipath/f01_retention_contract_test.go',
            'protocol/multipath/f01_staged_ack_test.go','protocol/multipath/memory_available_linux_test.go',
            'protocol/multipath/memory_runtime.go','protocol/multipath/memory_runtime_test.go',
