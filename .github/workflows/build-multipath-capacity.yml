      - name: Materialize independent repair regression outside candidate source
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$INDEPENDENT_DIR" "${{ steps.resolve.outputs.candidate_sha }}"
          cat > "$INDEPENDENT_DIR/protocol/multipath/zz_memory_repair_independent_test.go" <<'GOEOF'
          package multipath

          import "testing"

          // Independent from candidate tests: this reproduces the exact accounting
          // shape that made rejected B accumulate detached credit across rounds.
          func TestRepairIndependentRepeatedRoundCredit(t *testing.T) {
            b := newMemoryBudget(512<<10, false)
            const charge = 1536
            for round := 0; round < 6; round++ {
              buffers := make([][]byte, 0, 64)
              for i := 0; i < 64; i++ {
                buffer, wait := b.tryAcquirePrimary(charge)
                if buffer == nil || wait != nil {
                  t.Fatalf("round=%d allocation=%d denied used=%d", round, i, b.snapshot().UsedBytes)
                }
                buffers = append(buffers, buffer)
              }
              for _, buffer := range buffers {
                b.release(buffer)
              }
              snapshot := b.snapshot()
              if !b.boosterAllowed() {
                t.Fatalf("round=%d booster disabled after releases: used=%d high=%d", round, snapshot.UsedBytes, snapshot.BoosterLimitBytes)
              }
              if snapshot.UsedBytes > b.cacheLimit {
                t.Fatalf("round=%d released credit accumulated: used=%d cache_limit=%d", round, snapshot.UsedBytes, b.cacheLimit)
              }
            }
          }
          GOEOF
          gofmt -w "$INDEPENDENT_DIR/protocol/multipath/zz_memory_repair_independent_test.go"
          (
            cd "$INDEPENDENT_DIR"
            CGO_ENABLED=1 go test -race -count=20 -timeout=10m -tags "$BUILD_TAGS" \
              -run '^TestRepairIndependentRepeatedRoundCredit$' ./protocol/multipath
          ) | tee "${EVIDENCE_DIR}/independent-repeated-round-credit.log"

