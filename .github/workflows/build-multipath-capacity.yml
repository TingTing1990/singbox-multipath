name: Build Multipath Capacity Server Audit V3

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Repaired source branch/tag/commit to audit and build
        required: true
        default: feature/multipath-capacity-v2-beta6
        type: string

permissions:
  contents: read

concurrency:
  group: multipath-server-audit-v3-${{ inputs.source_ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.5'
  VERSION: '1.14.0-multipath-beta6'
  FROZEN_GOLDEN_SHA: 'e4245b3e7c79b1b90f2b36ddec36e8af2e63c2a6'
  FROZEN_GOLDEN_TREE: '9dc79da54ffa4604c4649050915c7c5edc9d04f0'
  B9_UPSTREAM_COMMIT: '9721ae7e3dd4da02a2baf9bb4461316e0aeeaf7d'

jobs:
  audit_test:
    name: Frozen delta + A provenance + B9 guard + impacted regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      parent_sha: ${{ steps.resolve.outputs.parent_sha }}
      v2_baseline_sha: ${{ steps.resolve.outputs.v2_baseline_sha }}

    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup exact Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve exact candidate against immutable Golden
        id: resolve
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REF"
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          grep -Fx "go ${GO_VERSION}" go.mod
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse "${FROZEN_GOLDEN_SHA}^{tree}")" = "$FROZEN_GOLDEN_TREE"
          test "$(git merge-base "$CANDIDATE_SHA" "$FROZEN_GOLDEN_SHA")" = "$FROZEN_GOLDEN_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          V2_BASELINE_SHA="$(python3 - "$CANDIDATE_SHA" "$FROZEN_GOLDEN_SHA" <<'PY'
          import hashlib, subprocess, sys
          candidate,golden=sys.argv[1:]
          modified={
            'protocol/multipath/budget_stream.go','protocol/multipath/capacity.go','protocol/multipath/core.go',
            'protocol/multipath/inbound.go','protocol/multipath/memory.go','protocol/multipath/memory_available_linux.go',
            'protocol/multipath/outbound.go','protocol/multipath/scheduler.go','protocol/multipath/stream/path.go',
            'protocol/multipath/stream/send.go','protocol/multipath/transport.go','protocol/multipath/types.go'}
          added={
            'protocol/multipath/f01_memory_test.go','protocol/multipath/f01_retention_contract_test.go',
            'protocol/multipath/f01_staged_ack_test.go','protocol/multipath/memory_available_linux_test.go',
            'protocol/multipath/memory_runtime.go','protocol/multipath/memory_runtime_test.go',
            'protocol/multipath/stream/records.go','protocol/multipath/stream/records_test.go',
            'protocol/multipath/audit/analyzer.go','protocol/multipath/audit/audit_test.go',
            'protocol/multipath/audit/coverage.go','protocol/multipath/audit/event.go',
            'protocol/multipath/audit/event_type.go','protocol/multipath/audit/parser.go','protocol/multipath/audit/schema.go'}
          expected={*(f'M\t{x}' for x in modified),*(f'A\t{x}' for x in added)}
          identities={
            'protocol/multipath/scheduler.go':'0915d96d0a8a79f5815581513329e8c866bb9344ec1d25f570d12365518f30ca',
            'protocol/multipath/core.go':'50577e0b8a883aeaf9321798fe0971ec19609a19e0f38ba9c5e8a253839f8e18',
            'protocol/multipath/audit/analyzer.go':'dcda89bfc030f9c135e1851b24e54853b8aa88006b57e1ec56712f6d9e86e4c4',
            'protocol/multipath/audit/audit_test.go':'64cfd5d182028abef1669221906486ac1c0607d32c01cacc25cf1eb95628906b',
            'protocol/multipath/audit/coverage.go':'d3385555fc774701cd0adecca0b8a5738a0d3487c172dc187053adf97ef2d1bf',
            'protocol/multipath/audit/event.go':'7953044aa94246846fce722e8a3b03e97897fbdc1e106d1b46dfeae4f21be4d5',
            'protocol/multipath/audit/event_type.go':'44c81e47484ebe7fc39e3b5a74b3de745554b41c6e57645e06e41f0aaa26dc35',
            'protocol/multipath/audit/parser.go':'85a55ea31c5b9902150a2d9bffc0c688669da3ca1870b34248f79ba75bc34037',
            'protocol/multipath/audit/schema.go':'70d88d2cbad80ab00a2c353f5bf36509baa508999bbe6a2c3397b1fbf0c387ff'}
          for rev in subprocess.check_output(['git','rev-list',candidate],text=True).splitlines():
              lines=set(x for x in subprocess.check_output(['git','diff','--name-status',golden,rev],text=True).splitlines() if x)
              if lines != expected: continue
              ok=True
              for rel,want in identities.items():
                  try: payload=subprocess.check_output(['git','show',f'{rev}:{rel}'])
                  except subprocess.CalledProcessError: ok=False; break
                  if hashlib.sha256(payload).hexdigest()!=want: ok=False; break
              if ok:
                  print(rev)
                  sys.exit(0)
          raise SystemExit('FAIL: no exact Server Audit V2 ancestor matches frozen Golden delta and identities')
          PY
          )"
          test -n "$V2_BASELINE_SHA"
          test "$(git merge-base "$CANDIDATE_SHA" "$V2_BASELINE_SHA")" = "$V2_BASELINE_SHA"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "v2_baseline_sha=$V2_BASELINE_SHA" >> "$GITHUB_OUTPUT"
          echo "parent_sha=$FROZEN_GOLDEN_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$CANDIDATE_SHA"
          echo "v2_baseline_sha=$V2_BASELINE_SHA"
          echo "golden_sha=$FROZEN_GOLDEN_SHA"
          echo "golden_tree=$FROZEN_GOLDEN_TREE"
          echo "b9_upstream_commit=$B9_UPSTREAM_COMMIT"
          echo "go=$(go version)"

      - name: Verify exact repaired source identities
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          expected={
            'protocol/multipath/budget_stream.go':'129209b2029e94b4af8fa8f8860b4673310b33371c6d89523fbdceb02a3888be',
            'protocol/multipath/capacity.go':'b20e5703a8642a0e353f548b5f48a39d89a80c3aa2d9f626c18ace32d880b1dd',
