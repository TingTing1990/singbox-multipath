            'protocol/multipath/audit/coverage.go','protocol/multipath/audit/event.go',
            'protocol/multipath/audit/event_type.go','protocol/multipath/audit/parser.go',
            'protocol/multipath/audit/schema.go',
            'cmd/multipath-audit-v3/main.go',
            'protocol/multipath/auditv3/capture.go',
            'protocol/multipath/auditv3/compare.go',
            'protocol/multipath/auditv3/diagnosis.go',
            'protocol/multipath/auditv3/doc.go',
            'protocol/multipath/auditv3/journal.go',
            'protocol/multipath/auditv3/journal_test.go',
            'protocol/multipath/auditv3/metrics.go',
            'protocol/multipath/auditv3/report.go',
