name: Build Multipath Memory v1 beta6

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multipath-memory-v1-feature-multipath-capacity-v2-beta6
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.5'
  VERSION: '1.14.0-multipath-beta6'
  SOURCE_BRANCH: 'feature/multipath-capacity-v2-beta6'

jobs:
  audit_test:
    name: Full-source audit x10 + independent memory x10 + runtime regression
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      baseline_sha: ${{ steps.resolve.outputs.baseline_sha }}

    steps:
      - name: Checkout frozen source branch
        uses: actions/checkout@v7
        with:
          ref: feature/multipath-capacity-v2-beta6
          fetch-depth: 0
          persist-credentials: false

      - name: Setup exact Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: Resolve current candidate and exact same-branch pre-Memory baseline
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          grep -Fx "go ${GO_VERSION}" go.mod

          git fetch --no-tags origin "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          CANDIDATE_SHA="$(git rev-parse HEAD^{commit})"
          REMOTE_SHA="$(git rev-parse refs/remotes/origin/${SOURCE_BRANCH}^{commit})"
          test "$CANDIDATE_SHA" = "$REMOTE_SHA"
          export CANDIDATE_SHA

          BASELINE_SHA="$(python3 <<'PY'
          import hashlib, os, subprocess, sys
          candidate=os.environ['CANDIDATE_SHA']
          baseline={
            'README.md':'ea9471baaa6025e2c07d54dedb541059fb9315191ff1503dbe2697c8c50176a5',
            'protocol/multipath/budget_stream.go':'a3892a9ac0c28141bbbec3d2c4f0a33d98204ce01d9273ab46a0fcf6aa9978ff',
            'protocol/multipath/capacity.go':'b4744381030ffaaf96c050af9476d8188cd4492d4f052aaedd5ba01cc85d8588',
            'protocol/multipath/capacity_test.go':'ea413b00e1915aa343572ba8b4e4ee15b282e5f27a94d031dffad3c4ac3ec377',
            'protocol/multipath/core.go':'3b95c82cc7fc02a9e3a34a90434ce7753b9e6c32bba519ad1087ab5919c8e83a',
            'protocol/multipath/memory.go':'551104aca8359ab801fd552fdecf434d02e8c1f8c1d0fc34b3d3dd836b7bc051',
            'protocol/multipath/memory_test.go':'adbb0c4cbe0c0aa117d7e70ce514c783520fe1c63d416c0b06f3f5691d3d3c2a',
            'protocol/multipath/scheduler.go':'281efb9034875feae7becc325f09ae63e809fcd2ebbe24ed3a7173fbc3ea4391',
            'protocol/multipath/stream/path.go':'af7178b22fcdf6e63c4d307f8bec24e57cbf2fa05b9da6ee6d2e6538b70f5903',
            'protocol/multipath/stream/receive.go':'16f9b9e4141f984871d60bca5db88c8d2d3c8b714192a20482dc618287509c75',
            'protocol/multipath/stream/send.go':'04367962de2e1053a4f4459e1b94b30bf61efd53e17f20d5fef0090b931bbcd6',
            'protocol/multipath/stream/stream_test.go':'5f6b2fca180b9fc809b51567a6a6ec305c850b6f90046001f31e753224c4975e',
          }
          expected={f'M\t{p}' for p in baseline}
          def blob(rev,path):
              try:
                  return subprocess.check_output(['git','show',f'{rev}:{path}'],stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  return None
          revs=subprocess.check_output(['git','rev-list','--topo-order',candidate],text=True).splitlines()
          for rev in revs[1:]:
              ok=True
              for path,want in baseline.items():
                  data=blob(rev,path)
                  if data is None or hashlib.sha256(data).hexdigest()!=want:
                      ok=False; break
              if not ok:
                  continue
              lines=set(x for x in subprocess.check_output(['git','diff','--name-status',rev,candidate],text=True).splitlines() if x)
              if lines==expected:
                  print(rev)
                  sys.exit(0)
          raise SystemExit('FAIL: no same-branch ancestor matches the frozen pre-Memory Server-Audit-v1 baseline and exact 12-file write-set')
          PY
          )"
          test -n "$BASELINE_SHA"
          test "$(git merge-base "$CANDIDATE_SHA" "$BASELINE_SHA")" = "$BASELINE_SHA"

          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "baseline_sha=$BASELINE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_branch=$SOURCE_BRANCH"
          echo "candidate=$CANDIDATE_SHA"
          echo "baseline=$BASELINE_SHA"
          echo "baseline_resolution=same-branch-nearest-ancestor-by-frozen-file-hashes-and-exact-write-set"
          echo "go=$(go version)"

      - name: Verify exact corrected Memory-v1 candidate file identities
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          expected={
            'README.md':'adf349caeb8d66141eeaea071e10cb43f06b7fe4b6f841a9e39a90aa8327d254',
            'protocol/multipath/budget_stream.go':'ced4439d2c59e02342c6b363b43ae1fd3e478fc411e6859b73f53713b2ef1e0e',
            'protocol/multipath/capacity.go':'7db160620618714cab86107bf7cfd3b30e91791b5e8fa1593117017c78858c02',
            'protocol/multipath/capacity_test.go':'77771f4ba211dd193da82a47ef8b051e0b7255660242c6b7e408e37f8d219c9d',
            'protocol/multipath/core.go':'7c1954b34a8a8169c0e0a3de1eecff704ddeeb766b0c1ed3c879d8e3f0526c04',
            'protocol/multipath/memory.go':'ae6b042491830b0b771675a6918f8adbd5e56a2eaa917f2c46e05a3a65001fb0',
            'protocol/multipath/memory_test.go':'31273d264c6eee28b54eedd96b61e513c8bfa3eff0957b6f24edd4a946e09b67',
            'protocol/multipath/scheduler.go':'41bfafbb745466107b3d6bbd594c52575881c5c3382f7889633f9e8d36a1169e',
            'protocol/multipath/stream/path.go':'c1a7d58f03424ad99c0464f6ada7a85b751339cdb7e06c061f7a07223222a2ac',
            'protocol/multipath/stream/receive.go':'4f1b2e12df35b249c8061d4e74aebbcc142c99ad7915c765c982c9fd0da6e10e',
            'protocol/multipath/stream/send.go':'4756aef7c207573e72f0b4a76b0f93e5af76b5ae964b631dc86cd83aa08b48ea',
            'protocol/multipath/stream/stream_test.go':'ffdf4431e26e9400a8e630e3422f982981a8681f3cb857b55bc9cc0cdd31a772',
          }
          for path,want in expected.items():
              got=hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if got!=want: raise SystemExit(f'FAIL candidate identity {path}: got={got} want={want}')
              print('PASS',path,got)
          print('PASS exact corrected 12-file Memory-v1 candidate identity')
          PY

      - name: Set audited build inputs
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TAGS="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_OTHERS)"
          LDFLAGS_SHARED="$(tr -d '\r\n' < release/LDFLAGS)"
          test -n "$BUILD_TAGS"
          echo "BUILD_TAGS=$BUILD_TAGS" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$LDFLAGS_SHARED" >> "$GITHUB_ENV"

      - name: Materialize exact same-branch pre-Memory baseline
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_DIR="${RUNNER_TEMP}/multipath-memory-baseline"
          rm -rf "$BASELINE_DIR"
          git worktree add --detach "$BASELINE_DIR" "${{ steps.resolve.outputs.baseline_sha }}"
          echo "BASELINE_DIR=$BASELINE_DIR" >> "$GITHUB_ENV"

      - name: Full-source corrected Memory-v1 reverse audit x10
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/memory-v1-full-audit.py" <<'PY'
          from pathlib import Path
          import hashlib, os, re, subprocess, sys
          ROOT=Path(os.environ['GITHUB_WORKSPACE']); BASE=Path(os.environ['BASELINE_DIR'])
          EXPECTED={
            'README.md','protocol/multipath/budget_stream.go','protocol/multipath/capacity.go','protocol/multipath/capacity_test.go',
            'protocol/multipath/core.go','protocol/multipath/memory.go','protocol/multipath/memory_test.go','protocol/multipath/scheduler.go',
            'protocol/multipath/stream/path.go','protocol/multipath/stream/receive.go','protocol/multipath/stream/send.go','protocol/multipath/stream/stream_test.go'}
          FROZEN={
            'protocol/multipath/wire.go','protocol/multipath/telemetry.go','protocol/multipath/activation.go','protocol/multipath/inbound.go',
            'protocol/multipath/outbound.go','protocol/multipath/types.go','protocol/multipath/protocol.go','protocol/multipath/server_audit_test.go',
            'constant/proxy.go','option/mieru.go','protocol/mieru/outbound.go','include/registry.go','go.mod','go.sum'}
          class Fail(Exception): pass
          def tracked(root):
              raw=subprocess.check_output(['git','-C',str(root),'ls-files','-s','-z']); out=[]
              for rec in raw.split(b'\0'):
                  if not rec: continue
                  meta,path=rec.split(b'\t',1); mode,oid,stage=meta.split()
                  if stage!=b'0': raise Fail('unmerged '+os.fsdecode(path))
                  out.append((os.fsdecode(path),mode.decode(),oid.decode()))
              return sorted(out)
          def payload(root,rel,mode,oid):
              p=root/rel
              if mode=='160000': return b'gitlink:'+oid.encode()
              if mode=='120000': return os.readlink(p).encode('utf-8','surrogateescape')
              return p.read_bytes()
          def fmap(root): return {r:hashlib.sha256(payload(root,r,m,o)).hexdigest() for r,m,o in tracked(root)}
          def tree(root):
              h=hashlib.sha256(); n=0; total=0
              for rel,mode,oid in tracked(root):
                  b=payload(root,rel,mode,oid); n+=1
                  if mode!='160000': total+=len(b)
                  for v in (rel.encode(),mode.encode(),b): h.update(len(v).to_bytes(8,'big')); h.update(v)
              return n,total,h.hexdigest()
          def txt(root,rel): return (root/rel).read_text(encoding='utf-8')
          def funcs(src):
              out={}; pat=re.compile(r'(?m)^func\s+(?:\([^\n]+?\)\s+)?([A-Za-z0-9_]+)\s*\(')
              for m in pat.finditer(src):
                  name=m.group(1); start=m.start(); le=src.find('\n',start); brace=src.rfind('{',start,le)
                  if brace<0: continue
                  d=0; q=None; esc=False
                  for i in range(brace,len(src)):
                      c=src[i]
                      if q:
                          if esc: esc=False
                          elif c=='\\': esc=True
                          elif c==q: q=None
                      else:
                          if c in ('"','`'): q=c
                          elif c=='{': d+=1
                          elif c=='}':
                              d-=1
                              if d==0: out.setdefault(name,[]).append(src[start:i+1]); break
              return out
          def one(root,rel,name):
              x=funcs(txt(root,rel)).get(name,[])
              if len(x)!=1: raise Fail(f'{rel}:{name} count={len(x)}')
              return x[0]
          def same_except(rel,exc):
              a=funcs(txt(BASE,rel)); b=funcs(txt(ROOT,rel))
              for n in set(a)|set(b):
                  if n not in exc and a.get(n)!=b.get(n): raise Fail(f'unexpected function drift {rel}:{n}')
          def req(v,msg):
              if not v: raise Fail(msg)
          def check():
              A=fmap(BASE); B=fmap(ROOT); mod={p for p in set(A)&set(B) if A[p]!=B[p]}; add=set(B)-set(A); rem=set(A)-set(B)
              req(mod==EXPECTED and not add and not rem,f'write-set mod={sorted(mod)} add={sorted(add)} rem={sorted(rem)}')
              for rel in FROZEN: req((ROOT/rel).read_bytes()==(BASE/rel).read_bytes(),'frozen drift '+rel)
              req('go 1.25.5' in txt(ROOT,'go.mod'),'Go version drift')
              same_except('protocol/multipath/core.go',{'Release'})
              same_except('protocol/multipath/scheduler.go',{'handleWindow'})
              same_except('protocol/multipath/capacity.go',{'recordPreferredCapacityRange','confirmPreferredCapacityDelivery'})
              same_except('protocol/multipath/stream/send.go',{'Acknowledge'})
              same_except('protocol/multipath/stream/path.go',{'Feedback'})
              same_except('protocol/multipath/stream/receive.go',{'Insert','Consume','Close','pruneTail','pruneTailForHead','resetReceivePage','takeReusablePage','recyclePage'})
              req('c.memory.releasePage(stream.PageCharge)' in one(ROOT,'protocol/multipath/core.go','Release'),'RX page retirement missing')
              cap=txt(ROOT,'protocol/multipath/capacity.go'); req('last.end == start' in cap and 'retainedPreferredCapacityRangeCapacity' in cap,'capacity metadata bound/coalesce missing')
              mem=txt(ROOT,'protocol/multipath/memory.go')
              rel=one(ROOT,'protocol/multipath/memory.go','release'); relpage=one(ROOT,'protocol/multipath/memory.go','releasePage')
              acquire=one(ROOT,'protocol/multipath/memory.go','tryAcquirePrimary'); reserve=one(ROOT,'protocol/multipath/budget_stream.go','reservePage')
              scav=one(ROOT,'protocol/multipath/memory.go','scavengePending'); queue=one(ROOT,'protocol/multipath/memory.go','queueScavengeLocked')
              req('b.used -=' not in rel,'DATA release mints credit early')
              req('b.pendingReclaim += bytes' in relpage and 'b.used -=' not in relpage,'RX release mints credit early')
              req('memoryScavenge()' not in acquire and 'scavengePending(' not in acquire and 'queueScavengeLocked()' in acquire,'TX data-plane performs inline scavenge')
              req('memoryScavenge()' not in reserve and 'scavengePending(' not in reserve and 'queueScavengeLocked()' in reserve,'PageMemory admission performs inline scavenge')
              req('go b.scavengePending(false)' in queue,'data/page reclaim not asynchronous')
              pos=scav.find('memoryScavenge()'); unlock=scav.rfind('b.access.Unlock()',0,pos); relock=scav.find('b.access.Lock()',pos)
              req(pos>=0 and unlock>=0 and relock>=0 and unlock<pos<relock,'scavenge holds budget mutex')
              req('memoryScavengeAccess.Lock()' in scav and 'memoryScavengeAccess.Unlock()' in scav,'process scavenges not serialized')
              for tok in ('memoryIdleTrimDelay          = 2 * time.Second','pendingReclaim','scavengeQueued','garbageHintBytes'): req(tok in mem,'memory invariant missing '+tok)
              recv=txt(ROOT,'protocol/multipath/stream/receive.go'); req('Acquire must\n// not wait' in recv,'PageMemory non-blocking contract drift')
              for tok in ('receivePageReuseLimit = 8','takeReusablePage','recyclePage','pruneTailForHead'): req(tok in recv,'RX reuse missing '+tok)
              callsites=[]
              for p in (ROOT/'protocol/multipath').rglob('*.go'):
                  if p.name.endswith('_test.go'): continue
                  for i,line in enumerate(p.read_text().splitlines(),1):
                      if '.scavengePending(' in line and 'func ' not in line: callsites.append((p.relative_to(ROOT).as_posix(),i,line.strip()))
              allowed={('protocol/multipath/memory.go','go b.scavengePending(false)'),('protocol/multipath/memory.go','b.scavengePending(false)'),('protocol/multipath/memory.go','b.scavengePending(includeHint)')}
              req(all((p,l) in allowed for p,_,l in callsites),f'unexpected scavenge callsites {callsites}')
              rs=[]
              for p in (ROOT/'protocol/multipath').rglob('*.go'):
                  if p.name.endswith('_test.go'): continue
                  for i,line in enumerate(p.read_text().splitlines(),1):
                      if '.reserveSession(' in line: rs.append((p.relative_to(ROOT).as_posix(),i,line.strip()))
              req(len(rs)==1 and rs[0][0]=='protocol/multipath/core.go',f'reserveSession call drift {rs}')
              req('retainedMappingCapacity = 1024' in txt(ROOT,'protocol/multipath/scheduler.go'),'mapping bound missing')
              req('retainedSegmentCapacity = 1024' in txt(ROOT,'protocol/multipath/stream/send.go'),'segment bound missing')
              req('retainedFlightCapacity = 1024' in txt(ROOT,'protocol/multipath/stream/path.go'),'flight bound missing')
              tests='\n'.join(txt(ROOT,p) for p in ('protocol/multipath/memory_test.go','protocol/multipath/stream/stream_test.go','protocol/multipath/capacity_test.go'))
              for name in ('TestMemoryBudgetReleasedSlabKeepsPhysicalCreditAndIsReused','TestMemoryBudgetTurnoverDoesNotMintFreshPhysicalCredit','TestMemoryBudgetScavengeRunsOutsideBudgetLockAndKeepsCredit','TestMemoryBudgetScavengeSerializesAcrossInstances','TestMemoryBudgetReleasedPageKeepsPhysicalCreditUntilScavenge','TestMemoryBudgetPendingPageCreditScavengedBeforeFreshPageAdmission','TestMemoryBudgetIdleTrimScavengesExcessCommittedCache','TestMemoryBudgetIdleScavengeCoversNonSlabGarbage','TestMemoryBudgetReservePageNeverScavengesInline','TestMemoryBudgetAcquireDoesNotSpinDuringScavenge','TestMemoryBudgetQueuedScavengeIsSingleFlightPerBudget','TestReceiverReusesConsumedPagesWithoutAllocationChurn','TestSenderDropsOversizedDrainedMetadata','TestPathDropsOversizedDrainedFlightMetadata','TestPreferredCapacityAdjacentDeliveryRangesCoalesce'):
                  req(name in tests,'missing regression '+name)
              return tree(ROOT),sorted(mod)
          rows=[]
          for i in range(1,11):
              try:
                  r,mod=check(); rows.append(r); print(f'PASS {i:02d} files={r[0]} bytes={r[1]} tracked_tree={r[2]} write_set={len(mod)}')
              except Exception as e:
                  print(f'FAIL {i:02d} {e}'); sys.exit(1)
          req(len(set(rows))==1,'tree changed across passes')
          print('PASS 10/10 corrected Memory-v1 full-source reverse audits')
          PY
          python3 "${RUNNER_TEMP}/memory-v1-full-audit.py"

      - name: Check formatting of approved Go write-set
        shell: bash
        run: |
          set -euo pipefail
          files=(
            protocol/multipath/memory.go protocol/multipath/budget_stream.go protocol/multipath/core.go
            protocol/multipath/stream/receive.go protocol/multipath/stream/send.go protocol/multipath/stream/path.go
            protocol/multipath/scheduler.go protocol/multipath/capacity.go protocol/multipath/memory_test.go
            protocol/multipath/stream/stream_test.go protocol/multipath/capacity_test.go
          )
          for f in "${files[@]}"; do diff -u <(gofmt "$f") "$f"; done

      - name: Independent TX/RX memory-safety oracle x10
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import random
          MiB=1<<20; LIMIT=256*MiB; CHUNK=64*1024+512; PAGE=16*1024+2*1024+256
          def old(unit,rate,sec,rng,threads):
              logical=0; garbage=0; active=[]; dt=.02
              for step in range(int(sec/dt)):
                  for _ in range(max(1,int(rate*dt/unit))):
                      if logical+unit<=LIMIT: logical+=unit; active.append((step+rng.randint(1,max(2,threads//2+1)),unit))
                  keep=[]
                  for due,size in active:
                      if due<=step: logical-=size; garbage+=size
                      else: keep.append((due,size))
                  active=keep
              return logical,garbage+sum(x[1] for x in active)
          def ntx(rate,sec,rng,threads):
              active=[]; reuse=[]; committed=peak=0; dt=.02
              for step in range(int(sec/dt)):
                  for _ in range(max(1,int(rate*dt/CHUNK))):
                      if reuse: reuse.pop(); active.append((step+rng.randint(1,max(2,threads//2+1)),CHUNK))
                      elif committed+CHUNK<=LIMIT: committed+=CHUNK; active.append((step+rng.randint(1,max(2,threads//2+1)),CHUNK))
                      else: break
                  keep=[]
                  for due,size in active:
                      if due<=step: reuse.append(size)
                      else: keep.append((due,size))
                  active=keep; peak=max(peak,committed)
              return committed,peak,len(reuse)
          def nrx(rate,sec,rng,threads):
              live=[]; committed=pending=peak=scav=0; dt=.02
              for step in range(int(sec/dt)):
                  for _ in range(max(1,int(rate*dt/PAGE))):
                      if committed+PAGE>LIMIT: committed-=pending; pending=0; scav+=1
                      if committed+PAGE>LIMIT: break
                      committed+=PAGE; live.append((step+rng.randint(1,max(2,threads//2+1)),PAGE))
                  keep=[]
                  for due,size in live:
                      if due<=step: pending+=size
                      else: keep.append((due,size))
                  live=keep; peak=max(peak,committed)
              return committed,peak,pending,scav
          for b in range(10):
              seed=0xC0FFEE+b*7919
              l1,o1=old(CHUNK,20*MiB,30,random.Random(seed),16); n1,p1,r1=ntx(20*MiB,30,random.Random(seed),16)
              lr,orr=old(PAGE,20*MiB,30,random.Random(seed+7),16); nr,pr,pend,sc=nrx(20*MiB,30,random.Random(seed+8),16)
              l2,o2=old(CHUNK,87_500_000,10,random.Random(seed+9),32); n2,p2,r2=ntx(87_500_000,10,random.Random(seed+99),32)
              assert l1<=LIMIT and o1>2*LIMIT and lr<=LIMIT and orr>2*LIMIT and l2<=LIMIT and o2>3*LIMIT
              assert n1<=LIMIT and p1<=LIMIT and r1>0 and nr<=LIMIT and pr<=LIMIT and pend<=nr and sc>0 and n2<=LIMIT and p2<=LIMIT and r2>0
              print(f'PASS {b+1:02d} oldTX160={o1/MiB:.1f}MiB oldRX160={orr/MiB:.1f}MiB oldTX700={o2/MiB:.1f}MiB')
          print('PASS 10/10 independent TX/RX physical-credit memory batches')
          PY

      - name: Stream runtime regression with race detector x10
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=10 -timeout=20m ./protocol/multipath/stream

      - name: Focused corrected Memory-v1 runtime regression with race detector x10
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=10 -timeout=30m -tags "$BUILD_TAGS" \
            -run '^(TestMemoryBudget.*|TestPreferredCapacityAdjacentDeliveryRangesCoalesce)$' \
            ./protocol/multipath

      - name: Full option + multipath + Mieru regression
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout=30m -skip '^TestPerformanceHealthyLinks$' -tags "$BUILD_TAGS" \
            ./option ./protocol/multipath ./protocol/mieru

      - name: Baseline vs corrected Memory-v1 healthy-link performance differential
        shell: bash
        run: |
          set -euo pipefail
          LOG_DIR="${RUNNER_TEMP}/memory-v1-perf"; mkdir -p "$LOG_DIR"
          run_perf() {
            local tree="$1" label="$2" run_id="$3" log="$LOG_DIR/${label}-${run_id}.log"
            (cd "$tree" && CGO_ENABLED=1 go test -race -count=1 -timeout=7m -v -tags "$BUILD_TAGS" -run '^TestPerformanceHealthyLinks$' ./protocol/multipath) 2>&1 | tee "$log"
          }
          run_perf "$BASELINE_DIR" baseline 1
          run_perf "$GITHUB_WORKSPACE" candidate 1
          run_perf "$BASELINE_DIR" baseline 2
          run_perf "$GITHUB_WORKSPACE" candidate 2
          python3 - "$LOG_DIR" <<'PY'
          from pathlib import Path
          import re,statistics,sys
          d=Path(sys.argv[1]); run_re=re.compile(r'^=== RUN\s+TestPerformanceHealthyLinks/(.+)$'); rate_re=re.compile(r'performance_test\.go:\d+: flows=\d+ .*?Mbps=([0-9]+(?:\.[0-9]+)?)')
          def parse(p):
              cur=None; out={}; text=p.read_text(errors='replace')
              for bad in ('memory budget exceeded','panic:','fatal error:','test timed out','DATA RACE'):
                  if bad in text: raise SystemExit(f'FAIL {p.name}: {bad}')
              for line in text.splitlines():
                  m=run_re.search(line)
                  if m: cur=m.group(1); continue
                  m=rate_re.search(line)
                  if m and cur: out[cur]=float(m.group(1))
              if not out: raise SystemExit('FAIL no performance cases in '+p.name)
              return out
          b=[parse(d/'baseline-1.log'),parse(d/'baseline-2.log')]; c=[parse(d/'candidate-1.log'),parse(d/'candidate-2.log')]
          if set(b[0])!=set(b[1]) or set(b[0])!=set(c[0]) or set(b[0])!=set(c[1]): raise SystemExit('FAIL performance case-set drift')
          failed=False
          for case in sorted(b[0]):
              bm=statistics.median([x[case] for x in b]); cm=statistics.median([x[case] for x in c]); ratio=cm/bm
              ok=ratio>=0.98; failed|=not ok; print(('PASS' if ok else 'FAIL'),case,f'baseline={bm:.2f} candidate={cm:.2f} ratio={ratio:.4f}')
          if failed: raise SystemExit('FAIL corrected Memory-v1 performance below 98% of pre-Memory baseline')
          print('PASS corrected Memory-v1 retains >=98% baseline healthy-link performance')
          PY

      - name: Cleanup baseline worktree
        if: always()
        shell: bash
        run: |
          git worktree remove --force "$BASELINE_DIR" >/dev/null 2>&1 || true

  build_targets:
    name: Build ${{ matrix.label }}
    needs: audit_test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            binary: sing-box-1.14.0-multipath-beta6-memory-v1-darwin-amd64
          - label: Windows amd64
            runner: windows-2025
            goos: windows
            goarch: amd64
            binary: sing-box-1.14.0-multipath-beta6-memory-v1-windows-amd64.exe
          - label: Linux amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            binary: sing-box-1.14.0-multipath-beta6-memory-v1-linux-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact audited candidate commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.audit_test.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup exact Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: Verify exact audited source and native runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.audit_test.outputs.candidate_sha }}"
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          test "$(go env GOHOSTARCH)" = "amd64"
          test "$(go env GOHOSTOS)" = "${{ matrix.goos }}"

      - name: Set build inputs
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TAGS="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_OTHERS)"
          LDFLAGS_SHARED="$(tr -d '\r\n' < release/LDFLAGS)"
          echo "BUILD_TAGS=$BUILD_TAGS" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$LDFLAGS_SHARED" >> "$GITHUB_ENV"

      - name: Native target regression tests (Linux/macOS)
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -timeout=25m -skip '^TestPerformanceHealthyLinks$' -tags "$BUILD_TAGS" ./option ./protocol/multipath ./protocol/mieru

      - name: Native target regression tests (Windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -timeout=25m -skip '^(TestPerformanceHealthyLinks|TestCoreSenderStatusAndRTTProbe)$' -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" ./option ./protocol/multipath ./protocol/mieru

      - name: Build standalone core
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -v -trimpath -tags "$BUILD_TAGS" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            -o "dist/${{ matrix.binary }}" ./cmd/sing-box

      - name: Smoke-test built binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.binary }}"
          [[ "${{ matrix.goos }}" == "windows" ]] || chmod +x "$BIN"
          test -s "$BIN"
          test "$("./$BIN" version -n | tr -d '\r\n')" = "$VERSION"
          OUT="$("./$BIN" version)"; printf '%s\n' "$OUT"
          grep -F "Environment: go${GO_VERSION} ${{ matrix.goos }}/${{ matrix.goarch }}" <<< "$OUT"
          grep -F 'CGO: disabled' <<< "$OUT"

      - name: Produce checksum and provenance
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.binary }}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then shasum -a 256 "$BIN" > "${BIN}.sha256"; else sha256sum "$BIN" > "${BIN}.sha256"; fi
          {
            echo "version=${VERSION}"
            echo "source_branch=${SOURCE_BRANCH}"
            echo "commit=${{ needs.audit_test.outputs.candidate_sha }}"
            echo "baseline_resolution=same-branch-nearest-ancestor"
            echo "baseline_commit=${{ needs.audit_test.outputs.baseline_sha }}"
            echo "go_version=$(go env GOVERSION)"
            echo "target=${{ matrix.goos }}/${{ matrix.goarch }}"
            echo "cgo=0"
            echo "build_tags=${BUILD_TAGS}"
            echo "binary=${{ matrix.binary }}"
          } > "${BIN}.buildinfo.txt"
          cat "${BIN}.sha256"; cat "${BIN}.buildinfo.txt"

      - name: Upload verified binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: |
            dist/${{ matrix.binary }}
            dist/${{ matrix.binary }}.sha256
            dist/${{ matrix.binary }}.buildinfo.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
