name: Build beta6 clients v2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: 1.14.0-multipath-beta6
  REVISION: 31970756db5fd37d9e4080734dfeed9ffd5ceefd
  GO_VERSION: 1.25.5
  GOTOOLCHAIN: local

  EXPECTED_MAC_TAGS: with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_naive_outbound,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0

  EXPECTED_WINDOWS_TAGS: with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_naive_outbound,with_purego,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0

  EXPECTED_LDFLAGS: -X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0
  CRONET_REVISION: 45832ab074849607406baa3e3a2c4660274602ed


jobs:

  # ============================================================
  # macOS Intel amd64
  # ============================================================

  macos-build:
    name: Build macOS Intel amd64
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Checkout beta6 source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: WuSiYu/singbox-multipath
          ref: 31970756db5fd37d9e4080734dfeed9ffd5ceefd
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source baseline
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_REVISION="$(git rev-parse HEAD)"
          ACTUAL_GO="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          ACTUAL_TAGS="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS)"
          ACTUAL_LDFLAGS="$(tr -d '\r\n' < release/LDFLAGS)"
          ACTUAL_CRONET="$(tr -d '\r\n' < .github/CRONET_GO_VERSION)"

          echo "Revision: ${ACTUAL_REVISION}"
          echo "Go:       ${ACTUAL_GO}"
          echo "Tags:     ${ACTUAL_TAGS}"
          echo "LDFLAGS:  ${ACTUAL_LDFLAGS}"
          echo "Cronet:   ${ACTUAL_CRONET}"

          test "${ACTUAL_REVISION}" = "${REVISION}"
          test "${ACTUAL_GO}" = "${GO_VERSION}"
          test "${ACTUAL_TAGS}" = "${EXPECTED_MAC_TAGS}"
          test "${ACTUAL_LDFLAGS}" = "${EXPECTED_LDFLAGS}"
          test "${ACTUAL_CRONET}" = "${CRONET_REVISION}"

          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.5'
          check-latest: false
          cache: false

      - name: Verify Go toolchain
        shell: bash
        run: |
          set -euo pipefail

          go version

          test "$(go env GOVERSION)" = "go1.25.5"
          test "$(go env GOHOSTOS)" = "darwin"
          test "$(go env GOHOSTARCH)" = "amd64"
          test "$(go env GOTOOLCHAIN)" = "local"

      - name: Verify Go modules
        shell: bash
        run: |
          set -euo pipefail

          go mod download
          go mod verify

          git diff --exit-code -- go.mod go.sum

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: amd64
        run: |
          set -euo pipefail

          BUILD_TAGS="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS)"
          LDFLAGS_SHARED="$(tr -d '\r\n' < release/LDFLAGS)"

          test "${BUILD_TAGS}" = "${EXPECTED_MAC_TAGS}"
          test "${LDFLAGS_SHARED}" = "${EXPECTED_LDFLAGS}"

          mkdir -p dist

          go build \
            -v \
            -trimpath \
            -o dist/sing-box \
            -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

          test -x dist/sing-box

      - name: Verify binary identity
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$(./dist/sing-box version)"
          printf '%s\n' "${OUTPUT}"

          grep -Fx "sing-box version ${VERSION}" <<<"${OUTPUT}"
          grep -Fx "Environment: go1.25.5 darwin/amd64" <<<"${OUTPUT}"
          grep -Fx "Tags: ${EXPECTED_MAC_TAGS}" <<<"${OUTPUT}"
          grep -Fx "Revision: ${REVISION}" <<<"${OUTPUT}"
          grep -Fx "CGO: enabled" <<<"${OUTPUT}"

          echo
          go version -m ./dist/sing-box

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          NAME="sing-box-${VERSION}-darwin-amd64"

          mkdir -p "dist/${NAME}"
          cp LICENSE "dist/${NAME}/LICENSE"
          cp dist/sing-box "dist/${NAME}/sing-box"

          tar \
            -C dist \
            -czf "dist/${NAME}.tar.gz" \
            "${NAME}"

          cd dist

          shasum -a 256 \
            "${NAME}/sing-box" \
            "${NAME}.tar.gz" \
            > "${NAME}.SHA256SUMS"

          cat "${NAME}.SHA256SUMS"

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: darwin-amd64
          path: |
            dist/sing-box-1.14.0-multipath-beta6-darwin-amd64.tar.gz
            dist/sing-box-1.14.0-multipath-beta6-darwin-amd64.SHA256SUMS
          if-no-files-found: error
          retention-days: 30


  # ============================================================
  # Windows amd64
  # ============================================================

  windows-build:
    name: Build Windows amd64
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout beta6 source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: WuSiYu/singbox-multipath
          ref: 31970756db5fd37d9e4080734dfeed9ffd5ceefd
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $revision = (git rev-parse HEAD).Trim()

          $goVersion = (
            Get-Content go.mod |
            Where-Object { $_ -match '^go\s+' } |
            Select-Object -First 1
          ).Split()[1]

          $tags = (
            Get-Content release/DEFAULT_BUILD_TAGS_WINDOWS -Raw
          ).Trim()

          $ldflags = (
            Get-Content release/LDFLAGS -Raw
          ).Trim()

          $cronet = (
            Get-Content .github/CRONET_GO_VERSION -Raw
          ).Trim()

          Write-Host "Revision: $revision"
          Write-Host "Go:       $goVersion"
          Write-Host "Tags:     $tags"
          Write-Host "LDFLAGS:  $ldflags"
          Write-Host "Cronet:   $cronet"

          if ($revision -ne $env:REVISION) {
            throw "Revision mismatch"
          }

          if ($goVersion -ne $env:GO_VERSION) {
            throw "Go baseline mismatch"
          }

          if ($tags -ne $env:EXPECTED_WINDOWS_TAGS) {
            throw "Windows build tags mismatch"
          }

          if ($ldflags -ne $env:EXPECTED_LDFLAGS) {
            throw "LDFLAGS mismatch"
          }

          if ($cronet -ne $env:CRONET_REVISION) {
            throw "Cronet revision mismatch"
          }

          if ((git status --porcelain --untracked-files=no)) {
            throw "Tracked source is not clean"
          }

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.5'
          check-latest: false
          cache: false

      - name: Verify Go toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          go version

          if ((go env GOVERSION).Trim() -ne "go1.25.5") {
            throw "Go version mismatch"
          }

          if ((go env GOHOSTOS).Trim() -ne "windows") {
            throw "GOHOSTOS mismatch"
          }

          if ((go env GOHOSTARCH).Trim() -ne "amd64") {
            throw "GOHOSTARCH mismatch"
          }

          if ((go env GOTOOLCHAIN).Trim() -ne "local") {
            throw "GOTOOLCHAIN mismatch"
          }

      - name: Verify Go modules
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          go mod download
          if ($LASTEXITCODE -ne 0) {
            throw "go mod download failed"
          }

          go mod verify
          if ($LASTEXITCODE -ne 0) {
            throw "go mod verify failed"
          }

          git diff --exit-code -- go.mod go.sum
          if ($LASTEXITCODE -ne 0) {
            throw "go.mod or go.sum changed"
          }

      - name: Build
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          $ErrorActionPreference = "Stop"

          $tags = (
            Get-Content release/DEFAULT_BUILD_TAGS_WINDOWS -Raw
          ).Trim()

          $ldflags = (
            Get-Content release/LDFLAGS -Raw
          ).Trim()

          if ($tags -ne $env:EXPECTED_WINDOWS_TAGS) {
            throw "Windows build tags changed"
          }

          if ($ldflags -ne $env:EXPECTED_LDFLAGS) {
            throw "LDFLAGS changed"
          }

          New-Item -ItemType Directory -Force dist | Out-Null

          go build `
            -v `
            -trimpath `
            -o dist/sing-box.exe `
            -tags "$tags" `
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=$env:VERSION' $ldflags -s -w -buildid=" `
            ./cmd/sing-box

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed"
          }

          if (-not (Test-Path dist/sing-box.exe)) {
            throw "sing-box.exe missing"
          }

      - name: Extract official libcronet.dll
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cronetRevision = (
            Get-Content .github/CRONET_GO_VERSION -Raw
          ).Trim()

          if ($cronetRevision -ne $env:CRONET_REVISION) {
            throw "Cronet baseline changed"
          }

          $libraryPath = "lib/windows_amd64/libcronet.dll"
          $repo = Join-Path $env:RUNNER_TEMP "cronet-go-lib"

          git init $repo

          git -C $repo remote add origin `
            https://github.com/sagernet/cronet-go.git

          git -C $repo sparse-checkout set `
            --no-cone `
            "/$libraryPath"

          git -C $repo fetch `
            --depth=1 `
            --filter=blob:none `
            origin `
            $env:CRONET_REVISION

          if ($LASTEXITCODE -ne 0) {
            throw "Cronet fetch failed"
          }

          git -C $repo checkout FETCH_HEAD

          if ($LASTEXITCODE -ne 0) {
            throw "Cronet checkout failed"
          }

          $actualRevision = (
            git -C $repo rev-parse HEAD
          ).Trim()

          if ($actualRevision -ne $env:CRONET_REVISION) {
            throw "Cronet revision verification failed"
          }

          Copy-Item `
            "$repo/$libraryPath" `
            "dist/libcronet.dll"

          if (-not (Test-Path dist/libcronet.dll)) {
            throw "libcronet.dll missing"
          }

      - name: Verify binary identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $output = (
            & .\dist\sing-box.exe version |
            Out-String
          )

          Write-Host $output

          if (-not $output.Contains(
            "sing-box version $env:VERSION"
          )) {
            throw "Version mismatch"
          }

          if (-not $output.Contains(
            "Environment: go1.25.5 windows/amd64"
          )) {
            throw "Environment mismatch"
          }

          if (-not $output.Contains(
            "Tags: $env:EXPECTED_WINDOWS_TAGS"
          )) {
            throw "Build tags mismatch"
          }

          if (-not $output.Contains(
            "Revision: $env:REVISION"
          )) {
            throw "Revision mismatch"
          }

          if (-not $output.Contains(
            "CGO: disabled"
          )) {
            throw "CGO mismatch"
          }

          Write-Host ""
          go version -m .\dist\sing-box.exe

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $name = "sing-box-$env:VERSION-windows-amd64"

          New-Item `
            -ItemType Directory `
            -Force `
            "dist\$name" |
            Out-Null

          Copy-Item LICENSE "dist\$name\LICENSE"
          Copy-Item dist\sing-box.exe "dist\$name\sing-box.exe"
          Copy-Item dist\libcronet.dll "dist\$name\libcronet.dll"

          Compress-Archive `
            -Path "dist\$name" `
            -DestinationPath "dist\$name.zip"

          $exeHash = (
            Get-FileHash `
              "dist\$name\sing-box.exe" `
              -Algorithm SHA256
          ).Hash.ToLower()

          $dllHash = (
            Get-FileHash `
              "dist\$name\libcronet.dll" `
              -Algorithm SHA256
          ).Hash.ToLower()

          $zipHash = (
            Get-FileHash `
              "dist\$name.zip" `
              -Algorithm SHA256
          ).Hash.ToLower()

          @(
            "$exeHash  $name/sing-box.exe"
            "$dllHash  $name/libcronet.dll"
            "$zipHash  $name.zip"
          ) |
            Set-Content `
              -Encoding ascii `
              "dist\$name.SHA256SUMS"

          Get-Content "dist\$name.SHA256SUMS"

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows-amd64
          path: |
            dist/sing-box-1.14.0-multipath-beta6-windows-amd64.zip
            dist/sing-box-1.14.0-multipath-beta6-windows-amd64.SHA256SUMS
          if-no-files-found: error
          retention-days: 30


  # ============================================================
  # Independent artifact verification
  # ============================================================

  macos-verify:
    name: Verify macOS artifact
    needs: macos-build
    runs-on: macos-15-intel
    timeout-minutes: 10

    steps:
      - name: Download artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: darwin-amd64
          path: verify

      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail

          cd verify

          NAME="sing-box-${VERSION}-darwin-amd64"

          test -f "${NAME}.tar.gz"
          test -f "${NAME}.SHA256SUMS"

          tar -xzf "${NAME}.tar.gz"

          shasum -a 256 -c "${NAME}.SHA256SUMS"

          OUTPUT="$("./${NAME}/sing-box" version)"
          printf '%s\n' "${OUTPUT}"

          grep -Fx "sing-box version ${VERSION}" <<<"${OUTPUT}"
          grep -Fx "Environment: go1.25.5 darwin/amd64" <<<"${OUTPUT}"
          grep -Fx "Tags: ${EXPECTED_MAC_TAGS}" <<<"${OUTPUT}"
          grep -Fx "Revision: ${REVISION}" <<<"${OUTPUT}"
          grep -Fx "CGO: enabled" <<<"${OUTPUT}"


  windows-verify:
    name: Verify Windows artifact
    needs: windows-build
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Download artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: windows-amd64
          path: verify

      - name: Verify artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location verify

          $name = "sing-box-$env:VERSION-windows-amd64"

          if (-not (Test-Path "$name.zip")) {
            throw "Archive missing"
          }

          if (-not (Test-Path "$name.SHA256SUMS")) {
            throw "SHA256SUMS missing"
          }

          Expand-Archive `
            -Path "$name.zip" `
            -DestinationPath .

          foreach ($line in Get-Content "$name.SHA256SUMS") {

            if ($line -notmatch '^([0-9a-f]{64})\s+(.+)$') {
              throw "Invalid SHA256SUMS line: $line"
            }

            $expected = $matches[1]
            $path = $matches[2] -replace '/', '\'

            $actual = (
              Get-FileHash `
                $path `
                -Algorithm SHA256
            ).Hash.ToLower()

            if ($actual -ne $expected) {
              throw "SHA256 mismatch: $path"
            }

            Write-Host "SHA256 PASS: $path"
          }

          if (-not (Test-Path ".\$name\libcronet.dll")) {
            throw "libcronet.dll missing"
          }

          $output = (
            & ".\$name\sing-box.exe" version |
            Out-String
          )

          Write-Host $output

          if (-not $output.Contains(
            "sing-box version $env:VERSION"
          )) {
            throw "Version mismatch"
          }

          if (-not $output.Contains(
            "Environment: go1.25.5 windows/amd64"
          )) {
            throw "Environment mismatch"
          }

          if (-not $output.Contains(
            "Tags: $env:EXPECTED_WINDOWS_TAGS"
          )) {
            throw "Build tags mismatch"
          }

          if (-not $output.Contains(
            "Revision: $env:REVISION"
          )) {
            throw "Revision mismatch"
          }

          if (-not $output.Contains(
            "CGO: disabled"
          )) {
            throw "CGO mismatch"
          }
