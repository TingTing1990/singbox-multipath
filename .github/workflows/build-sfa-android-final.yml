name: Build SFA Android Final

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: sing-box fork branch/tag/commit to build
        required: true
        default: feature/multipath-capacity-final
        type: string

permissions:
  contents: read

concurrency:
  group: sfa-android-arm64-v8a-${{ inputs.source_ref }}
  cancel-in-progress: true

env:
  SFA_COMMIT: 5d5479d8bb60f7eb45e86402a8aa3a6131dd9ba3
  APP_VERSION: 1.14.0-multipath-beta6
  VERSION_CODE: '731'
  GO_VERSION: '1.26.7'
  NDK_REVISION: 28.0.13004108
  PACKAGE_ID: custom.singbox.sfa
  APP_NAME: SFA
  TARGET_ABI: arm64-v8a
  GO_ARCH: arm64

jobs:
  build_libbox:
    name: Build audited Android library (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      core_commit: ${{ steps.identity.outputs.core_commit }}
      core_android_gitlink: ${{ steps.identity.outputs.core_android_gitlink }}
      sfa_pairing: ${{ steps.identity.outputs.sfa_pairing }}
      libbox_aar_sha256: ${{ steps.libbox.outputs.libbox_aar_sha256 }}
      libbox_so_sha256: ${{ steps.libbox.outputs.libbox_so_sha256 }}
    steps:
      - name: Checkout requested sing-box fork source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false
          path: sing-box

      - name: Resolve exact core identity and Android gitlink
        id: identity
        shell: bash
        run: |-
          set -euo pipefail
          ACTUAL_CORE="$(git -C sing-box rev-parse HEAD)"
          test -n "$ACTUAL_CORE"
          test "$(git -C sing-box ls-tree HEAD clients/android | awk '{print $1}')" = '160000'
          ACTUAL_GITLINK="$(git -C sing-box rev-parse HEAD:clients/android)"
          test -n "$ACTUAL_GITLINK"
          test -z "$(git -C sing-box status --porcelain=v1 --untracked-files=all)"
          if [[ "$ACTUAL_GITLINK" = "$SFA_COMMIT" ]]; then
            SFA_PAIRING='gitlink-equal'
          else
            SFA_PAIRING='explicit-pinned-override'
          fi
          echo "CORE_COMMIT=$ACTUAL_CORE" >> "$GITHUB_ENV"
          echo "CORE_ANDROID_GITLINK=$ACTUAL_GITLINK" >> "$GITHUB_ENV"
          echo "core_commit=$ACTUAL_CORE" >> "$GITHUB_OUTPUT"
          echo "core_android_gitlink=$ACTUAL_GITLINK" >> "$GITHUB_OUTPUT"
          echo "sfa_pairing=$SFA_PAIRING" >> "$GITHUB_OUTPUT"
          printf 'source_ref=%s\ncore_commit=%s\ncore_android_gitlink=%s\nselected_sfa_commit=%s\npairing=%s\n' \
            '${{ inputs.source_ref }}' "$ACTUAL_CORE" "$ACTUAL_GITLINK" "$SFA_COMMIT" "$SFA_PAIRING"

      - name: Verify fork libbox architecture surface
        shell: bash
        run: |-
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          root = Path('sing-box')

          def interface_methods(path, name):
              text = (root / path).read_text(encoding='utf-8')
              m = re.search(rf'type\s+{re.escape(name)}\s+interface\s*\{{(.*?)\n\}}', text, re.S)
              if not m:
                  raise SystemExit(f'missing Go interface {name}')
              return set(re.findall(r'^\s*([A-Z][A-Za-z0-9_]*)\s*\(', m.group(1), re.M))

          expected_command_server = {
              'ServiceStop', 'ServiceReload', 'GetSystemProxyStatus', 'SetSystemProxyEnabled',
              'TriggerNativeCrash', 'WriteDebugMessage', 'ConnectSSHAgent',
          }
          expected_command_client = {
              'Connected', 'Disconnected', 'SetDefaultLogLevel', 'ClearLogs', 'WriteLogs',
              'WriteStatus', 'WriteGroups', 'WriteOutbounds', 'InitializeClashMode',
              'UpdateClashMode', 'WriteConnectionEvents',
          }
          expected_platform = {
              'LocalDNSTransport', 'UsePlatformAutoDetectInterfaceControl', 'AutoDetectInterfaceControl',
              'OpenTun', 'UseProcFS', 'FindConnectionOwner', 'StartDefaultInterfaceMonitor',
              'CloseDefaultInterfaceMonitor', 'GetInterfaces', 'UnderNetworkExtension',
              'IncludeAllNetworks', 'ReadWIFIState', 'ClearDNSCache', 'SendNotification',
              'CancelNotification', 'StartNeighborMonitor', 'CloseNeighborMonitor', 'RegisterMyInterface',
              'UsePlatformShell', 'CheckPlatformShell', 'OpenShellSession', 'LookupUser',
              'LookupSFTPServer', 'ReadSystemSSHHostKey', 'TailscaleHostname', 'UsePlatformBridge',
              'CreateBridge',
          }
          checks = {
              'CommandServerHandler': interface_methods('experimental/libbox/command_server.go', 'CommandServerHandler') == expected_command_server,
              'CommandClientHandler': interface_methods('experimental/libbox/command_client.go', 'CommandClientHandler') == expected_command_client,
              'PlatformInterface': interface_methods('experimental/libbox/platform.go', 'PlatformInterface') == expected_platform,
          }
          setup = (root / 'experimental/libbox/setup.go').read_text(encoding='utf-8')
          for field in ('AppVersion', 'AppMarketingVersion', 'PowerReportEnabled', 'OomKillerEnabled', 'OomMemoryLimit'):
              checks[f'SetupOptions.{field}'] = re.search(rf'^\s*{field}\s+', setup, re.M) is not None

          registry = (root / 'include/registry.go').read_text(encoding='utf-8')
          checks['mieru inbound'] = 'mieru.RegisterInbound(registry)' in registry
          checks['mieru outbound'] = 'mieru.RegisterOutbound(registry)' in registry
          checks['multipath inbound'] = 'multipath.RegisterInbound(registry)' in registry
          checks['multipath outbound'] = 'multipath.RegisterOutbound(registry)' in registry

          failed = [k for k, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('core architecture contract mismatch: ' + ', '.join(failed))
          print('PASS core libbox architecture surface:', ', '.join(checks))
          PY

      - name: Setup Go 1.26.7
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7, Node 24
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Android NDK r28
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1, Node 24
        with:
          ndk-version: r28

      - name: Setup OpenJDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Verify exact native build toolchain
        shell: bash
        run: |-
          set -euo pipefail

          GO_ACTUAL="$(go env GOVERSION)"
          printf 'Go actual=%s expected=go%s\n' "$GO_ACTUAL" "$GO_VERSION"
          if [[ "$GO_ACTUAL" != "go${GO_VERSION}" ]]; then
            echo 'ERROR: unexpected Go version' >&2
            exit 31
          fi

          NDK_PATH='${{ steps.setup-ndk.outputs.ndk-path }}'
          test -d "$NDK_PATH" || { echo "ERROR: NDK path does not exist: $NDK_PATH" >&2; exit 32; }
          NDK_PROPERTIES="$NDK_PATH/source.properties"
          test -f "$NDK_PROPERTIES" || { echo "ERROR: missing NDK source.properties: $NDK_PROPERTIES" >&2; exit 33; }
          NDK_ACTUAL="$(sed -n 's/^Pkg\.Revision[[:space:]]*=[[:space:]]*//p' "$NDK_PROPERTIES" | head -n1 | tr -d '\r')"
          printf 'NDK path=%s\nNDK actual=%s expected=%s\n' "$NDK_PATH" "$NDK_ACTUAL" "$NDK_REVISION"
          if [[ "$NDK_ACTUAL" != "$NDK_REVISION" ]]; then
            echo 'ERROR: unexpected Android NDK revision' >&2
            exit 34
          fi

          JAVA_INFO="$(java -XshowSettings:properties -version 2>&1)"
          JAVA_SPEC="$(awk -F= '/^[[:space:]]*java\.specification\.version[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2; exit}' <<<"$JAVA_INFO")"
          printf 'Java specification actual=%s expected=17\n' "$JAVA_SPEC"
          java --version
          if [[ "$JAVA_SPEC" != '17' ]]; then
            echo 'ERROR: unexpected Java specification version' >&2
            exit 35
          fi

      - name: Set exact core version tag
        shell: bash
        run: |-
          set -euo pipefail
          git -C sing-box tag -f "v${APP_VERSION}" "$CORE_COMMIT"
          test "$(git -C sing-box describe --tags --exact-match HEAD)" = "v${APP_VERSION}"

      - name: Build libbox using upstream sing-box Android flow
        id: libbox
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |-
          set -euo pipefail
          OUT="$RUNNER_TEMP/libbox-dist/${GO_ARCH}"
          rm -rf "$RUNNER_TEMP/libbox-dist"
          mkdir -p "$OUT"
          (
            cd sing-box
            make lib_install
            export PATH="$PATH:$(go env GOPATH)/bin"
            go run ./cmd/internal/build_libbox -target android -platform android/${GO_ARCH}
            test -s libbox.aar
            test -s libbox-legacy.aar
            mv libbox.aar libbox-legacy.aar "$OUT/"
          )
          (
            cd "$OUT"
            sha256sum libbox.aar libbox-legacy.aar > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          python3 - "$OUT" <<'PY'
          import os, struct, sys, zipfile
          root = sys.argv[1]
          abi = os.environ['TARGET_ABI']
          for name in ('libbox.aar', 'libbox-legacy.aar'):
              path = os.path.join(root, name)
              with zipfile.ZipFile(path) as z:
                  bad = z.testzip()
                  if bad is not None:
                      raise SystemExit(f'{name}: CRC failure at {bad}')
                  abis = {n.split('/')[1] for n in z.namelist() if n.startswith('jni/') and n.endswith('.so')}
                  if abis != {abi}:
                      raise SystemExit(f'{name}: unexpected ABIs {abis}')
                  so = z.read(f'jni/{abi}/libbox.so')
                  if so[:6] != b'\x7fELF\x02\x01' or struct.unpack_from('<H', so, 18)[0] != 183:
                      raise SystemExit(f'{name}: libbox.so is not AArch64 ELF64')
          print('PASS AAR CRC / single ABI / AArch64 ELF64')
          PY
          LIBBOX_AAR_SHA256="$(sha256sum "$OUT/libbox.aar" | awk '{print $1}')"
          LIBBOX_SO_SHA256="$(unzip -p "$OUT/libbox.aar" "jni/${TARGET_ABI}/libbox.so" | sha256sum | awk '{print $1}')"
          test -n "$LIBBOX_AAR_SHA256"
          test -n "$LIBBOX_SO_SHA256"
          echo "libbox_aar_sha256=$LIBBOX_AAR_SHA256" >> "$GITHUB_OUTPUT"
          echo "libbox_so_sha256=$LIBBOX_SO_SHA256" >> "$GITHUB_OUTPUT"
          test -z "$(git -C sing-box status --porcelain=v1 --untracked-files=all)"
          printf 'libbox.aar sha256=%s\nlibbox.so sha256=%s\n' "$LIBBOX_AAR_SHA256" "$LIBBOX_SO_SHA256"

      - name: Upload audited arm64 libbox artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, Node 24
        with:
          name: libbox-android-arm64
          path: ${{ runner.temp }}/libbox-dist/arm64
          if-no-files-found: error
          compression-level: 0

  build_sfa:
    name: Build audited SFA OtherRelease (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs:
      - build_libbox
    steps:
      - name: Checkout exact core resolved from source_ref
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ needs.build_libbox.outputs.core_commit }}
          fetch-depth: 1
          persist-credentials: false
          path: sing-box

      - name: Bind resolved core identity for this job
        shell: bash
        run: |-
          set -euo pipefail
          echo "CORE_COMMIT=${{ needs.build_libbox.outputs.core_commit }}" >> "$GITHUB_ENV"
          echo "CORE_ANDROID_GITLINK=${{ needs.build_libbox.outputs.core_android_gitlink }}" >> "$GITHUB_ENV"
          echo "SFA_PAIRING=${{ needs.build_libbox.outputs.sfa_pairing }}" >> "$GITHUB_ENV"

      - name: Checkout explicitly pinned SFA 1.14.0
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: SagerNet/sing-box-for-android
          ref: ${{ env.SFA_COMMIT }}
          fetch-depth: 1
          persist-credentials: false
          path: sing-box-for-android

      - name: Checkout SFA nested submodules
        shell: bash
        run: |-
          set -euo pipefail
          test "$(git -C sing-box-for-android rev-parse HEAD)" = "$SFA_COMMIT"
          git -C sing-box-for-android submodule update --init --recursive -v
          test -z "$(git -C sing-box-for-android status --porcelain=v1 --untracked-files=all)"

      - name: Setup Go 1.26.7
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7, Node 24
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Android NDK r28
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1, Node 24
        with:
          ndk-version: r28

      - name: Setup OpenJDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Verify exact Android toolchain and SFA baseline
        shell: bash
        run: |-
          set -euo pipefail

          GO_ACTUAL="$(go env GOVERSION)"
          printf 'Go actual=%s expected=go%s\n' "$GO_ACTUAL" "$GO_VERSION"
          if [[ "$GO_ACTUAL" != "go${GO_VERSION}" ]]; then
            echo 'ERROR: unexpected Go version' >&2
            exit 41
          fi

          NDK_PATH='${{ steps.setup-ndk.outputs.ndk-path }}'
          test -d "$NDK_PATH" || { echo "ERROR: NDK path does not exist: $NDK_PATH" >&2; exit 42; }
          NDK_PROPERTIES="$NDK_PATH/source.properties"
          test -f "$NDK_PROPERTIES" || { echo "ERROR: missing NDK source.properties: $NDK_PROPERTIES" >&2; exit 43; }
          NDK_ACTUAL="$(sed -n 's/^Pkg\.Revision[[:space:]]*=[[:space:]]*//p' "$NDK_PROPERTIES" | head -n1 | tr -d '\r')"
          printf 'NDK path=%s\nNDK actual=%s expected=%s\n' "$NDK_PATH" "$NDK_ACTUAL" "$NDK_REVISION"
          if [[ "$NDK_ACTUAL" != "$NDK_REVISION" ]]; then
            echo 'ERROR: unexpected Android NDK revision' >&2
            exit 44
          fi

          JAVA_INFO="$(java -XshowSettings:properties -version 2>&1)"
          JAVA_SPEC="$(awk -F= '/^[[:space:]]*java\.specification\.version[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2; exit}' <<<"$JAVA_INFO")"
          printf 'Java specification actual=%s expected=17\n' "$JAVA_SPEC"
          if [[ "$JAVA_SPEC" != '17' ]]; then
            echo 'ERROR: unexpected Java specification version' >&2
            exit 45
          fi

          test "$(git -C sing-box rev-parse HEAD)" = "$CORE_COMMIT"
          test "$(git -C sing-box rev-parse HEAD:clients/android)" = "$CORE_ANDROID_GITLINK"
          test "$(git -C sing-box-for-android rev-parse HEAD)" = "$SFA_COMMIT"
          if [[ "$CORE_ANDROID_GITLINK" = "$SFA_COMMIT" ]]; then
            test "$SFA_PAIRING" = 'gitlink-equal'
          else
            test "$SFA_PAIRING" = 'explicit-pinned-override'
          fi
          grep -Fx 'VERSION_CODE=730' sing-box-for-android/version.properties
          grep -Fx 'VERSION_NAME=1.14.0' sing-box-for-android/version.properties
          grep -Fx 'GO_VERSION=go1.26.7' sing-box-for-android/version.properties
          grep -F 'namespace = "io.nekohasekai.sfa"' sing-box-for-android/app/build.gradle.kts
          grep -F 'applicationId = "io.nekohasekai.sfa"' sing-box-for-android/app/build.gradle.kts
          grep -F 'minSdk = 24' sing-box-for-android/app/build.gradle.kts
          grep -F 'ndkVersion = "28.0.13004108"' sing-box-for-android/app/build.gradle.kts
          grep -F 'include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")' sing-box-for-android/app/build.gradle.kts
          printf 'PAIRING NOTE: core gitlink=%s; selected SFA=%s; pairing=%s.\n' \
            "$CORE_ANDROID_GITLINK" "$SFA_COMMIT" "$SFA_PAIRING"

      - name: Audit SFA to fork libbox API and lifecycle contract
        shell: bash
        run: |-
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/sfa-libbox-architecture-contract.txt"
          python3 > "$EVIDENCE" <<'PY'
          import re
          from pathlib import Path

          core = Path('sing-box')
          sfa = Path('sing-box-for-android')

          def go_methods(path, name):
              text = (core / path).read_text(encoding='utf-8')
              m = re.search(rf'type\s+{re.escape(name)}\s+interface\s*\{{(.*?)\n\}}', text, re.S)
              if not m:
                  raise SystemExit(f'missing Go interface {name}')
              return set(re.findall(r'^\s*([A-Z][A-Za-z0-9_]*)\s*\(', m.group(1), re.M))

          def kotlin_overrides(*paths):
              out = set()
              for path in paths:
                  text = (sfa / path).read_text(encoding='utf-8')
                  out.update(re.findall(r'override\s+fun\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(', text))
              return out

          def kt_name(go_name):
              return go_name[:1].lower() + go_name[1:]

          contracts = []

          cs = go_methods('experimental/libbox/command_server.go', 'CommandServerHandler')
          cs_impl = kotlin_overrides('app/src/main/java/io/nekohasekai/sfa/bg/BoxService.kt')
          missing = sorted(kt_name(x) for x in cs if kt_name(x) not in cs_impl)
          if missing:
              raise SystemExit('CommandServerHandler missing SFA overrides: ' + ', '.join(missing))
          contracts.append(f'CommandServerHandler surface PASS ({len(cs)} methods)')

          cc = go_methods('experimental/libbox/command_client.go', 'CommandClientHandler')
          cc_impl = kotlin_overrides('app/src/main/java/io/nekohasekai/sfa/utils/CommandClient.kt')
          missing = sorted(kt_name(x) for x in cc if kt_name(x) not in cc_impl)
          if missing:
              raise SystemExit('CommandClientHandler missing SFA overrides: ' + ', '.join(missing))
          contracts.append(f'CommandClientHandler surface PASS ({len(cc)} methods)')

          pi = go_methods('experimental/libbox/platform.go', 'PlatformInterface')
          pi_impl = kotlin_overrides(
              'app/src/main/java/io/nekohasekai/sfa/bg/PlatformInterfaceWrapper.kt',
              'app/src/main/java/io/nekohasekai/sfa/bg/VPNService.kt',
              'app/src/main/java/io/nekohasekai/sfa/bg/ProxyService.kt',
          )
          missing = sorted(kt_name(x) for x in pi if kt_name(x) not in pi_impl)
          if missing:
              raise SystemExit('PlatformInterface missing SFA overrides: ' + ', '.join(missing))
          contracts.append(f'PlatformInterface surface PASS ({len(pi)} methods)')

          setup_go = (core / 'experimental/libbox/setup.go').read_text(encoding='utf-8')
          app_kt = (sfa / 'app/src/main/java/io/nekohasekai/sfa/Application.kt').read_text(encoding='utf-8')
          setup_pairs = {
              'AppVersion': 'it.appVersion = BuildConfig.VERSION_CODE.toString()',
              'AppMarketingVersion': 'it.appMarketingVersion = BuildConfig.VERSION_NAME',
              'OomKillerEnabled': 'it.oomKillerEnabled = Settings.oomKillerEnabled',
              'OomMemoryLimit': 'it.oomMemoryLimit = Settings.oomMemoryLimitMB.toLong()',
              'PowerReportEnabled': 'it.powerReportEnabled = Settings.powerReportEnabled',
          }
          for go_field, kt_fragment in setup_pairs.items():
              if not re.search(rf'^\s*{go_field}\s+', setup_go, re.M):
                  raise SystemExit(f'core SetupOptions missing {go_field}')
              if kt_fragment not in app_kt:
                  raise SystemExit(f'SFA setup missing semantic assignment for {go_field}')
          contracts.append('SetupOptions core↔SFA assignments PASS')

          vpn = (sfa / 'app/src/main/java/io/nekohasekai/sfa/bg/VPNService.kt').read_text(encoding='utf-8')
          box = (sfa / 'app/src/main/java/io/nekohasekai/sfa/bg/BoxService.kt').read_text(encoding='utf-8')
          lifecycle_fragments = {
              'VPN permission': 'if (prepare(this) != null) error("android: missing vpn permission")',
              'VPN establish': 'builder.establish() ?: error("android: the application is not prepared or is revoked")',
              'PFD ownership': 'service.fileDescriptor = pfd',
              'VPN revoke': 'service.onRevoke()',
              'PFD close': 'pfd.close()',
              'network monitor stop': 'DefaultNetworkMonitor.stop()',
              'command server close': 'commandServer.close()',
              'command service close': 'commandServer.closeService()',
          }
          for name, fragment in lifecycle_fragments.items():
              source = vpn if name in {'VPN permission', 'VPN establish', 'PFD ownership', 'VPN revoke'} else box
              if fragment not in source:
                  raise SystemExit(f'lifecycle contract missing: {name}')
          contracts.append('VPN/service lifecycle source contract PASS')

          if 'protect(fd)' not in vpn:
              raise SystemExit('VPN protect(fd) path missing')
          contracts.append('VPN socket protect path PRESENT; Boolean return remains upstream-unchecked and requires runtime observation')

          for line in contracts:
              print(line)
          print('BOUNDARY: static source/API contract only; callback timing, thread semantics, Android lifecycle behavior and network-change recovery require target runtime tests.')
          PY
          cat "$EVIDENCE"

      - name: Set exact core version tag
        shell: bash
        run: |-
          set -euo pipefail
          git -C sing-box tag -f "v${APP_VERSION}" "$CORE_COMMIT"
          test "$(git -C sing-box describe --tags --exact-match HEAD)" = "v${APP_VERSION}"

      - name: Download audited arm64 libbox artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7, Node 24
        with:
          name: libbox-android-arm64
          path: libbox-inputs

      - name: Verify and stage libbox AARs; update Android version with upstream helper
        shell: bash
        run: |-
          set -euo pipefail
          test -s libbox-inputs/libbox.aar
          test -s libbox-inputs/libbox-legacy.aar
          test -s libbox-inputs/SHA256SUMS
          (cd libbox-inputs && sha256sum -c SHA256SUMS)
          test "$(sha256sum libbox-inputs/libbox.aar | awk '{print $1}')" = '${{ needs.build_libbox.outputs.libbox_aar_sha256 }}'
          test "$(unzip -p libbox-inputs/libbox.aar "jni/${TARGET_ABI}/libbox.so" | sha256sum | awk '{print $1}')" = '${{ needs.build_libbox.outputs.libbox_so_sha256 }}'
          mkdir -p sing-box-for-android/app/libs
          cp libbox-inputs/libbox.aar sing-box-for-android/app/libs/libbox.aar
          cp libbox-inputs/libbox-legacy.aar sing-box-for-android/app/libs/libbox-legacy.aar
          (
            cd sing-box
            go run -v ./cmd/internal/update_android_version
          )
          grep -Fx "VERSION_NAME=${APP_VERSION}" sing-box-for-android/version.properties
          grep -Fx "VERSION_CODE=${VERSION_CODE}" sing-box-for-android/version.properties
          grep -Fx "GO_VERSION=go${GO_VERSION}" sing-box-for-android/version.properties

      - name: Apply audited SFA packaging and branding deltas only
        shell: bash
        run: |-
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          root = Path('sing-box-for-android')
          gradle = root / 'app/build.gradle.kts'
          text = gradle.read_text(encoding='utf-8')
          replacements = [
              ('applicationId = "io.nekohasekai.sfa"', 'applicationId = "custom.singbox.sfa"'),
              ('isUniversalApk = true', 'isUniversalApk = false'),
              ('include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")', 'include("arm64-v8a")'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected SFA baseline for {old!r}: count={text.count(old)}')
              text = text.replace(old, new, 1)
          gradle.write_text(text, encoding='utf-8')

          changed_labels = 0
          for path in sorted((root / 'app/src/main/res').glob('values*/strings.xml')):
              original = path.read_text(encoding='utf-8')
              updated, count = re.subn(
                  r'(<string\s+name="app_name"[^>]*>)sing-box(</string>)',
                  r'\1SFA\2',
                  original,
              )
              if count:
                  path.write_text(updated, encoding='utf-8')
                  changed_labels += count
          if changed_labels < 1:
              raise SystemExit('no upstream app_name=sing-box resource was found')

          vpn = root / 'app/src/main/java/io/nekohasekai/sfa/bg/VPNService.kt'
          text = vpn.read_text(encoding='utf-8')
          old = '.setSession("sing-box")'
          new = '.setSession("SFA")'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected VPN session baseline: count={text.count(old)}')
          vpn.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          grep -F 'namespace = "io.nekohasekai.sfa"' sing-box-for-android/app/build.gradle.kts
          grep -F 'applicationId = "custom.singbox.sfa"' sing-box-for-android/app/build.gradle.kts
          grep -F 'minSdk = 24' sing-box-for-android/app/build.gradle.kts
          grep -F 'isUniversalApk = false' sing-box-for-android/app/build.gradle.kts
          grep -F 'include("arm64-v8a")' sing-box-for-android/app/build.gradle.kts
          grep -F '.setSession("SFA")' sing-box-for-android/app/src/main/java/io/nekohasekai/sfa/bg/VPNService.kt
          ! grep -F '.setSession("sing-box")' sing-box-for-android/app/src/main/java/io/nekohasekai/sfa/bg/VPNService.kt
          python3 <<'PY'
          import re
          from pathlib import Path
          root = Path('sing-box-for-android/app/src/main/res')
          values = []
          for path in sorted(root.glob('values*/strings.xml')):
              text = path.read_text(encoding='utf-8')
              for value in re.findall(r'<string\s+name="app_name"[^>]*>(.*?)</string>', text):
                  values.append((str(path), value))
          if not values:
              raise SystemExit('no app_name resources found')
          bad = [(p, v) for p, v in values if v != 'SFA']
          if bad:
              raise SystemExit('non-SFA app_name resources remain: ' + repr(bad))
          print(f'PASS all {len(values)} app_name resources are SFA')
          PY

      - name: Verify minimal tracked SFA write-set
        shell: bash
        run: |-
          set -euo pipefail
          python3 <<'PY'
          import subprocess

          changed = subprocess.check_output(
              ['git', '-C', 'sing-box-for-android', 'diff', '--name-only'], text=True
          ).splitlines()
          if not changed:
              raise SystemExit('expected tracked SFA changes, found none')

          required = {
              'app/build.gradle.kts',
              'app/src/main/java/io/nekohasekai/sfa/bg/VPNService.kt',
              'version.properties',
          }
          missing = sorted(required - set(changed))
          if missing:
              raise SystemExit('missing expected tracked changes: ' + ', '.join(missing))

          unexpected = []
          for path in changed:
              if path in required:
                  continue
              if path.startswith('app/src/main/res/values') and path.endswith('/strings.xml'):
                  continue
              unexpected.append(path)
          if unexpected:
              raise SystemExit('unexpected tracked SFA changes: ' + ', '.join(unexpected))

          source_changes = [p for p in changed if p.endswith(('.kt', '.java', '.aidl'))]
          if source_changes != ['app/src/main/java/io/nekohasekai/sfa/bg/VPNService.kt']:
              raise SystemExit('unexpected source-code write-set: ' + repr(source_changes))

          print('PASS minimal tracked write-set:')
          for path in changed:
              print('  ' + path)
          PY
          test -z "$(git -C sing-box status --porcelain=v1 --untracked-files=all)"

      - name: Prepare ephemeral release signing
        id: signing
        shell: bash
        run: |-
          set -euo pipefail
          umask 077
          KEYSTORE="$GITHUB_WORKSPACE/sing-box-for-android/app/release.keystore"
          PROPS="$RUNNER_TEMP/sfa-signing.properties"
          rm -f "$KEYSTORE" "$PROPS"
          STORE_PASS="$(openssl rand -hex 32)"
          ALIAS_NAME='sfa-release'
          echo "::add-mask::$STORE_PASS"
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -alias "$ALIAS_NAME" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 36500 \
            -dname 'CN=SFA Custom Release, OU=Personal, O=Personal, L=Local, ST=Local, C=US' \
            -noprompt >/dev/null
          {
            printf 'KEYSTORE_PASS=%s\n' "$STORE_PASS"
            printf 'ALIAS_NAME=%s\n' "$ALIAS_NAME"
            printf 'ALIAS_PASS=%s\n' "$STORE_PASS"
          } > "$PROPS"
          chmod 600 "$KEYSTORE" "$PROPS"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$ALIAS_NAME" >/dev/null
          LOCAL_PROPERTIES_B64="$(base64 -w0 < "$PROPS")"
          echo "::add-mask::$LOCAL_PROPERTIES_B64"
          echo "LOCAL_PROPERTIES=$LOCAL_PROPERTIES_B64" >> "$GITHUB_ENV"
          CERT_SHA256="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$ALIAS_NAME" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test -n "$CERT_SHA256"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "Ephemeral release signing ready; certificate_sha256=$CERT_SHA256"

      - name: Build SFA OtherRelease using upstream Gradle task
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |-
          set -euo pipefail
          cd sing-box-for-android
          ./gradlew --build-cache --parallel --stacktrace :app:assembleOtherRelease

      - name: Verify final APK identity, native provenance, manifest and signature
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ steps.signing.outputs.cert_sha256 }}
          EXPECTED_LIBBOX_AAR_SHA256: ${{ needs.build_libbox.outputs.libbox_aar_sha256 }}
          EXPECTED_LIBBOX_SO_SHA256: ${{ needs.build_libbox.outputs.libbox_so_sha256 }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |-
          set -euo pipefail
          OUT='sing-box-for-android/app/build/outputs/apk/other/release'
          mapfile -t APKS < <(find "$OUT" -maxdepth 1 -type f -name '*.apk' -print | sort)
          printf 'APK outputs:\n'; printf '  %s\n' "${APKS[@]}"
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          BADGING="$($AAPT dump badging "$APK")"
          grep -F "package: name='${PACKAGE_ID}'" <<<"$BADGING"
          grep -F "versionCode='${VERSION_CODE}'" <<<"$BADGING"
          grep -F "versionName='${APP_VERSION}'" <<<"$BADGING"
          grep -F "sdkVersion:'24'" <<<"$BADGING"
          grep -F "targetSdkVersion:'37'" <<<"$BADGING"
          if grep -q '^application-debuggable' <<<"$BADGING"; then
            echo 'release APK is unexpectedly debuggable' >&2
            exit 1
          fi
          mapfile -t LABELS < <(grep '^application-label' <<<"$BADGING" | sed -n "s/^[^:]*:'\(.*\)'$/\1/p" | sort -u)
          test "${#LABELS[@]}" -eq 1
          test "${LABELS[0]}" = "$APP_NAME"

          mapfile -t APK_ABIS < <(unzip -Z1 "$APK" | awk -F/ '/^lib\// && NF >= 3 {print $2}' | sort -u)
          printf 'APK ABI(s): %s\n' "${APK_ABIS[*]:-<none>}"
          test "${#APK_ABIS[@]}" -eq 1
          test "${APK_ABIS[0]}" = "$TARGET_ABI"
          APK_ENTRIES="$(unzip -Z1 "$APK")"
          grep -Fx "lib/${TARGET_ABI}/libbox.so" <<<"$APK_ENTRIES" >/dev/null

          python3 - "$APK" <<'PY'
          import struct, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              bad = z.testzip()
              if bad is not None:
                  raise SystemExit(f'APK CRC failure at {bad}')
              for name in z.namelist():
                  if not (name.startswith('lib/') and name.endswith('.so')):
                      continue
                  b = z.read(name)
                  if b[:6] != b'\x7fELF\x02\x01' or struct.unpack_from('<H', b, 18)[0] != 183:
                      raise SystemExit(f'{name}: not AArch64 ELF64')
                  phoff = struct.unpack_from('<Q', b, 32)[0]
                  phsize, phnum = struct.unpack_from('<HH', b, 54)
                  loads = 0
                  for i in range(phnum):
                      h = struct.unpack_from('<IIQQQQQQ', b, phoff + i * phsize)
                      if h[0] == 1:
                          loads += 1
                          if h[7] < 16384 or h[2] % 16384 != h[3] % 16384:
                              raise SystemExit(f'{name}: incompatible ELF 16 KB load alignment')
                  if not loads:
                      raise SystemExit(f'{name}: no ELF PT_LOAD segments')
                  print(f'ELF 16 KB alignment OK: {name}')
          PY

          AAR_SO="$RUNNER_TEMP/libbox-from-aar.so"
          APK_SO="$RUNNER_TEMP/libbox-from-apk.so"
          unzip -p libbox-inputs/libbox.aar "jni/${TARGET_ABI}/libbox.so" > "$AAR_SO"
          unzip -p "$APK" "lib/${TARGET_ABI}/libbox.so" > "$APK_SO"
          test -s "$AAR_SO"
          test -s "$APK_SO"

          AAR_SO_SHA256="$(sha256sum "$AAR_SO" | awk '{print $1}')"
          APK_SO_SHA256="$(sha256sum "$APK_SO" | awk '{print $1}')"
          test "$AAR_SO_SHA256" = "$EXPECTED_LIBBOX_SO_SHA256"
          test "$(sha256sum libbox-inputs/libbox.aar | awk '{print $1}')" = "$EXPECTED_LIBBOX_AAR_SHA256"
          printf 'libbox SHA256: build AAR=%s final APK=%s\n' "$AAR_SO_SHA256" "$APK_SO_SHA256"
          echo 'INFO: AAR and final APK libbox.so hashes are recorded separately. No synthetic AGP transform is used as a blocking gate.'

          MANIFEST_TREE="$($AAPT dump xmltree "$APK" AndroidManifest.xml)"
          grep -F 'custom.singbox.sfa.XposedService' <<<"$MANIFEST_TREE" >/dev/null
          grep -F 'custom.singbox.sfa.cache' <<<"$MANIFEST_TREE" >/dev/null
          grep -F 'custom.singbox.sfa.workingdir' <<<"$MANIFEST_TREE" >/dev/null
          grep -F 'android.permission.BIND_VPN_SERVICE' <<<"$MANIFEST_TREE" >/dev/null
          grep -F 'android.net.VpnService' <<<"$MANIFEST_TREE" >/dev/null
          ! grep -F 'io.nekohasekai.sfa.cache' <<<"$MANIFEST_TREE" >/dev/null
          ! grep -F 'io.nekohasekai.sfa.XposedService' <<<"$MANIFEST_TREE" >/dev/null
          ! grep -F 'io.nekohasekai.sfa.workingdir' <<<"$MANIFEST_TREE" >/dev/null

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          APK_CERT_SHA256="$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' "$RUNNER_TEMP/apksigner.txt" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test -n "$APK_CERT_SHA256"
          test "$APK_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

          mkdir -p dist
          FINAL="dist/SFA-${APP_VERSION}-${TARGET_ABI}.apk"
          cp "$APK" "$FINAL"
          (cd dist && sha256sum "$(basename "$FINAL")") | tee "${FINAL}.sha256"
          (cd dist && sha256sum -c "$(basename "${FINAL}.sha256")")
          {
            echo "core_commit=${CORE_COMMIT}"
            echo "core_android_gitlink=${CORE_ANDROID_GITLINK}"
            echo "sfa_commit=${SFA_COMMIT}"
            echo "source_ref=${{ inputs.source_ref }}"
            echo "sfa_selection=${SFA_PAIRING}"
            echo "workflow_ref=${{ github.workflow_ref }}"
            echo "workflow_sha=${{ github.workflow_sha }}"
            echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "version_name=${APP_VERSION}"
            echo "version_code=${VERSION_CODE}"
            echo "package_id=${PACKAGE_ID}"
            echo 'namespace=io.nekohasekai.sfa'
            echo "app_name=${APP_NAME}"
            echo 'vpn_session=SFA'
            echo "abi=${TARGET_ABI}"
            echo "go_version=$(go env GOVERSION)"
            echo "ndk_version=${NDK_REVISION}"
            echo "libbox_aar_sha256=${EXPECTED_LIBBOX_AAR_SHA256}"
            echo "libbox_aar_so_sha256=${AAR_SO_SHA256}"
            echo "libbox_apk_so_sha256=${APK_SO_SHA256}"
            echo "apk_sha256=$(sha256sum "$FINAL" | awk '{print $1}')"
            echo "signing_cert_sha256=${APK_CERT_SHA256}"
            echo "aapt_path=${AAPT}"
            echo "apksigner_path=${APKSIGNER}"
            echo "zipalign_path=${ZIPALIGN}"
          } > "${FINAL}.buildinfo.txt"
          cp "$RUNNER_TEMP/apksigner.txt" "${FINAL}.signature.txt"
          printf '%s\n' "$BADGING" > "${FINAL}.badging.txt"
          printf '%s\n' "$MANIFEST_TREE" > "${FINAL}.manifest-tree.txt"
          cp "$RUNNER_TEMP/sfa-libbox-architecture-contract.txt" "${FINAL}.architecture-contract.txt"
          cat "${FINAL}.buildinfo.txt"

      - name: Upload verified SFA release APK and audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, Node 24
        with:
          name: SFA-${{ env.APP_VERSION }}-${{ env.TARGET_ABI }}-release
          path: |
            dist/SFA-${{ env.APP_VERSION }}-${{ env.TARGET_ABI }}.apk
            dist/SFA-${{ env.APP_VERSION }}-${{ env.TARGET_ABI }}.apk.sha256
            dist/SFA-${{ env.APP_VERSION }}-${{ env.TARGET_ABI }}.apk.buildinfo.txt
            dist/SFA-${{ env.APP_VERSION }}-${{ env.TARGET_ABI }}.apk.signature.txt
            dist/SFA-${{ env.APP_VERSION }}-${{ env.TARGET_ABI }}.apk.badging.txt
            dist/SFA-${{ env.APP_VERSION }}-${{ env.TARGET_ABI }}.apk.manifest-tree.txt
            dist/SFA-${{ env.APP_VERSION }}-${{ env.TARGET_ABI }}.apk.architecture-contract.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Stop Gradle daemon on every exit path
        if: always()
        continue-on-error: true
        shell: bash
        run: |-
          if test -x sing-box-for-android/gradlew; then
            (cd sing-box-for-android && ./gradlew --stop)
          fi

      - name: Clean ephemeral signing material on every exit path
        if: always()
        shell: bash
        run: |-
          set -euo pipefail
          rm -f \
            "$GITHUB_WORKSPACE/sing-box-for-android/app/release.keystore" \
            "$RUNNER_TEMP/sfa-signing.properties" \
            "$RUNNER_TEMP/libbox-from-aar.so" \
            "$RUNNER_TEMP/libbox-from-apk.so"
          test ! -e "$GITHUB_WORKSPACE/sing-box-for-android/app/release.keystore"
          test ! -e "$RUNNER_TEMP/sfa-signing.properties"
