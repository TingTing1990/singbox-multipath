name: Build Multipath + Mieru beta6 v3

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch/tag/commit to audit and build"
        required: true
        type: string
        default: "feature/mieru-outbound-beta6"

permissions:
  contents: read

concurrency:
  group: multipath-mieru-beta6-v3-${{ inputs.source_ref }}
  cancel-in-progress: false

env:
  SOURCE_REF: ${{ inputs.source_ref }}

  BASE_SHA: 31970756db5fd37d9e4080734dfeed9ffd5ceefd

  DONOR_REPO: https://github.com/enfein/mbox.git
  DONOR_SHA: 7300c5fc048ce99306f2eda3d63c2c7bda389177

  MIERU_VERSION: v3.36.1
  GO_VERSION: 1.25.5

  BUILD_VERSION: 1.14.0-multipath-mieru-beta6

jobs:
  audit:
    name: Static source audit
    runs-on: ubuntu-24.04

    outputs:
      source_sha: ${{ steps.source_identity.outputs.source_sha }}

    steps:
      - name: Checkout source candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup frozen Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          check-latest: false

      - name: Resolve source identity
        id: source_identity
        shell: bash
        run: |
          set -Eeuo pipefail

          SOURCE_SHA="$(git rev-parse HEAD)"

          echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"

          echo "=== SOURCE IDENTITY ==="
          echo "source_ref=${SOURCE_REF}"
          echo "source_sha=${SOURCE_SHA}"
          echo "base_sha=${BASE_SHA}"
          echo "donor_sha=${DONOR_SHA}"
          echo "mieru_version=${MIERU_VERSION}"
          echo "go_version=${GO_VERSION}"
          echo

          go version

          ACTUAL_GO="$(
            go version |
            awk '{print $3}' |
            sed 's/^go//'
          )"

          if [ "${ACTUAL_GO}" != "${GO_VERSION}" ]; then
            echo "FAIL: Go runtime version mismatch"
            echo "expected=${GO_VERSION}"
            echo "actual=${ACTUAL_GO}"
            exit 1
          fi

          echo "PASS: exact Go ${GO_VERSION}"

      - name: Verify frozen base ancestry
        shell: bash
        run: |
          set -Eeuo pipefail

          git cat-file -e "${BASE_SHA}^{commit}"

          if ! git merge-base --is-ancestor "${BASE_SHA}" HEAD; then
            echo "FAIL: candidate does not descend from frozen base"
            echo "base=${BASE_SHA}"
            echo "candidate=$(git rev-parse HEAD)"
            exit 1
          fi

          echo "PASS: candidate descends from frozen base ${BASE_SHA}"

      - name: Verify exact approved functional write-set
        shell: bash
        run: |
          set -Eeuo pipefail

          git diff --name-only "${BASE_SHA}..HEAD" |
            awk '
              $0 != ".github/workflows/build-multipath-mieru-beta6.yml" {
                print
              }
            ' |
            sort \
            > /tmp/actual-files.txt

          cat > /tmp/expected-files.txt <<'EOF'
          constant/proxy.go
          go.mod
          go.sum
          include/registry.go
          option/mieru.go
          protocol/mieru/outbound.go
          EOF

          sort -o /tmp/expected-files.txt /tmp/expected-files.txt

          echo "=== ACTUAL FUNCTIONAL DELTA ==="
          cat /tmp/actual-files.txt

          echo
          echo "=== APPROVED FUNCTIONAL DELTA ==="
          cat /tmp/expected-files.txt

          echo
          if ! diff -u \
            /tmp/expected-files.txt \
            /tmp/actual-files.txt
          then
            echo
            echo "FAIL: functional write-set differs from approved six files"
            exit 1
          fi

          echo "PASS: exactly six approved functional files changed"

      - name: Reverse-audit all base-derived files
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path
          import difflib
          import os
          import subprocess
          import sys

          BASE = os.environ["BASE_SHA"]

          def base_text(path):
              return subprocess.check_output(
                  ["git", "show", f"{BASE}:{path}"],
                  text=True,
              )

          def fail_diff(path, expected, actual):
              print(f"FAIL: unauthorized delta detected in {path}")

              for line in difflib.unified_diff(
                  expected.splitlines(True),
                  actual.splitlines(True),
                  fromfile=f"base/{path}",
                  tofile=f"reconstructed/{path}",
              ):
                  sys.stdout.write(line)

              raise SystemExit(1)

          def compare_to_base(path, reconstructed):
              expected = base_text(path)

              if reconstructed != expected:
                  fail_diff(path, expected, reconstructed)

              print(f"PASS: reverse delta exactly restores base: {path}")

          def remove_unique_line(lines, predicate, label):
              matches = [
                  i for i, line in enumerate(lines)
                  if predicate(line)
              ]

              if len(matches) != 1:
                  raise SystemExit(
                      f"FAIL: {label}: expected exactly one approved "
                      f"line, found {len(matches)}"
                  )

              del lines[matches[0]]

          # ==========================================================
          # 1. constant/proxy.go
          #
          # Candidate -> remove only:
          #   TypeMieru = "mieru"
          #   case TypeMieru:
          #       return "Mieru"
          #
          # After removing those exact approved semantic additions,
          # the file must be byte-for-byte identical to frozen base.
          # ==========================================================

          path = "constant/proxy.go"
          lines = Path(path).read_text().splitlines(keepends=True)

          remove_unique_line(
              lines,
              lambda line:
                  line.strip() == 'TypeMieru              = "mieru"'
                  or (
                      line.strip().startswith("TypeMieru")
                      and line.strip().split("=", 1)[-1].strip()
                          == '"mieru"'
                  ),
              "constant TypeMieru",
          )

          pairs = []

          for i in range(len(lines) - 1):
              if (
                  lines[i].strip() == "case TypeMieru:"
                  and
                  lines[i + 1].strip() == 'return "Mieru"'
              ):
                  pairs.append(i)

          if len(pairs) != 1:
              raise SystemExit(
                  "FAIL: Mieru display case: expected exactly one "
                  f"approved pair, found {len(pairs)}"
              )

          i = pairs[0]
          del lines[i:i + 2]

          compare_to_base(
              path,
              "".join(lines),
          )

          # ==========================================================
          # 2. include/registry.go
          #
          # Candidate -> remove only:
          #   Mieru import
          #   mieru.RegisterOutbound(registry)
          #
          # No inbound removal is performed because inbound must not
          # exist at all.
          # ==========================================================

          path = "include/registry.go"
          lines = Path(path).read_text().splitlines(keepends=True)

          remove_unique_line(
              lines,
              lambda line:
                  line.strip()
                  == '"github.com/sagernet/sing-box/protocol/mieru"',
              "Mieru registry import",
          )

          remove_unique_line(
              lines,
              lambda line:
                  line.strip()
                  == "mieru.RegisterOutbound(registry)",
              "Mieru outbound registration",
          )

          compare_to_base(
              path,
              "".join(lines),
          )

          # ==========================================================
          # 3. go.mod
          #
          # Candidate -> remove only:
          #   github.com/enfein/mieru/v3 v3.36.1
          #
          # Everything else must restore frozen base exactly.
          # ==========================================================

          path = "go.mod"
          lines = Path(path).read_text().splitlines(keepends=True)

          remove_unique_line(
              lines,
              lambda line:
                  line.strip()
                  == "github.com/enfein/mieru/v3 v3.36.1",
              "Mieru go.mod dependency",
          )

          compare_to_base(
              path,
              "".join(lines),
          )

          # ==========================================================
          # 4. go.sum
          #
          # Candidate -> remove only the two approved v3.36.1 sums.
          # Everything else must restore frozen base exactly.
          # ==========================================================

          path = "go.sum"
          lines = Path(path).read_text().splitlines(keepends=True)

          approved_sum_1 = (
              "github.com/enfein/mieru/v3 v3.36.1 "
              "h1:g8iaFf+jNc/MGE3qiGslJ4BPSPTeWPmULa0HIvfhENM="
          )

          approved_sum_2 = (
              "github.com/enfein/mieru/v3 v3.36.1/go.mod "
              "h1:zJBUCsi5rxyvHM8fjFf+GLaEl4OEjjBXr1s5F6Qd3hM="
          )

          remove_unique_line(
              lines,
              lambda line:
                  line.strip() == approved_sum_1,
              "Mieru module checksum",
          )

          remove_unique_line(
              lines,
              lambda line:
                  line.strip() == approved_sum_2,
              "Mieru go.mod checksum",
          )

          compare_to_base(
              path,
              "".join(lines),
          )

          print(
              "PASS: all four base-derived files contain only "
              "the approved Mieru outbound delta"
          )
          PY

      - name: Verify outbound-only option by canonical normalization
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path
          import difflib
          import subprocess
          import sys

          expected = b'''package option

          import "github.com/sagernet/sing/common/json/badoption"

          type MieruOutboundOptions struct {
          \tDialerOptions
          \tServerOptions
          \tServerPortRanges badoption.Listable[string] `json:"server_ports,omitempty"`
          \tTransport        string                     `json:"transport,omitempty"`
          \tUserName         string                     `json:"username,omitempty"`
          \tPassword         string                     `json:"password,omitempty"`
          \tMultiplexing     string                     `json:"multiplexing,omitempty"`
          \tTrafficPattern   string                     `json:"traffic_pattern,omitempty"`
          }
          '''

          candidate = Path("option/mieru.go").read_bytes()

          result = subprocess.run(
              ["gofmt"],
              input=candidate,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
          )

          if result.returncode != 0:
              print("FAIL: option/mieru.go cannot be parsed by gofmt")
              sys.stdout.buffer.write(result.stderr)
              raise SystemExit(1)

          normalized = result.stdout

          if normalized != expected:
              print(
                  "FAIL: option/mieru.go differs from approved "
                  "outbound-only canonical structure"
              )

              expected_text = expected.decode()
              actual_text = normalized.decode()

              for line in difflib.unified_diff(
                  expected_text.splitlines(True),
                  actual_text.splitlines(True),
                  fromfile="approved/option/mieru.go",
                  tofile="candidate/option/mieru.go-normalized",
              ):
                  sys.stdout.write(line)

              raise SystemExit(1)

          print(
              "PASS: option/mieru.go normalizes exactly to "
              "approved outbound-only structure"
          )
          PY

      - name: Reject every Mieru inbound surface
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -e protocol/mieru/inbound.go ]; then
            echo "FAIL: protocol/mieru/inbound.go exists"
            exit 1
          fi

          if grep -Rns \
            --include='*.go' \
            -E \
            'MieruInboundOptions|MieruUser|mieru\.RegisterInbound' \
            constant \
            option \
            protocol \
            include
          then
            echo "FAIL: forbidden Mieru inbound symbol detected"
            exit 1
          fi

          echo "PASS: no Mieru inbound file, option or registration"

      - name: Verify Multipath registration remains present
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -Fq \
            '"github.com/sagernet/sing-box/protocol/multipath"' \
            include/registry.go

          grep -Fq \
            'multipath.RegisterInbound(registry)' \
            include/registry.go

          grep -Fq \
            'multipath.RegisterOutbound(registry)' \
            include/registry.go

          echo "PASS: Multipath inbound/outbound registrations remain present"

      - name: Verify Mieru version and frozen Go directive
        shell: bash
        run: |
          set -Eeuo pipefail

          MIERU_COUNT="$(
            grep -Fxc \
              '	github.com/enfein/mieru/v3 v3.36.1' \
              go.mod ||
            true
          )"

          if [ "${MIERU_COUNT}" -ne 1 ]; then
            echo "FAIL: expected exactly one direct Mieru v3.36.1 dependency"
            exit 1
          fi

          GO_DIRECTIVE="$(
            awk '$1 == "go" { print $2; exit }' go.mod
          )"

          if [ "${GO_DIRECTIVE}" != "${GO_VERSION}" ]; then
            echo "FAIL: go.mod Go directive drifted"
            echo "expected=${GO_VERSION}"
            echo "actual=${GO_DIRECTIVE}"
            exit 1
          fi

          echo "PASS: Mieru=${MIERU_VERSION}"
          echo "PASS: go.mod Go=${GO_VERSION}"

      - name: Fetch frozen Mieru donor
        shell: bash
        run: |
          set -Eeuo pipefail

          DONOR_DIR="${RUNNER_TEMP}/mbox-donor"

          rm -rf "${DONOR_DIR}"

          git init "${DONOR_DIR}"

          git -C "${DONOR_DIR}" \
            remote add origin "${DONOR_REPO}"

          git -C "${DONOR_DIR}" \
            fetch \
            --depth=1 \
            origin "${DONOR_SHA}"

          git -C "${DONOR_DIR}" \
            checkout \
            --detach \
            FETCH_HEAD

          ACTUAL_DONOR_SHA="$(
            git -C "${DONOR_DIR}" rev-parse HEAD
          )"

          if [ "${ACTUAL_DONOR_SHA}" != "${DONOR_SHA}" ]; then
            echo "FAIL: donor SHA mismatch"
            echo "expected=${DONOR_SHA}"
            echo "actual=${ACTUAL_DONOR_SHA}"
            exit 1
          fi

          echo "PASS: frozen donor resolved exactly at ${DONOR_SHA}"

      - name: Byte-compare Mieru outbound with frozen donor
        shell: bash
        run: |
          set -Eeuo pipefail

          DONOR_FILE="${
            RUNNER_TEMP
          }/mbox-donor/protocol/mieru/outbound.go"

          if ! cmp \
            protocol/mieru/outbound.go \
            "${DONOR_FILE}"
          then
            echo "FAIL: Mieru outbound differs from frozen donor"

            diff -u \
              "${DONOR_FILE}" \
              protocol/mieru/outbound.go \
              || true

            exit 1
          fi

          echo "=== CANDIDATE SHA256 ==="
          sha256sum protocol/mieru/outbound.go

          echo "=== DONOR SHA256 ==="
          sha256sum "${DONOR_FILE}"

          echo "PASS: outbound.go is byte-identical to frozen donor"

      - name: Check source patch whitespace
        shell: bash
        run: |
          set -Eeuo pipefail

          git diff \
            --check \
            "${BASE_SHA}..HEAD" \
            -- \
            constant/proxy.go \
            include/registry.go \
            option/mieru.go \
            protocol/mieru/outbound.go \
            go.mod \
            go.sum

          echo "PASS: approved source delta has no whitespace errors"

      - name: Verify module checksums
        shell: bash
        run: |
          set -Eeuo pipefail

          go mod download

          go mod verify

          echo "PASS: go mod verify"

      - name: Verify module graph is tidy without mutation
        shell: bash
        run: |
          set -Eeuo pipefail

          cp go.mod /tmp/go.mod.before
          cp go.sum /tmp/go.sum.before

          go mod tidy -diff

          if ! cmp -s go.mod /tmp/go.mod.before; then
            echo "FAIL: go mod tidy mutated go.mod"
            git diff -- go.mod
            exit 1
          fi

          if ! cmp -s go.sum /tmp/go.sum.before; then
            echo "FAIL: go mod tidy mutated go.sum"
            git diff -- go.sum
            exit 1
          fi

          echo "PASS: Go module graph is tidy and source was not mutated"

      - name: Compile Mieru and registry packages
        shell: bash
        run: |
          set -Eeuo pipefail

          go test \
            ./protocol/mieru \
            ./include

          echo "PASS: Mieru outbound and registry package graph compiles"

      - name: Final audit source cleanliness
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: audit operations modified the source checkout"
            git status --short
            git diff
            exit 1
          fi

          echo "PASS: audit left source checkout untouched"

  build-darwin-amd64:
    name: Build macOS Intel
    needs:
      - audit

    runs-on: macos-15-intel

    steps:
      - name: Checkout exact audited source SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.audit.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup frozen Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          check-latest: false

      - name: Verify audited checkout and build inputs
        shell: bash
        run: |
          set -Eeuo pipefail

          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="${{ needs.audit.outputs.source_sha }}"

          if [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "FAIL: Darwin checkout differs from audited SHA"
            echo "expected=${EXPECTED_SHA}"
            echo "actual=${ACTUAL_SHA}"
            exit 1
          fi

          ACTUAL_GO="$(
            go version |
            awk '{print $3}' |
            sed 's/^go//'
          )"

          if [ "${ACTUAL_GO}" != "${GO_VERSION}" ]; then
            echo "FAIL: Darwin Go version mismatch"
            exit 1
          fi

          BUILD_TAGS="$(cat release/DEFAULT_BUILD_TAGS)"
          LDFLAGS_SHARED="$(cat release/LDFLAGS)"

          {
            echo "AUDITED_SOURCE_SHA=${ACTUAL_SHA}"
            echo "BUILD_TAGS=${BUILD_TAGS}"
            echo "LDFLAGS_SHARED=${LDFLAGS_SHARED}"
          } >> "${GITHUB_ENV}"

          echo "source_sha=${ACTUAL_SHA}"
          echo "go_version=${ACTUAL_GO}"
          echo "build_tags=${BUILD_TAGS}"
          echo "ldflags=${LDFLAGS_SHARED}"

      - name: Build darwin amd64
        shell: bash
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: "1"
        run: |
          set -Eeuo pipefail

          mkdir -p dist

          go build \
            -v \
            -trimpath \
            -o dist/sing-box \
            -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${BUILD_VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

      - name: Verify Darwin binary architecture
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=== FILE ==="
          file dist/sing-box

          echo "=== MACH-O ARCHITECTURE ==="
          ARCHS="$(lipo -archs dist/sing-box)"
          echo "${ARCHS}"

          if [ "${ARCHS}" != "x86_64" ]; then
            echo "FAIL: expected a single x86_64 Mach-O binary"
            exit 1
          fi

          echo "=== VERSION ==="
          ./dist/sing-box version

          echo "PASS: Darwin Intel binary executes successfully"

      - name: Package Darwin artifact
        shell: bash
        run: |
          set -Eeuo pipefail

          DIR_NAME="sing-box-${BUILD_VERSION}-darwin-amd64"
          PACKAGE_DIR="package/${DIR_NAME}"

          mkdir -p "${PACKAGE_DIR}"

          cp dist/sing-box \
            "${PACKAGE_DIR}/sing-box"

          cp LICENSE \
            "${PACKAGE_DIR}/LICENSE"

          BINARY_SHA="$(
            shasum -a 256 "${PACKAGE_DIR}/sing-box" |
            awk '{print $1}'
          )"

          printf '%s  %s\n' \
            "${BINARY_SHA}" \
            "sing-box" \
            > "${PACKAGE_DIR}/SHA256SUMS"

          {
            echo "project=singbox-multipath"
            echo "variant=multipath-mieru-beta6"
            echo "source_ref=${SOURCE_REF}"
            echo "source_sha=${AUDITED_SOURCE_SHA}"
            echo "base_sha=${BASE_SHA}"
            echo "donor_sha=${DONOR_SHA}"
            echo "mieru_version=${MIERU_VERSION}"
            echo "go_version=${GO_VERSION}"
            echo "build_version=${BUILD_VERSION}"
            echo "goos=darwin"
            echo "goarch=amd64"
            echo "cgo_enabled=1"
            echo "runner=macos-15-intel"
            echo "build_tags=${BUILD_TAGS}"
            echo "ldflags=${LDFLAGS_SHARED}"
            echo "binary_sha256=${BINARY_SHA}"
          } > "${PACKAGE_DIR}/BUILD-MANIFEST.txt"

          tar \
            -C package \
            -czf "${DIR_NAME}.tar.gz" \
            "${DIR_NAME}"

          ARCHIVE_SHA="$(
            shasum -a 256 "${DIR_NAME}.tar.gz" |
            awk '{print $1}'
          )"

          printf '%s  %s\n' \
            "${ARCHIVE_SHA}" \
            "${DIR_NAME}.tar.gz" \
            > "${DIR_NAME}.tar.gz.sha256"

          echo "=== BINARY SHA256 ==="
          echo "${BINARY_SHA}"

          echo "=== ARCHIVE SHA256 ==="
          cat "${DIR_NAME}.tar.gz.sha256"

      - name: Upload Darwin artifact
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-${{ env.BUILD_VERSION }}-darwin-amd64
          path: |
            sing-box-${{ env.BUILD_VERSION }}-darwin-amd64.tar.gz
            sing-box-${{ env.BUILD_VERSION }}-darwin-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  build-windows-amd64:
    name: Build Windows amd64
    needs:
      - audit

    runs-on: windows-2025

    steps:
      - name: Checkout exact audited source SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.audit.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup frozen Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          check-latest: false

      - name: Verify audited checkout and build inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $actualSha = (git rev-parse HEAD).Trim()
          $expectedSha = "${{ needs.audit.outputs.source_sha }}"

          if ($actualSha -ne $expectedSha) {
            throw "Windows checkout differs from audited SHA"
          }

          $actualGo = (
            (go version).Split(" ")[2] -replace "^go", ""
          ).Trim()

          if ($actualGo -ne $env:GO_VERSION) {
            throw (
              "Windows Go version mismatch: expected={0}, actual={1}" -f `
              $env:GO_VERSION, $actualGo
            )
          }

          $tags = (
            Get-Content release/DEFAULT_BUILD_TAGS_WINDOWS -Raw
          ).Trim()

          $ldflags = (
            Get-Content release/LDFLAGS -Raw
          ).Trim()

          "AUDITED_SOURCE_SHA=$actualSha" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "BUILD_TAGS=$tags" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "LDFLAGS_SHARED=$ldflags" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "source_sha=$actualSha"
          Write-Host "go_version=$actualGo"
          Write-Host "build_tags=$tags"
          Write-Host "ldflags=$ldflags"

      - name: Build windows amd64
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path dist |
            Out-Null

          go build `
            -v `
            -trimpath `
            -o dist/sing-box.exe `
            -tags "$env:BUILD_TAGS" `
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=$env:BUILD_VERSION' $env:LDFLAGS_SHARED -s -w -buildid=" `
            ./cmd/sing-box

          if ($LASTEXITCODE -ne 0) {
            throw "Windows go build failed"
          }

      - name: Extract frozen libcronet.dll
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cronetVersion = (
            Get-Content .github/CRONET_GO_VERSION -Raw
          ).Trim()

          if (
            $cronetVersion -notmatch '^[0-9a-f]{40}$'
          ) {
            throw "Invalid CRONET_GO_VERSION commit"
          }

          $libraryPath = "lib/windows_amd64/libcronet.dll"
          $cronetDir = Join-Path $env:RUNNER_TEMP "cronet-go-lib"

          if (Test-Path $cronetDir) {
            Remove-Item `
              -Recurse `
              -Force `
              $cronetDir
          }

          git init $cronetDir

          if ($LASTEXITCODE -ne 0) {
            throw "git init cronet-go-lib failed"
          }

          git -C $cronetDir remote add origin `
            https://github.com/sagernet/cronet-go.git

          git -C $cronetDir sparse-checkout set `
            --no-cone `
            "/$libraryPath"

          git -C $cronetDir fetch `
            --depth=1 `
            --filter=blob:none `
            origin `
            $cronetVersion

          if ($LASTEXITCODE -ne 0) {
            throw "fetching frozen cronet-go commit failed"
          }

          git -C $cronetDir checkout `
            --detach `
            FETCH_HEAD

          if ($LASTEXITCODE -ne 0) {
            throw "checking out frozen cronet-go commit failed"
          }

          $actualCronetSha = (
            git -C $cronetDir rev-parse HEAD
          ).Trim()

          if ($actualCronetSha -ne $cronetVersion) {
            throw (
              "Cronet SHA mismatch: expected={0}, actual={1}" -f `
              $cronetVersion, $actualCronetSha
            )
          }

          $sourceDll = Join-Path `
            $cronetDir `
            $libraryPath

          if (-not (Test-Path $sourceDll)) {
            throw "Frozen libcronet.dll not found"
          }

          Copy-Item `
            $sourceDll `
            dist/libcronet.dll

          "CRONET_GO_VERSION=$cronetVersion" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "cronet_go_version=$cronetVersion"

      - name: Verify Windows PE amd64 binary and runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $path = (
            Resolve-Path "dist/sing-box.exe"
          ).Path

          $bytes = [System.IO.File]::ReadAllBytes($path)

          if ($bytes.Length -lt 64) {
            throw "PE file is unexpectedly small"
          }

          $peOffset = [BitConverter]::ToInt32(
            $bytes,
            0x3c
          )

          if (
            $peOffset -lt 0 -or
            ($peOffset + 6) -ge $bytes.Length
          ) {
            throw "Invalid PE header offset"
          }

          $signature = [BitConverter]::ToUInt32(
            $bytes,
            $peOffset
          )

          if ($signature -ne 0x00004550) {
            throw "Invalid PE signature"
          }

          $machine = [BitConverter]::ToUInt16(
            $bytes,
            $peOffset + 4
          )

          if ($machine -ne 0x8664) {
            throw (
              "Unexpected PE machine: 0x{0:X4}" -f $machine
            )
          }

          if (-not (Test-Path "dist/libcronet.dll")) {
            throw "libcronet.dll is missing"
          }

          Write-Host "PASS: PE machine is AMD64 (0x8664)"

          Write-Host "=== VERSION ==="

          & .\dist\sing-box.exe version

          if ($LASTEXITCODE -ne 0) {
            throw "sing-box.exe version failed"
          }

          Write-Host "PASS: Windows AMD64 binary executes successfully"

      - name: Package Windows artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dirName = (
            "sing-box-{0}-windows-amd64" -f `
            $env:BUILD_VERSION
          )

          $packageRoot = Join-Path `
            "package" `
            $dirName

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $packageRoot |
            Out-Null

          Copy-Item `
            dist/sing-box.exe `
            (Join-Path $packageRoot "sing-box.exe")

          Copy-Item `
            dist/libcronet.dll `
            (Join-Path $packageRoot "libcronet.dll")

          Copy-Item `
            LICENSE `
            (Join-Path $packageRoot "LICENSE")

          $binaryHash = (
            Get-FileHash `
              (Join-Path $packageRoot "sing-box.exe") `
              -Algorithm SHA256
          ).Hash.ToLower()

          $cronetHash = (
            Get-FileHash `
              (Join-Path $packageRoot "libcronet.dll") `
              -Algorithm SHA256
          ).Hash.ToLower()

          @(
            "$binaryHash  sing-box.exe"
            "$cronetHash  libcronet.dll"
          ) |
            Set-Content `
              -Path (
                Join-Path $packageRoot "SHA256SUMS"
              ) `
              -Encoding ascii

          @(
            "project=singbox-multipath"
            "variant=multipath-mieru-beta6"
            "source_ref=$env:SOURCE_REF"
            "source_sha=$env:AUDITED_SOURCE_SHA"
            "base_sha=$env:BASE_SHA"
            "donor_sha=$env:DONOR_SHA"
            "mieru_version=$env:MIERU_VERSION"
            "go_version=$env:GO_VERSION"
            "build_version=$env:BUILD_VERSION"
            "goos=windows"
            "goarch=amd64"
            "cgo_enabled=0"
            "runner=windows-2025"
            "build_tags=$env:BUILD_TAGS"
            "ldflags=$env:LDFLAGS_SHARED"
            "cronet_go_version=$env:CRONET_GO_VERSION"
            "binary_sha256=$binaryHash"
            "libcronet_sha256=$cronetHash"
          ) |
            Set-Content `
              -Path (
                Join-Path $packageRoot "BUILD-MANIFEST.txt"
              ) `
              -Encoding ascii

          $archive = "$dirName.zip"

          Compress-Archive `
            -Path $packageRoot `
            -DestinationPath $archive `
            -Force

          $archiveHash = (
            Get-FileHash `
              $archive `
              -Algorithm SHA256
          ).Hash.ToLower()

          "$archiveHash  $archive" |
            Set-Content `
              -Path "$archive.sha256" `
              -Encoding ascii

          Write-Host "=== BINARY SHA256 ==="
          Write-Host $binaryHash

          Write-Host "=== LIBCRONET SHA256 ==="
          Write-Host $cronetHash

          Write-Host "=== ARCHIVE SHA256 ==="
          Get-Content "$archive.sha256"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-${{ env.BUILD_VERSION }}-windows-amd64
          path: |
            sing-box-${{ env.BUILD_VERSION }}-windows-amd64.zip
            sing-box-${{ env.BUILD_VERSION }}-windows-amd64.zip.sha256
          if-no-files-found: error
          retention-days: 30
