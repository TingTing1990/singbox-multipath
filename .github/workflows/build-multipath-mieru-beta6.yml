name: Build Multipath + Mieru beta6

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-multipath-mieru-beta6-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_SHA: 31970756db5fd37d9e4080734dfeed9ffd5ceefd
  DONOR_REPO: https://github.com/enfein/mbox.git
  DONOR_SHA: 7300c5fc048ce99306f2eda3d63c2c7bda389177
  MIERU_VERSION: v3.36.1
  GO_VERSION: 1.25.5
  BUILD_VERSION: 1.14.0-multipath-mieru-beta6

jobs:
  audit:
    name: Static source audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Show source identity
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=== SOURCE ==="
          git rev-parse HEAD

          echo "=== BASE ==="
          echo "${BASE_SHA}"

          echo "=== DONOR ==="
          echo "${DONOR_SHA}"

          echo "=== GO ==="
          go version

      - name: Verify base ancestry
        shell: bash
        run: |
          set -Eeuo pipefail

          git cat-file -e "${BASE_SHA}^{commit}"

          git merge-base --is-ancestor "${BASE_SHA}" HEAD

          echo "PASS: candidate descends from frozen base ${BASE_SHA}"

      - name: Verify exact allowed source delta
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t changed < <(
            git diff --name-only "${BASE_SHA}..HEAD" |
            grep -v '^\.github/workflows/build-multipath-mieru-beta6\.yml$' |
            sort
          )

          printf '%s\n' "${changed[@]}" > /tmp/changed-files.txt

          cat > /tmp/expected-files.txt <<'EOF'
          constant/proxy.go
          go.mod
          go.sum
          include/registry.go
          option/mieru.go
          protocol/mieru/outbound.go
          EOF

          sort -o /tmp/expected-files.txt /tmp/expected-files.txt

          echo "=== ACTUAL SOURCE DELTA ==="
          cat /tmp/changed-files.txt

          echo
          echo "=== EXPECTED SOURCE DELTA ==="
          cat /tmp/expected-files.txt

          diff -u /tmp/expected-files.txt /tmp/changed-files.txt

          echo "PASS: source write-set is exactly the approved six files"

      - name: Reject Mieru inbound
        shell: bash
        run: |
          set -Eeuo pipefail

          test ! -e protocol/mieru/inbound.go

          if grep -Rns \
            --include='*.go' \
            -E 'MieruInboundOptions|MieruUser|mieru\.RegisterInbound' \
            constant option protocol include
          then
            echo "FAIL: Mieru inbound implementation detected"
            exit 1
          fi

          echo "PASS: no Mieru inbound implementation or registration"

      - name: Verify Mieru constant and outbound registration
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -Fq 'TypeMieru = "mieru"' constant/proxy.go
          grep -Fq 'type MieruOutboundOptions struct {' option/mieru.go
          grep -Fq '"github.com/sagernet/sing-box/protocol/mieru"' include/registry.go
          grep -Fq 'mieru.RegisterOutbound(registry)' include/registry.go

          echo "PASS: Mieru outbound surface is registered"

      - name: Verify Multipath registration preserved
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -Fq '"github.com/sagernet/sing-box/protocol/multipath"' include/registry.go
          grep -Fq 'multipath.RegisterInbound(registry)' include/registry.go
          grep -Fq 'multipath.RegisterOutbound(registry)' include/registry.go

          echo "PASS: Multipath registry remains present"

      - name: Verify Mieru dependency pin
        shell: bash
        run: |
          set -Eeuo pipefail

          expected='github.com/enfein/mieru/v3 v3.36.1'

          count="$(grep -Fc "${expected}" go.mod)"

          if [ "${count}" -ne 1 ]; then
            echo "FAIL: expected exactly one Mieru v3.36.1 go.mod entry"
            exit 1
          fi

          grep -Fq \
            'github.com/enfein/mieru/v3 v3.36.1 h1:g8iaFf+jNc/MGE3qiGslJ4BPSPTeWPmULa0HIvfhENM=' \
            go.sum

          grep -Fq \
            'github.com/enfein/mieru/v3 v3.36.1/go.mod h1:zJBUCsi5rxyvHM8fjFf+GLaEl4OEjjBXr1s5F6Qd3hM=' \
            go.sum

          echo "PASS: Mieru dependency pin and checksums match frozen version"

      - name: Verify Go version directive
        shell: bash
        run: |
          set -Eeuo pipefail

          version="$(awk '$1 == "go" { print $2; exit }' go.mod)"

          test "${version}" = "${GO_VERSION}"

          echo "PASS: go.mod remains pinned to Go ${GO_VERSION}"

      - name: Fetch frozen donor
        shell: bash
        run: |
          set -Eeuo pipefail

          git init "${RUNNER_TEMP}/mbox-donor"
          git -C "${RUNNER_TEMP}/mbox-donor" remote add origin "${DONOR_REPO}"

          git -C "${RUNNER_TEMP}/mbox-donor" fetch \
            --depth=1 \
            origin "${DONOR_SHA}"

          git -C "${RUNNER_TEMP}/mbox-donor" checkout --detach FETCH_HEAD

          test "$(
            git -C "${RUNNER_TEMP}/mbox-donor" rev-parse HEAD
          )" = "${DONOR_SHA}"

      - name: Byte-compare Mieru outbound with donor
        shell: bash
        run: |
          set -Eeuo pipefail

          cmp \
            protocol/mieru/outbound.go \
            "${RUNNER_TEMP}/mbox-donor/protocol/mieru/outbound.go"

          echo "PASS: protocol/mieru/outbound.go is byte-identical to donor"

      - name: Verify outbound option is donor outbound-only subset
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import os

          candidate = Path("option/mieru.go").read_text()
          donor_path = Path(os.environ["RUNNER_TEMP"]) / "mbox-donor/option/mieru.go"
          donor = donor_path.read_text()

          m = re.search(
              r'type MieruOutboundOptions struct \{.*?\n\}',
              donor,
              flags=re.S,
          )

          if not m:
              raise SystemExit("FAIL: donor MieruOutboundOptions not found")

          donor_block = m.group(0)

          if donor_block not in candidate:
              raise SystemExit(
                  "FAIL: candidate MieruOutboundOptions differs from donor"
              )

          forbidden = (
              "MieruInboundOptions",
              "MieruUser",
          )

          for token in forbidden:
              if token in candidate:
                  raise SystemExit(
                      f"FAIL: forbidden inbound symbol present: {token}"
                  )

          print("PASS: option/mieru.go contains donor outbound options only")
          PY

      - name: Check gofmt without modifying source
        shell: bash
        run: |
          set -Eeuo pipefail

          bad="$(
            gofmt -l \
              constant/proxy.go \
              option/mieru.go \
              protocol/mieru/outbound.go \
              include/registry.go
          )"

          if [ -n "${bad}" ]; then
            echo "FAIL: gofmt differences detected:"
            echo "${bad}"
            exit 1
          fi

          echo "PASS: gofmt clean"

      - name: Check whitespace errors
        shell: bash
        run: |
          set -Eeuo pipefail

          git diff --check "${BASE_SHA}..HEAD"

          echo "PASS: git diff --check clean"

      - name: Verify Go modules
        shell: bash
        run: |
          set -Eeuo pipefail

          go mod verify

      - name: Check go mod tidy without modifying source
        shell: bash
        run: |
          set -Eeuo pipefail

          cp go.mod /tmp/go.mod.before
          cp go.sum /tmp/go.sum.before

          go mod tidy

          if ! cmp -s go.mod /tmp/go.mod.before; then
            echo "FAIL: go mod tidy changes go.mod"
            git diff -- go.mod
            exit 1
          fi

          if ! cmp -s go.sum /tmp/go.sum.before; then
            echo "FAIL: go mod tidy changes go.sum"
            git diff -- go.sum
            exit 1
          fi

          echo "PASS: go mod tidy is clean"

      - name: Compile package graph
        shell: bash
        run: |
          set -Eeuo pipefail

          go test ./protocol/mieru ./option ./constant

  build-darwin-amd64:
    name: Build macOS Intel
    needs:
      - audit

    runs-on: macos-15-intel

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set build metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          echo "BUILD_TAGS=$(cat release/DEFAULT_BUILD_TAGS)" >> "${GITHUB_ENV}"
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "${GITHUB_ENV}"

      - name: Build darwin amd64
        shell: bash
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: "1"
        run: |
          set -Eeuo pipefail

          mkdir -p dist

          go build \
            -v \
            -trimpath \
            -o dist/sing-box \
            -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${BUILD_VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

      - name: Verify binary
        shell: bash
        run: |
          set -Eeuo pipefail

          file dist/sing-box
          ./dist/sing-box version

      - name: Create manifest and SHA256
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p package

          cp dist/sing-box package/sing-box
          cp LICENSE package/LICENSE

          shasum -a 256 package/sing-box \
            | tee package/SHA256SUMS

          {
            echo "project=singbox-multipath"
            echo "variant=multipath-mieru-beta6"
            echo "source_sha=${SOURCE_SHA}"
            echo "base_sha=${BASE_SHA}"
            echo "donor_sha=${DONOR_SHA}"
            echo "mieru_version=${MIERU_VERSION}"
            echo "go_version=${GO_VERSION}"
            echo "build_version=${BUILD_VERSION}"
            echo "goos=darwin"
            echo "goarch=amd64"
            echo "cgo_enabled=1"
            echo "runner=macos-15-intel"
            echo "build_tags=${BUILD_TAGS}"
            echo "ldflags=${LDFLAGS_SHARED}"
          } > package/BUILD-MANIFEST.txt

          tar -C package \
            -czf sing-box-${BUILD_VERSION}-darwin-amd64.tar.gz \
            .

          shasum -a 256 \
            sing-box-${BUILD_VERSION}-darwin-amd64.tar.gz \
            > sing-box-${BUILD_VERSION}-darwin-amd64.tar.gz.sha256

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ env.BUILD_VERSION }}-darwin-amd64
          path: |
            sing-box-${{ env.BUILD_VERSION }}-darwin-amd64.tar.gz
            sing-box-${{ env.BUILD_VERSION }}-darwin-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  build-windows-amd64:
    name: Build Windows amd64
    needs:
      - audit

    runs-on: windows-2025

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set build metadata
        run: |
          set -Eeuo pipefail

          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          echo "BUILD_TAGS=$(cat release/DEFAULT_BUILD_TAGS_WINDOWS)" >> "${GITHUB_ENV}"
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "${GITHUB_ENV}"

      - name: Build windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          set -Eeuo pipefail

          mkdir -p dist

          go build \
            -v \
            -trimpath \
            -o dist/sing-box.exe \
            -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${BUILD_VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

      - name: Verify PE binary
        run: |
          set -Eeuo pipefail

          file dist/sing-box.exe

          powershell.exe -NoProfile -Command \
            "& '.\\dist\\sing-box.exe' version"

      - name: Create manifest and SHA256
        run: |
          set -Eeuo pipefail

          mkdir -p package

          cp dist/sing-box.exe package/sing-box.exe
          cp LICENSE package/LICENSE

          sha256sum package/sing-box.exe \
            | tee package/SHA256SUMS

          {
            echo "project=singbox-multipath"
            echo "variant=multipath-mieru-beta6"
            echo "source_sha=${SOURCE_SHA}"
            echo "base_sha=${BASE_SHA}"
            echo "donor_sha=${DONOR_SHA}"
            echo "mieru_version=${MIERU_VERSION}"
            echo "go_version=${GO_VERSION}"
            echo "build_version=${BUILD_VERSION}"
            echo "goos=windows"
            echo "goarch=amd64"
            echo "cgo_enabled=0"
            echo "runner=windows-2025"
            echo "build_tags=${BUILD_TAGS}"
            echo "ldflags=${LDFLAGS_SHARED}"
          } > package/BUILD-MANIFEST.txt

          powershell.exe -NoProfile -Command \
            "Compress-Archive -Path package\\* -DestinationPath 'sing-box-${BUILD_VERSION}-windows-amd64.zip' -Force"

          sha256sum \
            sing-box-${BUILD_VERSION}-windows-amd64.zip \
            > sing-box-${BUILD_VERSION}-windows-amd64.zip.sha256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ env.BUILD_VERSION }}-windows-amd64
          path: |
            sing-box-${{ env.BUILD_VERSION }}-windows-amd64.zip
            sing-box-${{ env.BUILD_VERSION }}-windows-amd64.zip.sha256
          if-no-files-found: error
          retention-days: 30
