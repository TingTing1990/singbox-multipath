name: Build SFA Android arm64-v8a Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: sing-box fork branch/tag/commit to build
        required: true
        default: feature/multipath-capacity-v2-beta6
        type: string
      signing_mode:
        description: Release signing mode
        required: true
        default: generate
        type: choice
        options:
          - generate
          - reuse

permissions:
  contents: read

concurrency:
  group: sfa-android-arm64-v8a-${{ inputs.source_ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.14.0-multipath-beta6
  GO_VERSION: '1.26.7'
  SFA_COMMIT: 5d5479d8bb60f7eb45e86402a8aa3a6131dd9ba3
  PACKAGE_ID: custom.singbox.sfa
  APP_NAME: SFA
  TARGET_ABI: arm64-v8a
  GO_ARCH: arm64

jobs:
  build_libbox:
    name: Build Android library (arm64)
    runs-on: ubuntu-latest
    outputs:
      core_commit: ${{ steps.identity.outputs.core_commit }}
    steps:
      - name: Checkout requested sing-box fork source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false
          path: sing-box

      - name: Resolve exact core commit
        id: identity
        shell: bash
        run: |-
          set -euo pipefail
          CORE_COMMIT="$(git -C sing-box rev-parse HEAD)"
          test -n "$CORE_COMMIT"
          echo "core_commit=$CORE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "CORE_COMMIT=$CORE_COMMIT" >> "$GITHUB_ENV"
          printf 'core_commit=%s\n' "$CORE_COMMIT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Setup OpenJDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set core version tag
        shell: bash
        run: |-
          set -euo pipefail
          git -C sing-box tag -f "v${APP_VERSION}" "$CORE_COMMIT"
          test "$(git -C sing-box describe --tags --exact-match HEAD)" = "v${APP_VERSION}"

      - name: Build libbox using upstream sing-box Android flow
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |-
          set -euo pipefail
          cd sing-box
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -platform android/${GO_ARCH}
          test -s libbox.aar
          test -s libbox-legacy.aar
          mkdir -p dist/${GO_ARCH}
          mv libbox.aar libbox-legacy.aar dist/${GO_ARCH}/
          sha256sum dist/${GO_ARCH}/libbox.aar dist/${GO_ARCH}/libbox-legacy.aar

      - name: Upload arm64 libbox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libbox-android-arm64
          path: sing-box/dist/arm64
          if-no-files-found: error
          compression-level: 0

  build_sfa:
    name: Build SFA OtherRelease (arm64-v8a)
    runs-on: ubuntu-latest
    needs:
      - build_libbox
    steps:
      - name: Checkout exact sing-box fork commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ needs.build_libbox.outputs.core_commit }}
          fetch-depth: 1
          persist-credentials: false
          path: sing-box

      - name: Checkout matching upstream SFA v1.14.0
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: SagerNet/sing-box-for-android
          ref: ${{ env.SFA_COMMIT }}
          fetch-depth: 1
          persist-credentials: false
          path: sing-box-for-android

      - name: Checkout SFA nested submodules
        shell: bash
        run: |-
          set -euo pipefail
          test "$(git -C sing-box-for-android rev-parse HEAD)" = "$SFA_COMMIT"
          git -C sing-box-for-android submodule update --init --recursive -v

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Setup OpenJDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Verify upstream SFA 1.14.0 baseline
        shell: bash
        run: |-
          set -euo pipefail
          grep -Fx 'VERSION_CODE=730' sing-box-for-android/version.properties
          grep -Fx 'VERSION_NAME=1.14.0' sing-box-for-android/version.properties
          grep -Fx 'GO_VERSION=go1.26.7' sing-box-for-android/version.properties
          grep -F 'namespace = "io.nekohasekai.sfa"' sing-box-for-android/app/build.gradle.kts
          grep -F 'applicationId = "io.nekohasekai.sfa"' sing-box-for-android/app/build.gradle.kts
          grep -F 'minSdk = 24' sing-box-for-android/app/build.gradle.kts
          grep -F 'ndkVersion = "28.0.13004108"' sing-box-for-android/app/build.gradle.kts
          grep -F 'include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")' sing-box-for-android/app/build.gradle.kts
          grep -F '<string name="app_name" translatable="false">sing-box</string>' sing-box-for-android/app/src/main/res/values/strings.xml

      - name: Set core version tag
        shell: bash
        run: |-
          set -euo pipefail
          CORE_COMMIT="${{ needs.build_libbox.outputs.core_commit }}"
          git -C sing-box tag -f "v${APP_VERSION}" "$CORE_COMMIT"
          test "$(git -C sing-box describe --tags --exact-match HEAD)" = "v${APP_VERSION}"

      - name: Download arm64 libbox artifacts
        uses: actions/download-artifact@v4
        with:
          name: libbox-android-arm64
          path: libbox-inputs

      - name: Prepare libbox and version using upstream helpers
        shell: bash
        run: |-
          set -euo pipefail
          test -s libbox-inputs/libbox.aar
          test -s libbox-inputs/libbox-legacy.aar
          mkdir -p sing-box-for-android/app/libs
          cp libbox-inputs/libbox.aar sing-box-for-android/app/libs/libbox.aar
          cp libbox-inputs/libbox-legacy.aar sing-box-for-android/app/libs/libbox-legacy.aar
          (
            cd sing-box
            go run -v ./cmd/internal/update_android_version
          )
          grep -Fx "VERSION_NAME=${APP_VERSION}" sing-box-for-android/version.properties
          grep -Fx 'VERSION_CODE=731' sing-box-for-android/version.properties
          grep -Fx 'GO_VERSION=go1.26.7' sing-box-for-android/version.properties

      - name: Apply only required SFA packaging deltas
        shell: bash
        run: |-
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          gradle = Path('sing-box-for-android/app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          replacements = [
              ('applicationId = "io.nekohasekai.sfa"', 'applicationId = "custom.singbox.sfa"'),
              ('isUniversalApk = true', 'isUniversalApk = false'),
              ('include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")', 'include("arm64-v8a")'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected SFA baseline for {old!r}: count={text.count(old)}')
              text = text.replace(old, new, 1)
          gradle.write_text(text, encoding='utf-8')

          strings = Path('sing-box-for-android/app/src/main/res/values/strings.xml')
          text = strings.read_text(encoding='utf-8')
          old = '<string name="app_name" translatable="false">sing-box</string>'
          new = '<string name="app_name" translatable="false">SFA</string>'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected app_name baseline: count={text.count(old)}')
          strings.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          grep -F 'namespace = "io.nekohasekai.sfa"' sing-box-for-android/app/build.gradle.kts
          grep -F 'applicationId = "custom.singbox.sfa"' sing-box-for-android/app/build.gradle.kts
          grep -F 'minSdk = 24' sing-box-for-android/app/build.gradle.kts
          grep -F 'isUniversalApk = false' sing-box-for-android/app/build.gradle.kts
          grep -F 'include("arm64-v8a")' sing-box-for-android/app/build.gradle.kts
          grep -F '<string name="app_name" translatable="false">SFA</string>' sing-box-for-android/app/src/main/res/values/strings.xml

      - name: Prepare persistent release signing
        id: signing
        shell: bash
        env:
          SIGNING_MODE: ${{ inputs.signing_mode }}
          EXISTING_KEYSTORE_B64: ${{ secrets.SFA_KEYSTORE_B64 }}
          EXISTING_LOCAL_PROPERTIES_B64: ${{ secrets.SFA_LOCAL_PROPERTIES_B64 }}
        run: |-
          set -euo pipefail
          KEYSTORE="$GITHUB_WORKSPACE/sing-box-for-android/app/release.keystore"
          PROPS="$RUNNER_TEMP/sfa-signing.properties"
          BACKUP="$RUNNER_TEMP/sfa-signing-backup"
          rm -rf "$BACKUP" "$KEYSTORE" "$PROPS"
          mkdir -p "$BACKUP"

          case "$SIGNING_MODE" in
            generate)
              STORE_PASS="$(openssl rand -hex 32)"
              ALIAS_NAME='sfa-release'
              echo "::add-mask::$STORE_PASS"
              keytool -genkeypair \
                -keystore "$KEYSTORE" \
                -storetype JKS \
                -storepass "$STORE_PASS" \
                -keypass "$STORE_PASS" \
                -alias "$ALIAS_NAME" \
                -keyalg RSA \
                -keysize 4096 \
                -validity 36500 \
                -dname 'CN=SFA Custom Release, OU=Personal, O=Personal, L=Local, ST=Local, C=US' \
                -noprompt >/dev/null
              {
                printf 'KEYSTORE_PASS=%s\n' "$STORE_PASS"
                printf 'ALIAS_NAME=%s\n' "$ALIAS_NAME"
                printf 'ALIAS_PASS=%s\n' "$STORE_PASS"
              } > "$PROPS"
              cp "$KEYSTORE" "$BACKUP/release.keystore"
              cp "$PROPS" "$BACKUP/local.properties"
              chmod 600 "$BACKUP/release.keystore" "$BACKUP/local.properties"
              echo 'generated=true' >> "$GITHUB_OUTPUT"
              ;;
            reuse)
              test -n "$EXISTING_KEYSTORE_B64"
              test -n "$EXISTING_LOCAL_PROPERTIES_B64"
              printf '%s' "$EXISTING_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
              printf '%s' "$EXISTING_LOCAL_PROPERTIES_B64" | base64 --decode > "$PROPS"
              echo 'generated=false' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "invalid signing_mode=$SIGNING_MODE" >&2
              exit 1
              ;;
          esac

          test -s "$KEYSTORE"
          test -s "$PROPS"
          eval "$(python3 - "$PROPS" <<'PY'
          import shlex, sys
          from pathlib import Path
          values = {}
          for raw in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              if '=' not in raw or raw.lstrip().startswith('#'):
                  continue
              key, value = raw.split('=', 1)
              values[key.strip()] = value.strip()
          for key in ('KEYSTORE_PASS', 'ALIAS_NAME', 'ALIAS_PASS'):
              if not values.get(key):
                  raise SystemExit(f'missing {key}')
          print('KS_PASS=' + shlex.quote(values['KEYSTORE_PASS']))
          print('KS_ALIAS=' + shlex.quote(values['ALIAS_NAME']))
          print('KS_KEY_PASS=' + shlex.quote(values['ALIAS_PASS']))
          PY
          )"
          echo "::add-mask::$KS_PASS"
          echo "::add-mask::$KS_KEY_PASS"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$KS_PASS" \
            -alias "$KS_ALIAS" >/dev/null

          KEYCHECK="$RUNNER_TEMP/sfa-signing-key-check.p12"
          rm -f "$KEYCHECK"
          keytool -importkeystore \
            -srckeystore "$KEYSTORE" \
            -srcstorepass "$KS_PASS" \
            -srcalias "$KS_ALIAS" \
            -srckeypass "$KS_KEY_PASS" \
            -destkeystore "$KEYCHECK" \
            -deststoretype PKCS12 \
            -deststorepass "$KS_PASS" \
            -destkeypass "$KS_PASS" \
            -noprompt >/dev/null
          rm -f "$KEYCHECK"

          LOCAL_PROPERTIES_B64="$(base64 -w0 < "$PROPS")"
          echo "::add-mask::$LOCAL_PROPERTIES_B64"
          echo "LOCAL_PROPERTIES=$LOCAL_PROPERTIES_B64" >> "$GITHUB_ENV"

          CERT_SHA256="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$KS_PASS" -alias "$KS_ALIAS" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test -n "$CERT_SHA256"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload first-run signing backup
        if: steps.signing.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SFA-RELEASE-SIGNING-KEY-FIRST-RUN-PRIVATE
          path: ${{ runner.temp }}/sfa-signing-backup
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Build SFA OtherRelease using upstream Gradle task
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |-
          set -euo pipefail
          cd sing-box-for-android
          ./gradlew --build-cache --parallel :app:assembleOtherRelease
          ./gradlew --stop

      - name: Verify final APK
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ steps.signing.outputs.cert_sha256 }}
        run: |-
          set -euo pipefail
          OUT='sing-box-for-android/app/build/outputs/apk/other/release'
          mapfile -t APKS < <(find "$OUT" -maxdepth 1 -type f -name '*.apk' -print | sort)
          printf 'APK outputs:\n'; printf '  %s\n' "${APKS[@]}"
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          "$ZIPALIGN" -c -v 4 "$APK"
          BADGING="$($AAPT dump badging "$APK")"
          grep -F "package: name='${PACKAGE_ID}'" <<<"$BADGING"
          grep -F "versionCode='731'" <<<"$BADGING"
          grep -F "versionName='${APP_VERSION}'" <<<"$BADGING"
          grep -F "sdkVersion:'24'" <<<"$BADGING"
          grep -F "application-label:'${APP_NAME}'" <<<"$BADGING"
          if grep -q '^application-debuggable' <<<"$BADGING"; then
            echo 'release APK is unexpectedly debuggable' >&2
            exit 1
          fi

          mapfile -t APK_ABIS < <(unzip -Z1 "$APK" | awk -F/ '/^lib\// && NF >= 3 {print $2}' | sort -u)
          printf 'APK ABI(s): %s\n' "${APK_ABIS[*]:-<none>}"
          test "${#APK_ABIS[@]}" -eq 1
          test "${APK_ABIS[0]}" = "$TARGET_ABI"
          unzip -Z1 "$APK" | grep -F "lib/${TARGET_ABI}/libgojni.so" >/dev/null

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          APK_CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test -n "$APK_CERT_SHA256"
          test "$APK_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

          mkdir -p dist
          FINAL="dist/SFA-${APP_VERSION}-${TARGET_ABI}.apk"
          cp "$APK" "$FINAL"
          sha256sum "$FINAL" | tee "${FINAL}.sha256"
          {
            echo "core_commit=${{ needs.build_libbox.outputs.core_commit }}"
            echo "sfa_commit=${SFA_COMMIT}"
            echo "version_name=${APP_VERSION}"
            echo 'version_code=731'
            echo "package_id=${PACKAGE_ID}"
            echo 'namespace=io.nekohasekai.sfa'
            echo "app_name=${APP_NAME}"
            echo "abi=${TARGET_ABI}"
            echo "go_version=$(go env GOVERSION)"
            echo "libbox_sha256=$(sha256sum libbox-inputs/libbox.aar | awk '{print $1}')"
            echo "apk_sha256=$(sha256sum "$FINAL" | awk '{print $1}')"
            echo "signing_cert_sha256=${APK_CERT_SHA256}"
          } > "${FINAL}.buildinfo.txt"
          cat "${FINAL}.buildinfo.txt"

      - name: Upload verified SFA release APK
        uses: actions/upload-artifact@v4
        with:
          name: SFA-${{ env.APP_VERSION }}-${{ env.TARGET_ABI }}-release
          path: |
            dist/SFA-${{ env.APP_VERSION }}-${{ env.TARGET_ABI }}.apk
            dist/SFA-${{ env.APP_VERSION }}-${{ env.TARGET_ABI }}.apk.sha256
            dist/SFA-${{ env.APP_VERSION }}-${{ env.TARGET_ABI }}.apk.buildinfo.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
